name: Duplicator Exact Permission Repair Once

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/duplicator-exact-permission-once.js'
      - '.github/workflows/duplicator-exact-permission-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply exact-first Duplicator repair
        run: node scripts/duplicator-exact-permission-once.js
      - name: Validate repaired Duplicator
        run: |
          set -euo pipefail
          node --check src/owner/dev/duplicator/core.js
          node --check src/owner/dev/duplicator/selective.js
          npm run syntax
          npm run imports
          npm run contracts
          node --test test/verification/duplicatorHistoryHardening.test.js
      - name: Commit repaired Duplicator
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add src/owner/dev/duplicator/core.js
          if git diff --cached --quiet; then
            echo "No Duplicator core changes to commit"
            exit 0
          fi
          git commit -m "fix(duplicator): attempt exact permissions before deferring"
          git push origin HEAD:dev
