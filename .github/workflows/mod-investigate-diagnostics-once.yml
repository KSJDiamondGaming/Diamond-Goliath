name: Diagnose Mod Investigate

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/mod-investigate-diagnostics-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read live Goliath dev logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            echo '===== LIVE COMMIT ====='
            cd /home/goliath/dev
            git rev-parse HEAD
            echo '===== PM2 STATUS ====='
            pm2 describe goliath-dev || true
            echo '===== RECENT MODERATION ERRORS ====='
            pm2 logs goliath-dev --lines 300 --nostream 2>&1 | grep -E -A12 -B6 'Moderation interaction failed|mod_open_quarantine|quarantine|Investigate|Unknown interaction|InteractionAlreadyReplied|DiscordAPIError|RangeError|TypeError|Error' || true
            echo '===== RECENT RAW TAIL ====='
            pm2 logs goliath-dev --lines 120 --nostream 2>&1 || true
