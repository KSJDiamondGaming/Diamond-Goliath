name: Apply Moderation Member Child Navigation

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/mod-member-child-nav-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply member child navigation cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/core/administration/mod/panel.js')
          text = path.read_text()

          old_intel = """function buildIntelligenceRows(targetId, member, guild) {
            if (!targetId) return [];
            const id = targetId; const rows = []; const first = [];
            if (canUseModAction(member, guild, 'scan_run')) first.push(createPrimaryButton(`mod_member_scan:${id}`, 'Full Member Scan', '🔎'));
            if (canUseModAction(member, guild, 'scan_history')) first.push(createSecondaryButton(`mod_scan_history:${id}`, 'Scan History', '📜'));
            if (canUseModAction(member, guild, 'scan_compare')) first.push(createSecondaryButton(`mod_scan_compare:${id}`, 'Compare', '⚖️'));
            if (canUseModAction(member, guild, 'scan_links')) first.push(createSecondaryButton(`mod_scan_links:${id}`, 'Link Evidence', '🔗'));
            const second = [];
            if (canUseModAction(member, guild, 'scan_notes')) second.push(createSecondaryButton(`mod_scan_note:${id}`, 'Add Note', '📝'));
            if (canUseModAction(member, guild, 'scan_watch')) second.push(createSecondaryButton(`mod_scan_watch:${id}`, 'Watch Status', '👁️'));
            for (const row of [buttonRow(first), buttonRow(second)]) if (row) rows.push(row);
            return rows;
          }"""

          new_intel = """function buildIntelligenceRows(targetId, member, guild) {
            if (!targetId) return [];
            const id = targetId; const rows = []; const first = [];
            if (canUseModAction(member, guild, 'scan_run')) first.push(createPrimaryButton(`mod_member_scan:${id}`, 'Full Member Scan', '🔎'));
            if (canUseModAction(member, guild, 'scan_history')) first.push(createSecondaryButton(`mod_scan_history:${id}`, 'Scan History', '📜'));
            if (canUseModAction(member, guild, 'scan_compare')) first.push(createSecondaryButton(`mod_scan_compare:${id}`, 'Compare Member', '⚖️'));
            const second = [];
            if (canUseModAction(member, guild, 'scan_links')) second.push(createSecondaryButton(`mod_scan_links:${id}`, 'Link Evidence', '🔗'));
            if (canUseModAction(member, guild, 'scan_notes')) second.push(createSecondaryButton(`mod_scan_note:${id}`, 'Add Note', '📝'));
            if (canUseModAction(member, guild, 'scan_watch')) second.push(createSecondaryButton(`mod_scan_watch:${id}`, 'Watch Status', '👁️'));
            for (const row of [buttonRow(first), buttonRow(second)]) if (row) rows.push(row);
            return rows;
          }"""

          old_nav = """  if (active !== 'actions' && active !== 'analytics' && targetId) {
            const candidates = [
              ['actions', '⚡ Moderation'],
              ['intelligence', '🧠 Intelligence'],
              ['cases', '📁 Cases'],
            ].filter(([view]) => canViewDashboardSection(member, guild, view)).filter(([view]) => view !== active);
            const buttons = candidates.map(([view, label]) => new ButtonBuilder().setCustomId(`mod_dashboard:${id}:${view}`).setLabel(label).setStyle(ButtonStyle.Secondary));
            if (buttons.length) rows.push(new ActionRowBuilder().addComponents(buttons));
          }
"""

          if old_intel not in text:
              raise SystemExit('Expected buildIntelligenceRows block not found; refusing to patch stale source.')
          if old_nav not in text:
              raise SystemExit('Expected child-navigation block not found; refusing to patch stale source.')

          text = text.replace(old_intel, new_intel, 1)
          text = text.replace(old_nav, '', 1)
          path.write_text(text)
          PY
      - name: Verify intended layout
        run: |
          grep -F "'Compare Member'" src/core/administration/mod/panel.js
          grep -F "'Link Evidence'" src/core/administration/mod/panel.js
          ! grep -F "['actions', '⚡ Moderation']" src/core/administration/mod/panel.js
          node --check src/core/administration/mod/panel.js
      - name: Remove temporary workflow
        run: rm -f .github/workflows/mod-member-child-nav-once.yml
      - name: Validate source
        run: npm run doctor
      - name: Commit clean source to dev
        run: |
          git config user.name 'KSJHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add src/core/administration/mod/panel.js .github/workflows/mod-member-child-nav-once.yml
          git diff --cached --check
          git commit -m 'refactor(mod): simplify member child navigation'
          git push origin HEAD:dev
