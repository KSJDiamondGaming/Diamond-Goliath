name: Fix Member Intelligence Routing Once

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/fix-mod-intelligence-routing-once.js'
      - '.github/workflows/fix-mod-intelligence-routing-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply source patch
        run: node scripts/fix-mod-intelligence-routing-once.js
      - name: Remove temporary patch files
        run: rm -f scripts/fix-mod-intelligence-routing-once.js .github/workflows/fix-mod-intelligence-routing-once.yml
      - name: Validate source
        run: |
          node -c src/core/administration/mod/interactions.js
          npm run doctor
          npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/administration/mod/interactions.js scripts/fix-mod-intelligence-routing-once.js .github/workflows/fix-mod-intelligence-routing-once.yml
          git commit -m 'fix(mod): route intelligence directly to unified workspace'
          git push origin HEAD:dev
      - name: Deploy current dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-dev.yml --ref dev -f environment=dev
