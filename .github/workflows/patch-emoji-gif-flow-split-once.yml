name: Patch Emoji GIF Flow Split Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-emoji-gif-flow-split-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Split static emoji and animated GIF flows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor missing')
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'{label} start anchor missing')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'{label} end anchor missing')
              return text[:a] + replacement + text[b:]

          media_path = Path('src/modules/utilityStudio/emojis/emojiMedia.js')
          media = media_path.read_text()
          old = "  const animated = Number(metadata.pages || 1) > 1;\n  if (animated) return prepareAnimatedEmoji(source, metadata, { ...options, maxSourceBytes });\n"
          new = "  const animated = Number(metadata.pages || 1) > 1;\n  if (animated && options.rejectAnimated === true) throw new Error('Animated media must be added through Add GIF.');\n  if (!animated && options.requireAnimated === true) throw new Error('That file is static. Use Add Emoji instead.');\n  if (animated) return prepareAnimatedEmoji(source, metadata, { ...options, maxSourceBytes });\n"
          media = replace_once(media, old, new, 'emojiMedia animation routing')
          media_path.write_text(media)

          api_path = Path('src/modules/utilityStudio/emojis/emojisApi.js')
          api = api_path.read_text()
          old = "    forceStaticFallback: options.forceStaticFallback === true,\n"
          new = "    forceStaticFallback: options.forceStaticFallback === true,\n    rejectAnimated: options.rejectAnimated === true,\n    requireAnimated: options.requireAnimated === true,\n"
          api = replace_once(api, old, new, 'emojisApi media options')
          api_path.write_text(api)

          panel_path = Path('src/modules/utilityStudio/emojis/emojisPanel.js')
          panel = panel_path.read_text()

          new_panels = '''function addPanel(interaction) {
            return { embeds: [new EmbedBuilder().setColor(PANEL_COLOR).setTitle('➕ Add Emoji').setDescription([
              'Add static emojis to this server. Animated media is handled separately through the **Add GIF** button on the main panel.', '',
              '**Browse Emojis** — search the online emoji collection.',
              '**Upload Emoji** — add a static image from your device.',
              '**Add Image Link** — paste a direct static image link.',
            ].join('\\n')).setFooter({ text: `Requested by ${memberName(interaction)}` })], components: [
              row(button('admin:module:emojis:search-open', '🔎 Browse Emojis', ButtonStyle.Primary), button('admin:module:emojis:bulk-open', '🖼️ Upload Emoji', ButtonStyle.Primary), button('admin:module:emojis:import-url-open', '🔗 Add Image Link', ButtonStyle.Secondary)),
              row(button('admin:module:emojis:panel', '⬅️ Back', ButtonStyle.Secondary), button('admin:module:emojis:settings', '⚙️ Settings', ButtonStyle.Secondary)),
            ] };
          }

          function gifPanel(interaction) {
            return { embeds: [new EmbedBuilder().setColor(PANEL_COLOR).setTitle('🎞️ Add GIF').setDescription([
              'Add animated media through this dedicated GIF flow. Goliath will preserve animation and optimise it for Discord automatically.', '',
              '**Upload GIF / Animation** — upload GIF, animated WebP, APNG or AVIF from your device.',
              '**Add GIF Link** — paste a direct link to animated media.',
              '',
              'If an animation cannot fit Discord’s size limit, Goliath will offer the explicit static first-frame fallback here.',
            ].join('\\n')).setFooter({ text: `Requested by ${memberName(interaction)}` })], components: [
              row(button('admin:module:emojis:gif-upload-file-open', '🎞️ Upload GIF', ButtonStyle.Success), button('admin:module:emojis:gif-import-url-open', '🔗 Add GIF Link', ButtonStyle.Secondary)),
              row(button('admin:module:emojis:panel', '⬅️ Back', ButtonStyle.Secondary)),
            ] };
          }

          '''
          panel = replace_between(panel, 'function addPanel(interaction) {\n', 'function settingsPanel(', new_panels, 'panel split')

          old = "function urlImportModal() { return new ModalBuilder().setCustomId('admin:module:emojis:import-url-submit').setTitle('Add Emoji or GIF from Link').addComponents(row(new TextInputBuilder().setCustomId('imageUrl').setLabel('Image / GIF / animation link').setStyle(TextInputStyle.Short).setRequired(true).setMaxLength(1000)), row(new TextInputBuilder().setCustomId('name').setLabel('Emoji / GIF name (optional)').setStyle(TextInputStyle.Short).setRequired(false).setMaxLength(32))); }\n"
          new = "function urlImportModal() { return new ModalBuilder().setCustomId('admin:module:emojis:import-url-submit').setTitle('Add Emoji from Image Link').addComponents(row(new TextInputBuilder().setCustomId('imageUrl').setLabel('Static image link').setStyle(TextInputStyle.Short).setRequired(true).setMaxLength(1000)), row(new TextInputBuilder().setCustomId('name').setLabel('Emoji name (optional)').setStyle(TextInputStyle.Short).setRequired(false).setMaxLength(32))); }\nfunction gifUrlImportModal() { return new ModalBuilder().setCustomId('admin:module:emojis:gif-import-url-submit').setTitle('Add GIF from Link').addComponents(row(new TextInputBuilder().setCustomId('imageUrl').setLabel('GIF / animation link').setStyle(TextInputStyle.Short).setRequired(true).setMaxLength(1000)), row(new TextInputBuilder().setCustomId('name').setLabel('GIF name (optional)').setStyle(TextInputStyle.Short).setRequired(false).setMaxLength(32))); }\n"
          panel = replace_once(panel, old, new, 'URL modal')

          old = "function gifUploadModal() { const upload = new FileUploadBuilder().setCustomId('files').setMinValues(1).setMaxValues(10).setRequired(true); return new ModalBuilder().setCustomId('admin:module:emojis:bulk-submit').setTitle('Upload GIF / Animation').addComponents(new LabelBuilder().setLabel('Choose animated files').setDescription('GIF, animated WebP, APNG or AVIF. Goliath will optimise while preserving animation where possible.').setFileUploadComponent(upload)); }\n"
          new = "function gifUploadModal() { const upload = new FileUploadBuilder().setCustomId('files').setMinValues(1).setMaxValues(10).setRequired(true); return new ModalBuilder().setCustomId('admin:module:emojis:gif-bulk-submit').setTitle('Upload GIF / Animation').addComponents(new LabelBuilder().setLabel('Choose animated files').setDescription('GIF, animated WebP, APNG or AVIF. Goliath will optimise while preserving animation where possible.').setFileUploadComponent(upload)); }\n"
          panel = replace_once(panel, old, new, 'GIF upload modal')

          panel = replace_once(panel,
              "  if (id === 'admin:module:emojis:import-url-open') { await interaction.showModal(urlImportModal()); return true; }\n",
              "  if (id === 'admin:module:emojis:import-url-open') { await interaction.showModal(urlImportModal()); return true; }\n  if (id === 'admin:module:emojis:gif-import-url-open') { await interaction.showModal(gifUrlImportModal()); return true; }\n",
              'GIF URL open handler')

          panel = replace_once(panel,
              "  if (id === 'admin:module:emojis:gif-upload-open') { await interaction.showModal(gifUploadModal()); return true; }\n",
              "  if (id === 'admin:module:emojis:gif-upload-open') { await sendPanel(interaction, gifPanel(interaction)); return true; }\n  if (id === 'admin:module:emojis:gif-upload-file-open') { await interaction.showModal(gifUploadModal()); return true; }\n",
              'GIF main button handler')

          old = "  if (id === 'admin:module:emojis:import-url-submit' && interaction.isModalSubmit?.()) { await interaction.deferReply({ flags: MessageFlags.Ephemeral }); const result = await emojis.importFromUrl(interaction.client, interaction.fields.getTextInputValue('imageUrl'), interaction.fields.getTextInputValue('name') || null); emojiStore.setFavourite(guildId, result.emoji.id, true, { actorId: interaction.user?.id, action: 'emoji_url_import' }); await interaction.editReply(addedEmojiPanel(result, interaction)); return true; }\n"
          new = '''  if (id === 'admin:module:emojis:import-url-submit' && interaction.isModalSubmit?.()) {
            await interaction.deferReply({ flags: MessageFlags.Ephemeral });
            const imageUrl = interaction.fields.getTextInputValue('imageUrl');
            const requestedName = interaction.fields.getTextInputValue('name') || null;
            const prepared = await emojiApi.prepareDownloadedAsset(imageUrl, { rejectAnimated: true });
            let name = requestedName || 'emoji';
            if (!requestedName) { try { name = decodeURIComponent(new URL(imageUrl).pathname.split('/').pop() || 'emoji').replace(/\\.[a-z0-9]+$/i, '') || 'emoji'; } catch {} }
            const created = await emojis.createStudioEmoji(interaction.client, prepared.buffer, name);
            const result = { ...created, ...prepared, emoji: created.emoji };
            emojiStore.setFavourite(guildId, result.emoji.id, true, { actorId: interaction.user?.id, action: 'emoji_url_import' });
            await interaction.editReply(addedEmojiPanel(result, interaction));
            return true;
          }
          if (id === 'admin:module:emojis:gif-import-url-submit' && interaction.isModalSubmit?.()) {
            await interaction.deferReply({ flags: MessageFlags.Ephemeral });
            const imageUrl = interaction.fields.getTextInputValue('imageUrl');
            const requestedName = interaction.fields.getTextInputValue('name') || null;
            const prepared = await emojiApi.prepareDownloadedAsset(imageUrl, { requireAnimated: true });
            let name = requestedName || 'gif';
            if (!requestedName) { try { name = decodeURIComponent(new URL(imageUrl).pathname.split('/').pop() || 'gif').replace(/\\.[a-z0-9]+$/i, '') || 'gif'; } catch {} }
            const created = await emojis.createStudioEmoji(interaction.client, prepared.buffer, name);
            const result = { ...created, ...prepared, emoji: created.emoji };
            emojiStore.setFavourite(guildId, result.emoji.id, true, { actorId: interaction.user?.id, action: 'emoji_gif_url_import' });
            await interaction.editReply(addedEmojiPanel(result, interaction));
            return true;
          }
'''
          panel = replace_once(panel, old, new, 'URL submit split')

          old = "  if (id.startsWith('admin:module:emojis:import-confirm:') && interaction.isButton?.()) { const emojiGgId = id.slice('admin:module:emojis:import-confirm:'.length); if (!/^\\d+$/.test(emojiGgId)) throw new Error('That emoji could not be identified. Search for it again.'); await interaction.deferUpdate(); const result = await emojis.importFromEmojiGG(interaction.client, emojiGgId); emojiStore.setFavourite(guildId, result.emoji.id, true, { actorId: interaction.user?.id, action: 'emoji_discord_import' }); await interaction.editReply(addedEmojiPanel(result, interaction)); return true; }\n"
          new = '''  if (id.startsWith('admin:module:emojis:import-confirm:') && interaction.isButton?.()) {
            const emojiGgId = id.slice('admin:module:emojis:import-confirm:'.length);
            if (!/^\\d+$/.test(emojiGgId)) throw new Error('That emoji could not be identified. Search for it again.');
            await interaction.deferUpdate();
            const entry = await emojiApi.findById(emojiGgId);
            if (!entry) throw new Error('That emoji could not be found anymore. Try searching again.');
            const prepared = await emojiApi.prepareDownloadedAsset(emojiApi.assetUrl(entry), { rejectAnimated: true });
            const created = await emojis.createStudioEmoji(interaction.client, prepared.buffer, cleanSearchName(entry));
            const result = { ...created, ...prepared, emoji: created.emoji };
            emojiStore.setFavourite(guildId, result.emoji.id, true, { actorId: interaction.user?.id, action: 'emoji_discord_import' });
            await interaction.editReply(addedEmojiPanel(result, interaction));
            return true;
          }
'''
          panel = replace_once(panel, old, new, 'browse import enforcement')

          panel = replace_once(panel,
              "  if (id === 'admin:module:emojis:bulk-submit' && interaction.isModalSubmit?.()) {\n",
              "  if ((id === 'admin:module:emojis:bulk-submit' || id === 'admin:module:emojis:gif-bulk-submit') && interaction.isModalSubmit?.()) {\n",
              'bulk handler selector')

          panel = replace_once(panel,
              "    await interaction.deferReply({ flags: MessageFlags.Ephemeral });\n    const lines = [];\n    let animated = 0; let optimised = 0; let failed = 0; let fallbackEligible = 0;\n",
              "    await interaction.deferReply({ flags: MessageFlags.Ephemeral });\n    const gifOnly = id === 'admin:module:emojis:gif-bulk-submit';\n    const lines = [];\n    let animated = 0; let optimised = 0; let failed = 0; let fallbackEligible = 0;\n",
              'bulk mode flag')

          panel = replace_once(panel,
              "        const prepared = await emojiApi.prepareAttachmentAsset(attachment);\n",
              "        const prepared = await emojiApi.prepareAttachmentAsset(attachment, gifOnly ? { requireAnimated: true } : { rejectAnimated: true });\n",
              'bulk media enforcement')

          panel = replace_once(panel,
              "        if (message.includes('without flattening the animation')) fallbackEligible += 1;\n",
              "        if (gifOnly && message.includes('without flattening the animation')) fallbackEligible += 1;\n",
              'fallback GIF-only enforcement')

          panel = replace_once(panel,
              "    await interaction.editReply({ embeds: [new EmbedBuilder().setColor(failed ? 0xFEE75C : 0x57F287).setTitle('📤 Emoji & GIF Upload Complete').setDescription(`${summary}\\n\\n${lines.join('\\n')}`.slice(0, 4000))], components });\n",
              "    await interaction.editReply({ embeds: [new EmbedBuilder().setColor(failed ? 0xFEE75C : 0x57F287).setTitle(gifOnly ? '🎞️ GIF Upload Complete' : '🖼️ Emoji Upload Complete').setDescription(`${summary}\\n\\n${lines.join('\\n')}`.slice(0, 4000))], components });\n",
              'bulk result title')

          panel_path.write_text(panel)
          PY
      - name: Validate changed source
        run: |
          node --check src/modules/utilityStudio/emojis/emojiMedia.js
          node --check src/modules/utilityStudio/emojis/emojisApi.js
          node --check src/modules/utilityStudio/emojis/emojisPanel.js
      - name: Remove temporary workflow
        run: git rm .github/workflows/patch-emoji-gif-flow-split-once.yml
      - name: Run doctor
        run: npm run doctor
      - name: Build dashboard
        run: npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Commit clean source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/utilityStudio/emojis/emojiMedia.js src/modules/utilityStudio/emojis/emojisApi.js src/modules/utilityStudio/emojis/emojisPanel.js
          git commit -m 'fix(emojis): separate static emoji and GIF add flows'
          git push origin HEAD:dev
