name: Patch Emoji GIF Flow Split Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-emoji-gif-flow-split-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply flow split patch
        run: node scripts/patch-emoji-gif-flow-once.js
      - name: Validate changed source
        run: |
          node --check src/modules/utilityStudio/emojis/emojiMedia.js
          node --check src/modules/utilityStudio/emojis/emojisApi.js
          node --check src/modules/utilityStudio/emojis/emojisPanel.js
      - name: Remove temporary patch files
        run: |
          git rm .github/workflows/patch-emoji-gif-flow-split-once.yml
          git rm scripts/patch-emoji-gif-flow-once.js
      - name: Run doctor
        run: npm run doctor
      - name: Build dashboard
        run: npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Commit clean source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/utilityStudio/emojis/emojiMedia.js src/modules/utilityStudio/emojis/emojisApi.js src/modules/utilityStudio/emojis/emojisPanel.js
          git commit -m 'fix(emojis): separate static emoji and GIF add flows'
          git push origin HEAD:dev
