name: One-time owner diagnostics runtime consolidation

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/owner-diagnostics-runtime-consolidation.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply exact consolidation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/server/routes/ownerDiagnostics.js';
          const original = fs.readFileSync(file, 'utf8');

          const pathImport = "const path = require('path');\n";
          const runtimeImport = "const { getRuntimeRoot, resolveRuntimePath } = require('../../config/runtimePaths');\n";
          const oldRoot = "  const root = path.join(process.cwd(), 'runtime', getEnvironmentKey(environment));";
          const newRoot = "  const root = getRuntimeRoot(getEnvironmentKey(environment));";
          const replacements = [
            ["    path.join(process.cwd(), 'runtime', getEnvironmentKey(environment), 'deployments', 'history.json'),", "    resolveRuntimePath(getEnvironmentKey(environment), 'deployments', 'history.json'),"],
            ["    path.join(process.cwd(), 'runtime', getEnvironmentKey(environment), 'data', 'deployments.json'),", "    resolveRuntimePath(getEnvironmentKey(environment), 'data', 'deployments.json'),"],
            ["    path.join(process.cwd(), 'runtime', getEnvironmentKey(environment), 'logs', 'deployments.json'),", "    resolveRuntimePath(getEnvironmentKey(environment), 'logs', 'deployments.json'),"],
          ];

          if ((original.match(/const path = require\('path'\);/g) || []).length !== 1) throw new Error('Unexpected path import count.');
          if ((original.match(/path\.join\(process\.cwd\(\), 'runtime', getEnvironmentKey\(environment\)/g) || []).length !== 4) throw new Error('Unexpected runtime construction count.');
          if (original.includes(runtimeImport.trim())) throw new Error('Canonical runtime import already exists.');

          let updated = original.replace(pathImport, `${pathImport}${runtimeImport}`);
          updated = updated.replace(oldRoot, newRoot);
          for (const [from, to] of replacements) updated = updated.replace(from, to);

          if (updated === original) throw new Error('No changes applied.');
          if (/path\.join\(process\.cwd\(\), 'runtime', getEnvironmentKey\(environment\)/.test(updated)) throw new Error('Duplicate runtime construction remains.');
          if (!updated.includes(runtimeImport.trim())) throw new Error('Canonical import missing.');

          fs.writeFileSync(file, updated, 'utf8');
          NODE

      - name: Verify
        run: |
          node --check src/server/routes/ownerDiagnostics.js
          git diff --check

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/owner-diagnostics-runtime-consolidation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/routes/ownerDiagnostics.js .github/workflows/owner-diagnostics-runtime-consolidation.yml
          git diff --cached --check
          git commit -m "use canonical runtime paths for owner diagnostics"
          git push origin dev
