name: Case Management Phase 28 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/case-management-phase28-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply compact case labels
        run: python3 .github/case-management-phase28.py
      - name: Validate source
        run: node --check src/core/administration/mod/caseCourt.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: node -e "require('./src/core/administration/mod/caseCourt')"
      - name: Remove one-off files before Doctor
        run: rm -f .github/case-management-phase28.py .github/workflows/case-management-phase28-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit compact case labels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(mod): compact case workspace controls"
          git pull --rebase origin dev
          git push origin HEAD:dev
