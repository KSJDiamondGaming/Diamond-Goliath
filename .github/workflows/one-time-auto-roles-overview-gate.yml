name: One-time Auto Roles overview gate hardening

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-time-auto-roles-overview-gate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align overview with canonical module gate
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'src/modules/roleStudio/autoRoles/autoRolesRoute.js';
          let source = fs.readFileSync(file, 'utf8');
          const before = '      enabled: config.enabled !== false,';
          const after = '      enabled: autoroles.isAutoRolesEnabled(guildId),';
          if (!source.includes(before)) throw new Error('Expected Auto Roles overview enabled line not found');
          source = source.replace(before, after);
          fs.writeFileSync(file, source);
          NODE
          rm .github/workflows/one-time-auto-roles-overview-gate.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/roleStudio/autoRoles/autoRolesRoute.js .github/workflows/one-time-auto-roles-overview-gate.yml
          git commit -m "Harden Auto Roles dashboard overview module gate"
          git push origin dev
