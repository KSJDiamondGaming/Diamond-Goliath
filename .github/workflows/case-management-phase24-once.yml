name: Case Management Phase 24 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/case-management-phase24.py'
      - '.github/workflows/case-management-phase24-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Apply case selector titles and delete controls
        run: python3 .github/case-management-phase24.py
      - name: Validate source
        run: |
          node --check src/core/administration/mod/caseCourt.js
          node --check src/core/administration/mod/permissions.js
          node --check src/core/administration/admin/panel.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: |
          node -e "require('./src/core/administration/mod/caseCourt')"
          node -e "require('./src/core/administration/mod/permissions')"
          node -e "require('./src/core/administration/admin/panel')"
      - name: Remove one-off files before Doctor
        run: |
          rm -f .github/case-management-phase24.py
          rm -f .github/workflows/case-management-phase24-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit case selector titles and delete controls
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat(mod): improve case selection and protected deletion'
          git pull --rebase origin dev
          git push origin HEAD:dev
