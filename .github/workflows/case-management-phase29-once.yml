name: Case Management Phase 29 Once
on:
  push:
    branches: [dev]
    paths:
      - '.github/case-management-phase29.py'
      - '.github/workflows/case-management-phase29-once.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply selector identity layout
        run: python3 .github/case-management-phase29.py
      - name: Validate source
        run: node --check src/core/administration/mod/caseCourt.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: node -e "require('./src/core/administration/mod/caseCourt')"
      - name: Remove one-off files before Doctor
        run: rm -f .github/case-management-phase29.py .github/workflows/case-management-phase29-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit selector identity layout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(mod): improve case selector identity layout"
          git pull --rebase origin dev
          git push origin HEAD:dev
