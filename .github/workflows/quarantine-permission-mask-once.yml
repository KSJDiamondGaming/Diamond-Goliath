name: Quarantine Permission Repair Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/quarantine-permission-mask-once.js'
      - '.github/workflows/quarantine-permission-mask-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply quarantine permission repair
        run: node .github/quarantine-permission-mask-once.js
      - name: Remove one-off files before validation
        run: |
          rm -f .github/quarantine-permission-mask-once.js
          rm -f .github/workflows/quarantine-permission-mask-once.yml
      - name: Validate source
        run: |
          node --check src/core/security/protection/quarantine.js
          npm run doctor
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(security): make quarantine isolation permission-safe"
          git push origin HEAD:dev
