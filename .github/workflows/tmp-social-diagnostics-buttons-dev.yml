name: Tidy Social Studio diagnostics buttons DEV
on:
  push:
    paths:
      - '.github/workflows/tmp-social-diagnostics-buttons-dev.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Reorder diagnostics buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/modules/socialStudio/socialAlerts/socialStudioPanel.js')
          s = p.read_text()
          old = "return { embeds: [embed(config, '🧪 Diagnostics', d, who(i))], components: [row(btn(`${P}test`, '📨 Send Test', ButtonStyle.Primary, !config.alertsChannelId), btn(`${P}testing:last`, '📄 Last Response'), btn(`${P}testing:diagnostics`, '🩺 Provider Details'), btn(`${P}data:refresh`, '🔄 Refresh')), row(btn(`${P}data:export:config`, '📤 Config Export', ButtonStyle.Primary), btn(`${P}data:export`, '🗂️ History Export', ButtonStyle.Secondary), btn(`${P}data:clear`, '🧹 Clear History', ButtonStyle.Danger, !config.history.length)), row(btn(`${P}settings`, '⬅️ Back'), btn(`${P}main`, '🏠 Social Studio'))] };"
          new = "return { embeds: [embed(config, '🧪 Diagnostics', d, who(i))], components: [row(btn(`${P}test`, '📨 Send Test', ButtonStyle.Primary, !config.alertsChannelId), btn(`${P}testing:last`, '📄 Last Response'), btn(`${P}testing:diagnostics`, '🩺 Provider Details')), row(btn(`${P}data:export:config`, '📤 Config Export', ButtonStyle.Primary), btn(`${P}data:export`, '🗂️ History Export', ButtonStyle.Secondary), btn(`${P}data:clear`, '🧹 Clear History', ButtonStyle.Danger, !config.history.length)), row(btn(`${P}settings`, '⬅️ Back'), btn(`${P}main`, '🏠 Social Studio'), btn(`${P}data:refresh`, '🔄 Refresh'))] };"
          if old not in s:
              raise SystemExit('Target diagnostics component block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/socialStudio/socialAlerts/socialStudioPanel.js
          git commit -m 'fix: tidy Social Studio diagnostics controls'
          git push origin dev
