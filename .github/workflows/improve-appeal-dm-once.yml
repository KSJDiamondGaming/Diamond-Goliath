name: Improve Appeal DM Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/improve-appeal-dm-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply appeal DM patch
        run: node scripts/improve-appeal-dm-once.js
      - name: Validate source
        run: |
          node --check src/core/administration/mod/storage.js
          node -e "require('./src/core/administration/mod/storage')"
          grep -Fq '/appeal' src/core/administration/mod/storage.js
          if grep -Fq '/mod appeal:' src/core/administration/mod/storage.js; then exit 1; fi
      - name: Remove one-off files before Doctor
        run: |
          rm -f scripts/improve-appeal-dm-once.js
          rm -f .github/workflows/improve-appeal-dm-once.yml
      - name: Doctor
        run: npm run doctor
      - name: Commit source change
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/core/administration/mod/storage.js
          git commit -m "feat(mod): make appeal notice user friendly"
          git push origin dev
