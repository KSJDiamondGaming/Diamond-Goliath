name: Fix Windows Path Audit

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/fix-windows-path-audit.trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Correct detector and verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('scripts/goliath.js')
          source = target.read_text(encoding='utf-8')
          old = "    if (/[A-Za-z]:\\\\[^\\s'\"`]+/.test(source)) windowsPaths.push(relative);"
          new = "    const windowsPath = /\\b[A-Za-z]:\\\\[^\\\\\\r\\n'\"`]+(?:\\\\[^\\\\\\r\\n'\"`]+)+|\\b[A-Za-z]:\\\\[^\\\\\\r\\n'\"`]*\\.[A-Za-z0-9]{1,8}\\b/;\n    if (windowsPath.test(source)) windowsPaths.push(relative);"
          if old not in source:
              raise SystemExit('Expected Windows path detector was not found')
          target.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          node --check scripts/goliath.js
          node scripts/goliath.js source | tee .github/fix-windows-path-audit-report.txt
          ! grep -q "Absolute Windows paths: [1-9]" .github/fix-windows-path-audit-report.txt
      - name: Commit verified correction
        run: |
          rm -f .github/fix-windows-path-audit.trigger .github/fix-windows-path-audit-report.txt .github/workflows/fix-windows-path-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/goliath.js .github/fix-windows-path-audit.trigger .github/workflows/fix-windows-path-audit.yml
          git commit -m "Fix false Windows path audit matches"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
