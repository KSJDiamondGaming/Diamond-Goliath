name: Patch Duplicator Delete Buttons Once

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/patch-duplicator-delete-buttons-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Patch controls
        run: |
          python3 -c "from pathlib import Path; p=Path('src/owner/dev/duplicator/selective.js'); s=p.read_text(); s=s.replace(\".setLabel('Previous').setStyle(ButtonStyle.Secondary)\", \".setLabel('Previous').setEmoji('⬅️').setStyle(ButtonStyle.Secondary)\", 1); s=s.replace(\".setLabel('Next').setStyle(ButtonStyle.Secondary)\", \".setLabel('Next').setEmoji('➡️').setStyle(ButtonStyle.Secondary)\", 1); s=s.replace(\"new ButtonBuilder().setCustomId(componentId(session, 'delete-clear-page')).setLabel('Clear Page').setStyle(ButtonStyle.Secondary),\\n      ),\\n      new ActionRowBuilder().addComponents(\\n        new ButtonBuilder().setCustomId(componentId(session, 'delete-review')).setLabel('Review Delete')\", \"),\\n      new ActionRowBuilder().addComponents(\\n        new ButtonBuilder().setCustomId(componentId(session, 'delete-clear-page')).setLabel('Clear Page').setStyle(ButtonStyle.Secondary),\\n        new ButtonBuilder().setCustomId(componentId(session, 'delete-review')).setLabel('Review Selected')\", 1); p.write_text(s)"
          grep -q "setLabel('Review Selected')" src/owner/dev/duplicator/selective.js
      - name: Validate
        run: |
          node --check src/owner/dev/duplicator/selective.js
          npm run doctor
          npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/owner/dev/duplicator/selective.js
          git commit -m 'ui(duplicator): improve bulk delete controls'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
