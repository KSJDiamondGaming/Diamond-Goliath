name: Patch Duplicator Delete Buttons Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-duplicator-delete-buttons-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch button layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/owner/dev/duplicator/selective.js')
          s = p.read_text()
          old = """      new ActionRowBuilder().addComponents(
        new ButtonBuilder().setCustomId(componentId(session, 'delete-prev')).setLabel('Previous').setStyle(ButtonStyle.Secondary).setDisabled(page.safePage === 0),
        new ButtonBuilder().setCustomId(componentId(session, 'delete-next')).setLabel('Next').setStyle(ButtonStyle.Secondary).setDisabled(page.safePage >= page.pageCount - 1),
        new ButtonBuilder().setCustomId(componentId(session, 'delete-select-page')).setLabel('Select Page').setStyle(ButtonStyle.Secondary),
        new ButtonBuilder().setCustomId(componentId(session, 'delete-clear-page')).setLabel('Clear Page').setStyle(ButtonStyle.Secondary),
      ),
      new ActionRowBuilder().addComponents(
        new ButtonBuilder().setCustomId(componentId(session, 'delete-review')).setLabel('Review Delete').setEmoji('🗑️').setStyle(ButtonStyle.Danger).setDisabled(session.deleteSelected.size === 0),
        new ButtonBuilder().setCustomId(componentId(session, 'home')).setLabel('Cancel').setStyle(ButtonStyle.Secondary),
      ),"""
          new = """      new ActionRowBuilder().addComponents(
        new ButtonBuilder().setCustomId(componentId(session, 'delete-prev')).setLabel('Previous').setEmoji('⬅️').setStyle(ButtonStyle.Secondary).setDisabled(page.safePage === 0),
        new ButtonBuilder().setCustomId(componentId(session, 'delete-next')).setLabel('Next').setEmoji('➡️').setStyle(ButtonStyle.Secondary).setDisabled(page.safePage >= page.pageCount - 1),
        new ButtonBuilder().setCustomId(componentId(session, 'delete-select-page')).setLabel('Select Page').setStyle(ButtonStyle.Secondary),
      ),
      new ActionRowBuilder().addComponents(
        new ButtonBuilder().setCustomId(componentId(session, 'delete-clear-page')).setLabel('Clear Page').setStyle(ButtonStyle.Secondary),
        new ButtonBuilder().setCustomId(componentId(session, 'delete-review')).setLabel('Review Selected').setEmoji('🗑️').setStyle(ButtonStyle.Danger).setDisabled(session.deleteSelected.size === 0),
        new ButtonBuilder().setCustomId(componentId(session, 'home')).setLabel('Cancel').setStyle(ButtonStyle.Secondary),
      ),"""
          if old not in s:
              raise SystemExit('Bulk Delete button block not found; aborting safely')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          node --check src/owner/dev/duplicator/selective.js
          npm run doctor
          npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/owner/dev/duplicator/selective.js
          git commit -m 'ui(duplicator): improve bulk delete controls'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
