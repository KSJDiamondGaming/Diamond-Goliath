name: Polish Member Intelligence V3 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/polish-member-intelligence-v3-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rewrite Member Intelligence presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/core/administration/mod/intelligence.js')
          text = path.read_text()
          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label} not found; refusing unsafe rewrite')
              text = text.replace(old, new, 1)
          def sub_once(pattern, replacement, label):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label} matched {count} times; refusing unsafe rewrite')
          sub_once(r"  const investigationWatch = report\.investigation\?\.watched \? 'ON' : 'OFF';\n  const externalSummary = reputation\.verifiedExternal\n    \? `\*\*\$\{reputation\.verifiedExternal\} verified\*\*`\n    : 'No verified records';\n\n  report\.embed\n    \.setTitle\(`🧠 Member Intelligence • \$\{target\.user\.tag\}`\)\n    \.setDescription\(\[\n      `\*\*Target:\*\* \$\{target\.user\} \(\\`\$\{target\.id\}\\`\)`,\n      'Evidence-led member overview for authorized management\. Start with status and risk, then open a drill-down when more detail is needed\.',\n    \]\.join\('\\\\n\\\\n'\)\)\n    \.setFooter\(\{ text: `Scan \$\{report\.scanId\} • Scanned by \$\{interaction\.user\?\.tag \|\| interaction\.user\?\.username \|\| interaction\.user\?\.id \|\| 'Unknown'\} • evidence-based intelligence` \}\);", "  const investigationWatch = report.investigation?.watched ? 'On' : 'Off';\n\n  report.embed\n    .setTitle(`🧠 Member Intelligence • ${target.user.tag}`)\n    .setDescription([\n      `**Target:** ${target.user} (\\`${target.id}\\`)`,\n      'Evidence-led member overview for authorised management. Key intelligence and investigation state are summarised below.',\n    ].join('\\n\\n'))\n    .setFooter({ text: `Scanned by ${interaction.user?.tag || interaction.user?.username || interaction.user?.id || 'Unknown'} • Evidence-based intelligence` });", 'header block')
          replace_once("    riskLines.push('Risk factors **No verified risk factors**');", "    riskLines.push('**No verified risk factors**');", 'risk fallback')
          sub_once(r"  const previousIdentityValues = \[\.\.\.knownIdentityValues\]\.filter\(\(value\) => !currentIdentityValues\.has\(value\)\);\n  const identityEventCount = Array\.isArray\(identity\.events\) \? identity\.events\.length : 0;\n  const identityStatus = previousIdentityValues\.length\n    \? `\*\*\$\{previousIdentityValues\.length\} previous name value\(s\)\*\* • \$\{identityEventCount\} recorded event\(s\)`\n    : '\*\*No recorded identity changes\*\*';", "  const previousIdentityValues = [...knownIdentityValues].filter((value) => !currentIdentityValues.has(value));\n  const identityChanges = (Array.isArray(identity.events) ? identity.events : []).filter((event) => {\n    if (event.event === 'user.identity.update') return true;\n    if (event.event !== 'member.update' && event.event !== 'member.scan.observed') return false;\n    const before = json(event.before_value, {});\n    const after = json(event.after_value, {});\n    const hasBeforeIdentity = before.username || before.globalName || before.displayName;\n    const hasAfterIdentity = after.username || after.globalName || after.displayName;\n    if (!hasBeforeIdentity || !hasAfterIdentity) return false;\n    return before.username !== after.username || before.globalName !== after.globalName || before.displayName !== after.displayName;\n  });\n  const identityChangeCount = Math.max(previousIdentityValues.length, identityChanges.length);\n  const latestIdentityChange = identityChanges[0]?.created_at || null;\n  const identityStatus = identityChangeCount\n    ? `**${identityChangeCount} change${identityChangeCount === 1 ? '' : 's'}**${latestIdentityChange ? ` • Last ${discordTime(latestIdentityChange, 'R')}` : ''}`\n    : '**No recorded changes**';", 'identity summary')
          replace_once("    `Identity ${identityStatus}`,", "    `Identity: ${identityStatus}`,", 'identity line')
          replace_once("      ? `Latest **#${latestCase.caseId} • ${latestCase.action} • ${latestCase.status || 'active'}** — ${String(latestCase.reason || 'No reason').slice(0, 180)}`", "      ? `Latest: **#${latestCase.caseId} • ${latestCase.action} • ${latestCase.status || 'active'}** — ${String(latestCase.reason || 'No reason').slice(0, 180)}`", 'latest case line')
          replace_once("      : 'Latest **No recorded moderation cases**',", "      : 'Latest: **No recorded moderation cases**',", 'empty latest case line')
          replace_once("  const investigationLines = [\n    `Investigation Watch **${investigationWatch}** • Notes **${report.investigation?.notes?.length || 0}**`,\n    `Link Evidence **${report.persistentLinks?.length || 0}** • Verified identity links **${context.confirmedLinks?.length || 0}**`,\n  ];", "  const investigationLines = [\n    `Watch **${report.investigation?.watched ? '🟢' : '⚪'} ${investigationWatch}** • Notes **${report.investigation?.notes?.length || 0}**`,\n    `Evidence **${report.persistentLinks?.length || 0}** • Verified Links **${context.confirmedLinks?.length || 0}**`,\n  ];", 'investigation summary')
          sub_once(r"  const behaviourTrend = String\(behavior\.trend \|\| 'stable'\)\.toLowerCase\(\);\n  const behaviourIcon = behaviourTrend === 'increasing' \? '🟠' : '🟢';\n  setOrReplaceField\(report\.embed, '🌐 Network & Behaviour', \[\n    `Observed guilds \*\*\$\{history\.length\}\*\* • Current \*\*\$\{currentGuilds\}\*\* • Former \*\*\$\{formerGuilds\}\*\* • Cross-guild cases \*\*\$\{context\.network\?\.caseCount \|\| 0\}\*\*`,\n    `External \*\*\$\{reputation\.verifiedExternal \|\| 0\} verified\*\* • \*\*\$\{reputation\.submitted \|\| 0\} submitted\*\* • \*\*\$\{reputation\.unverified \|\| 0\} unverified\*\*`,\n    `Behaviour \$\{behaviourIcon\} \*\*\$\{behaviourTrend\.toUpperCase\(\)\}\*\* • \*\*\$\{behavior\.windows\?\.d30\?\.total \|\| 0\} cases / 30d\*\*`,\n  \]\.join\('\\\\n'\)\);", "  const behaviourTrend = String(behavior.trend || 'stable').toLowerCase();\n  const behaviourLabel = behaviourTrend ? `${behaviourTrend.charAt(0).toUpperCase()}${behaviourTrend.slice(1)}` : 'Stable';\n  const behaviourIcon = behaviourTrend === 'increasing' ? '🟠' : '🟢';\n  const externalCount = Number(reputation.verifiedExternal || 0) + Number(reputation.submitted || 0) + Number(reputation.unverified || 0);\n  const networkLines = [\n    `Guilds **${history.length} observed • ${currentGuilds} current • ${formerGuilds} former**`,\n    `Cross-guild Cases **${context.network?.caseCount || 0}** • External Records **${externalCount}**`,\n  ];\n  if (externalCount > 0) {\n    networkLines.push(`External **${reputation.verifiedExternal || 0} verified • ${reputation.submitted || 0} submitted • ${reputation.unverified || 0} unverified**`);\n  }\n  networkLines.push(`Behaviour **${behaviourIcon} ${behaviourLabel} • ${behavior.windows?.d30?.total || 0} cases / 30d**`);\n  setOrReplaceField(report.embed, '🌐 Network & Behaviour', networkLines.join('\\n'));", 'network behaviour')
          replace_once("    .setLabel(report.investigation?.watched ? 'Investigation Watch: ON' : 'Investigation Watch: OFF')", "    .setLabel(report.investigation?.watched ? 'Watch: On' : 'Watch: Off')", 'watch button')
          path.write_text(text)
          PY

      - name: Validate rewritten source
        run: |
          node --check src/core/administration/mod/intelligence.js
          npm run contracts

      - name: Remove one-off workflows before Doctor
        run: |
          git rm -f .github/workflows/polish-member-intelligence-once.yml
          git rm -f .github/workflows/polish-member-intelligence-v3-once.yml

      - name: Run Doctor
        run: npm run doctor

      - name: Commit polished workspace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/administration/mod/intelligence.js .github/workflows/polish-member-intelligence-once.yml .github/workflows/polish-member-intelligence-v3-once.yml
          git diff --cached --check
          git commit -m 'refactor(mod): polish member intelligence presentation'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
