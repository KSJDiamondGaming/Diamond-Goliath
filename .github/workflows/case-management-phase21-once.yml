name: Case Management Phase 21 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/case-management-phase21.py'
      - '.github/workflows/case-management-phase21-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply case language and severity UX
        run: python3 .github/case-management-phase21.py
      - name: Validate source
        run: |
          node --check src/core/administration/mod/caseCourt.js
          node --check src/core/administration/mod/cases.js
          node --check src/core/administration/admin/panel.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: |
          node -e "require('./src/core/administration/mod/caseCourt')"
          node -e "require('./src/core/administration/mod/cases')"
          node -e "require('./src/core/administration/admin/panel')"
      - name: Remove one-off files before Doctor
        run: rm -f .github/case-management-phase21.py .github/workflows/case-management-phase21-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit case language and severity UX
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(mod): improve case language and severity UX"
          git pull --rebase origin dev
          git push origin HEAD:dev
