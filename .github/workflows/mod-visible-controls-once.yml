name: Apply Visible Moderation Controls

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/mod-visible-controls-once.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/mod-visible-controls-temp.py
      - name: Validate source
        run: |
          node -c src/core/administration/mod/panel.js
          npm run syntax
          npm run imports
      - name: Commit clean source
        run: |
          rm .github/workflows/mod-visible-controls-once.yml
          rm scripts/mod-visible-controls-temp.py
          git config user.name "KSJ Hub"
          git config user.email "sycomorgan@gmail.com"
          git add src/core/administration/mod/panel.js .github/workflows/mod-visible-controls-once.yml scripts/mod-visible-controls-temp.py
          git commit -m "refactor(mod): keep moderation controls visible"
          git push origin dev
      - name: Deploy clean dev state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-dev.yml --ref dev -f environment=dev
