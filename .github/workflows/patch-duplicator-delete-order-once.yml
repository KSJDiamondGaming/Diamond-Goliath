name: Patch Duplicator Delete Order Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-duplicator-delete-order-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch Bulk Delete ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/owner/dev/duplicator/selective.js')
          s = p.read_text()
          old = """async function prepareDeleteScan(interaction, session) {
  const guild = interaction.client.guilds.cache.get(session.destinationGuildId);
  if (!guild) throw new Error('Bulk Delete is DEV-local only. Select a destination connected to the DEV bot.');
  await guild.channels.fetch().catch(() => null);
  const categories = [...guild.channels.cache.values()].filter((c) => c.type === ChannelType.GuildCategory).sort((a, b) => a.position - b.position);
  const output = [];
  const seen = new Set();
  for (const category of categories) {
    output.push({ id: category.id, name: category.name, type: category.type, parentId: null, itemKind: 'category' });
    seen.add(category.id);
    for (const child of [...guild.channels.cache.values()].filter((c) => c.parentId === category.id).sort((a, b) => a.position - b.position)) {
      output.push({ id: child.id, name: child.name, type: child.type, parentId: category.id, itemKind: 'channel' });
      seen.add(child.id);
    }
  }
  for (const channel of [...guild.channels.cache.values()].filter((c) => !seen.has(c.id) && c.type !== ChannelType.GuildCategory).sort((a, b) => a.position - b.position)) {
    output.push({ id: channel.id, name: channel.name, type: channel.type, parentId: channel.parentId || null, itemKind: 'channel' });
  }
  session.deleteItems = output;
  session.deleteSelected = new Set();
  session.deletePage = 0;
}
"""
          new = """async function prepareDeleteScan(interaction, session) {
  const guild = interaction.client.guilds.cache.get(session.destinationGuildId);
  if (!guild) throw new Error('Bulk Delete is DEV-local only. Select a destination connected to the DEV bot.');
  await guild.channels.fetch().catch(() => null);

  const all = [...guild.channels.cache.values()];
  const byPosition = (a, b) => (a.rawPosition ?? a.position ?? 0) - (b.rawPosition ?? b.position ?? 0);
  const output = [];

  // Discord renders uncategorised channels before category blocks, so mirror that first.
  for (const channel of all
    .filter((c) => c.type !== ChannelType.GuildCategory && !c.parentId)
    .sort(byPosition)) {
    output.push({ id: channel.id, name: channel.name, type: channel.type, parentId: null, itemKind: 'channel' });
  }

  // Then mirror each category and its children in the same order shown in Discord.
  for (const category of all.filter((c) => c.type === ChannelType.GuildCategory).sort(byPosition)) {
    output.push({ id: category.id, name: category.name, type: category.type, parentId: null, itemKind: 'category' });
    for (const child of all.filter((c) => c.parentId === category.id).sort(byPosition)) {
      output.push({ id: child.id, name: child.name, type: child.type, parentId: category.id, itemKind: 'channel' });
    }
  }

  // Defensive fallback for any orphaned/nonstandard channel that Discord returns with a missing parent.
  const included = new Set(output.map((item) => item.id));
  for (const channel of all.filter((c) => c.type !== ChannelType.GuildCategory && !included.has(c.id)).sort(byPosition)) {
    output.push({ id: channel.id, name: channel.name, type: channel.type, parentId: channel.parentId || null, itemKind: 'channel' });
  }

  session.deleteItems = output;
  session.deleteSelected = new Set();
  session.deletePage = 0;
}
"""
          if old not in s:
              raise SystemExit('prepareDeleteScan block not found; aborting')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          node --check src/owner/dev/duplicator/selective.js
          npm run doctor
          npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/owner/dev/duplicator/selective.js
          git commit -m 'fix(duplicator): mirror Discord order in bulk delete'
          PATCH_COMMIT=$(git rev-parse HEAD)
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
      - name: Cleanup helper workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git checkout -B dev origin/dev
          git rm -f .github/workflows/patch-duplicator-delete-order-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove duplicator delete order patch workflow'
          git push origin HEAD:dev
