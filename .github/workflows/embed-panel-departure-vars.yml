name: Apply Embed Panel Departure Variables

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/embed-panel-departure-vars.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch embedPanel.js
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/modules/embed/embedPanel.js')
          text = path.read_text(encoding='utf-8')
          original = text

          old_helpers = '''  "{userJoinedAt}",
  "{userJoinedTimestamp}",
  "{nowTimestamp}",'''
          new_helpers = '''  "{userJoinedAt}",
  "{userJoinedTimestamp}",
  "{createdAt}",
  "{joinedAt}",
  "{leftAt}",
  "{timestamp}",
  "{accountAge}",
  "{membershipDuration}",
  "{departureIcon}",
  "{departureType}",
  "{departureLabel}",
  "{departureReason}",
  "{departureModerator}",
  "{departureModeratorId}",
  "{nowTimestamp}",'''
          if old_helpers not in text:
              raise SystemExit('HELPERS insertion point not found')
          text = text.replace(old_helpers, new_helpers, 1)

          old_vars = '''    userJoinedTimestamp: fmtTs(member.joinedTimestamp),
    userjoinedtimestamp: fmtTs(member.joinedTimestamp),
    nowTimestamp: now,
    nowtimestamp: now,'''
          new_vars = '''    userJoinedTimestamp: fmtTs(member.joinedTimestamp),
    userjoinedtimestamp: fmtTs(member.joinedTimestamp),
    createdAt: fmtTs(user.createdTimestamp) || "Unknown",
    createdat: fmtTs(user.createdTimestamp) || "Unknown",
    joinedAt: fmtTs(member.joinedTimestamp) || "Unknown",
    joinedat: fmtTs(member.joinedTimestamp) || "Unknown",
    leftAt: now,
    leftat: now,
    timestamp: now,
    accountAge: "4 years, 2 months",
    accountage: "4 years, 2 months",
    membershipDuration: "1 year, 8 months",
    membershipduration: "1 year, 8 months",
    departureIcon: "👋",
    departureicon: "👋",
    departureType: "left",
    departuretype: "left",
    departureLabel: "Left Voluntarily",
    departurelabel: "Left Voluntarily",
    departureReason: "No reason — the member left voluntarily.",
    departurereason: "No reason — the member left voluntarily.",
    departureModerator: "Not applicable",
    departuremoderator: "Not applicable",
    departureModeratorId: "Not applicable",
    departuremoderatorid: "Not applicable",
    nowTimestamp: now,
    nowtimestamp: now,'''
          if old_vars not in text:
              raise SystemExit('replaceVars insertion point not found')
          text = text.replace(old_vars, new_vars, 1)

          text = text.replace('"Author name or icon variable"', '"Author name"', 1)
          text = text.replace('"Footer text or icon variable"', '"Footer text"', 1)

          if text == original:
              raise SystemExit('No changes made')

          path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Goliath Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/modules/embed/embedPanel.js
          git commit -m "fix(embed): add departure variables to editor and preview"
          git push origin HEAD:dev
