name: Apply Admin Action Flow Patch

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore(admin): retry post-action flow patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Patch moderation action return flow
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source block not found in {path}')
              p.write_text(text.replace(old, new, 1))

          panel = 'src/core/administration/mod/panel.js'
          replace_once(
              panel,
              "const DEFAULT_CASES_CONTEXT = Object.freeze({ view: 'cases', actionFilter: 'all', statusFilter: 'all', page: 0 });\nconst DEFAULT_ANALYTICS_CONTEXT",
              "const DEFAULT_CASES_CONTEXT = Object.freeze({ view: 'cases', actionFilter: 'all', statusFilter: 'all', page: 0 });\nconst DEFAULT_ACTIONS_CONTEXT = Object.freeze({ view: 'actions', actionFilter: 'all', statusFilter: 'all', page: 0 });\nconst DEFAULT_ANALYTICS_CONTEXT"
          )
          replace_once(
              panel,
              "async function refreshCasesDashboard(interaction, target) { if (!target) return false; return refreshDashboard(Discord, interaction, target, DEFAULT_CASES_CONTEXT); }",
              "async function refreshCasesDashboard(interaction, target) {\n  if (!target) return false;\n  const id = String(interaction?.customId || '');\n  const returnsToActions = id.startsWith('mod_submit_warn:') || id.startsWith('mod_submit_timeout:');\n  return refreshDashboard(Discord, interaction, target, returnsToActions ? DEFAULT_ACTIONS_CONTEXT : DEFAULT_CASES_CONTEXT);\n}"
          )

          punishments = 'src/core/administration/mod/punishments.js'
          replace_once(
              punishments,
              "const DEFAULT_DASHBOARD_CONTEXT = Object.freeze({ view: 'cases', actionFilter: 'all', statusFilter: 'all', page: 0 });",
              "const DEFAULT_DASHBOARD_CONTEXT = Object.freeze({ view: 'actions', actionFilter: 'all', statusFilter: 'all', page: 0 });"
          )
          replace_once(
              punishments,
              "function normalizeDashboardContext(context = {}) { return { view: context.view || 'cases', actionFilter: context.actionFilter || 'all', statusFilter: context.statusFilter || 'all', page: Math.max(0, Math.trunc(Number(context.page) || 0)) }; }",
              "function normalizeDashboardContext(context = {}) { return { view: context.view || 'actions', actionFilter: context.actionFilter || 'all', statusFilter: context.statusFilter || 'all', page: Math.max(0, Math.trunc(Number(context.page) || 0)) }; }"
          )
          replace_once(
              punishments,
              "    await interaction.update({ content: result.content, embeds: [], components: [] });\n    if (result.target) { const { refreshDashboard } = require('./panel'); if (typeof refreshDashboard === 'function') await refreshDashboard(discord, interaction, result.target, normalizeDashboardContext(returnContext)); }\n    return true;",
              "    await interaction.update({ content: result.content, embeds: [], components: [] });\n    const targetDeparted = pending.type === 'kick' || pending.type === 'ban';\n    const dashboardTarget = targetDeparted ? null : result.target;\n    const dashboardContext = targetDeparted\n      ? { view: 'member', actionFilter: 'all', statusFilter: 'all', page: 0 }\n      : normalizeDashboardContext(returnContext);\n    if (dashboardTarget || targetDeparted) {\n      const { refreshDashboard } = require('./panel');\n      if (typeof refreshDashboard === 'function') await refreshDashboard(discord, interaction, dashboardTarget, dashboardContext);\n    }\n    return true;"
          )

          Path('.github/workflows/admin-action-flow-patch.yml').unlink()
          PY
      - name: Verify syntax
        run: |
          node -c src/core/administration/mod/panel.js
          node -c src/core/administration/mod/punishments.js
      - name: Commit patched flow
        run: |
          git config user.name "KSJ Hub"
          git config user.email "sycomorgan@gmail.com"
          git add src/core/administration/mod/panel.js src/core/administration/mod/punishments.js .github/workflows/admin-action-flow-patch.yml
          git commit -m "refactor(mod): stabilize post-action workspace flow"
          git push origin dev
