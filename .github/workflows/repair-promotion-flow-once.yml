name: Repair Promotion Flow Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/repair-promotion-flow-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply permanent promotion flow
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy-dev.yml')
          s = p.read_text()
          old = '                production) SOURCE_BRANCH="beta" ;;'
          new = '                production) SOURCE_BRANCH="dev" ;;'
          if old not in s:
              if new not in s:
                  raise SystemExit('production source branch anchor not found')
          else:
              p.write_text(s.replace(old, new, 1))
          PY

          echo '' | base64 -d > .github/workflows/sync-dev-now.yml

      - name: Remove one-off workflow
        run: rm -f .github/workflows/repair-promotion-flow-once.yml

      - name: Validate permanent files
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'production) SOURCE_BRANCH="dev"' .github/workflows/deploy-dev.yml
          grep -q 'beta|production)' .github/workflows/sync-dev-now.yml
          grep -q 'operation=deploy' .github/workflows/sync-dev-now.yml

      - name: Commit permanent flow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "fix(actions): promote DEV directly to beta and production"
          git push origin HEAD:dev
