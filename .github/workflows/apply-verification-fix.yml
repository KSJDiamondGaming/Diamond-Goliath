name: Apply verification cache fix

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-verification-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: refresh member roles during verification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch verification manager
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/modules/verification/verificationManager.js')
          text = path.read_text(encoding='utf-8')

          old_member = "  const member = interaction.member || await guild.members.fetch(interaction.user.id).catch(() => null);"
          new_member = """  const member = await guild.members.fetch({
    user: interaction.user.id,
    force: true,
  }).catch(() => null);"""
          if old_member not in text:
              raise SystemExit('Expected member-fetch line was not found')
          text = text.replace(old_member, new_member, 1)

          old_block = """    verificationStore.clearAttempts(guildId, member.id);
    verificationStore.incrementAnalytics(guildId, { verified: 1 });"""
          new_block = """    const refreshedMember = await guild.members.fetch({
      user: member.id,
      force: true,
    });

    const missingVerifiedRoles = verifiedRoles.filter(
      (role) => !refreshedMember.roles.cache.has(role.id)
    );
    const remainingPendingRoles = settings.usePendingRoles && settings.removePendingRoles
      ? pendingRoles.filter((role) => refreshedMember.roles.cache.has(role.id))
      : [];

    if (missingVerifiedRoles.length || remainingPendingRoles.length) {
      const problems = [];
      if (missingVerifiedRoles.length) {
        problems.push(`verified role not added: ${missingVerifiedRoles.map((role) => role.name).join(', ')}`);
      }
      if (remainingPendingRoles.length) {
        problems.push(`pending role not removed: ${remainingPendingRoles.map((role) => role.name).join(', ')}`);
      }
      throw new Error(problems.join('; '));
    }

    verificationStore.clearAttempts(guildId, member.id);
    verificationStore.incrementAnalytics(guildId, { verified: 1 });"""
          if old_block not in text:
              raise SystemExit('Expected success block was not found')
          text = text.replace(old_block, new_block, 1)

          old_catch = """  } catch (error) {
    return failVerification(guildId, section, member, 'failed', {
      reason: error.message || 'role update failed',
    }, { roleManageFailed: 1 });
  }"""
          new_catch = """  } catch (error) {
    const reason = error?.rawError?.message || error?.message || 'Discord rejected the role update';
    console.error('[Verification] Role update failed', {
      guildId,
      userId: member.id,
      error,
    });
    return failVerification(guildId, section, member, 'failed', {
      reason,
    }, { roleManageFailed: 1 });
  }"""
          if old_catch not in text:
              raise SystemExit('Expected catch block was not found')
          text = text.replace(old_catch, new_catch, 1)

          path.write_text(text, encoding='utf-8')

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-verification-fix.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/verification/verificationManager.js .github/workflows/apply-verification-fix.yml
          git commit -m "fix: refresh member roles during verification"
          git push origin dev
