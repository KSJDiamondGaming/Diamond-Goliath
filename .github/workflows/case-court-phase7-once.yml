name: Case Court Phase 7 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/case-court-phase7-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Apply dedicated Court authority
        run: python3 .github/case-court-phase7.py
      - name: Validate source
        run: |
          node --check src/core/administration/admin/panel.js
          node --check src/core/administration/mod/permissions.js
          node --check src/core/administration/mod/caseCourt.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: node -e "require('./src/core/administration/admin/panel'); require('./src/core/administration/mod/permissions'); require('./src/core/administration/mod/caseCourt');"
      - name: Remove one-off files before Doctor
        run: rm -f .github/workflows/case-court-phase7-once.yml .github/case-court-phase7.py
      - name: Run Doctor
        run: npm run doctor
      - name: Commit Court authority phase
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(mod): add dedicated court authority controls'
          git push origin HEAD:dev
