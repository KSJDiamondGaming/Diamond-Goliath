name: Improve Investigation Room Once
on:
  push:
    paths:
      - 'scripts/improve-investigation-room-once.js'
      - '.github/workflows/improve-investigation-room-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply room UX upgrade
        run: node scripts/improve-investigation-room-once.js
      - name: Syntax/import checks
        run: |
          node --check src/core/security/protection/quarantine.js
          node --check src/core/administration/mod/quarantineInteractions.js
          node --check src/core/administration/mod/interactions.js
          node -e "require('./src/core/security/protection/quarantine');require('./src/core/administration/mod/quarantineInteractions');require('./src/core/administration/mod/interactions')"
      - name: Remove one-off files before Doctor
        run: rm -f scripts/improve-investigation-room-once.js .github/workflows/improve-investigation-room-once.yml
      - name: Doctor
        run: npm run doctor
      - name: Commit upgrade
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "feat(mod): upgrade investigation room experience" || exit 0
          git push origin dev
