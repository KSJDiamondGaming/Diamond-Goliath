name: Deploy DEV to VPS

on:
  push:
    branches:
      - dev

jobs:
  deploy-dev:
    runs-on: self-hosted

    steps:
      - name: Deploy DEV
        run: |
          set -e

          echo "🚀 Deploying DEV..."

          cd /home/goliath/dev

          echo "🛑 Stopping DEV..."
          pm2 stop goliath-dev || true

          echo "📥 Syncing DEV branch..."
          git fetch origin
          git reset --hard origin/dev
          git clean -fd

          echo "📦 Installing dependencies..."
          npm install

          echo "🚀 Restarting DEV..."
          pm2 restart ecosystem.config.js --only goliath-dev --update-env

          echo "💾 Saving PM2..."
          pm2 save

          echo "✅ DEV deployment complete"