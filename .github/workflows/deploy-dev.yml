name: Deploy DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy DEV to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e

            echo "🚀 Deploying DEV..."

            cd /home/goliath/dev

            echo "📥 Syncing dev branch..."
            git checkout dev
            git fetch origin dev
            git reset --hard origin/dev

            echo "📦 Installing dependencies..."
            npm install

            echo "🏗️ Building dashboard..."
            npm run build

            echo "♻️ Restarting DEV bot..."
            BOT_MODE=dev pm2 restart goliath-dev --update-env

            pm2 save
            pm2 status

            echo "✅ DEV deployment complete"