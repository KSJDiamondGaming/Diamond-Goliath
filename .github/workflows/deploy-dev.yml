name: Deploy DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Check out DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply Embed Studio diagnostics fix
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/modules/embed/embedPanel.js")
          text = path.read_text(encoding="utf-8")

          if "PermissionFlagsBits" not in text.split('} = require("discord.js");', 1)[0]:
              text = text.replace(
                  "  ChannelType,\n  ModalBuilder,",
                  "  ChannelType,\n  PermissionFlagsBits,\n  ModalBuilder,",
                  1,
              )

          if "goliathPermissionGuard" not in text:
              text = text.replace(
                  'const guildManager = require("../../core/guild/guildManager");\n',
                  'const guildManager = require("../../core/guild/guildManager");\n'
                  'const {\n'
                  '  validateChannelAccess,\n'
                  '} = require("../../core/security/goliathPermissionGuard");\n',
                  1,
              )

          helper_anchor = '''function trim(v, max = 4096) {
            v = String(v || "");
            return v.length > max ? `${v.slice(0, max - 3)}...` : v;
          }
          '''
          helpers = '''function trim(v, max = 4096) {
            v = String(v || "");
            return v.length > max ? `${v.slice(0, max - 3)}...` : v;
          }
          function discordErrorCode(error) {
            return Number(error?.code || error?.rawError?.code || error?.data?.code || 0);
          }
          function discordErrorDetail(error) {
            return trim(
              error?.rawError?.message ||
                error?.data?.message ||
                error?.message ||
                "Discord rejected the request.",
              300,
            );
          }
          function embedOperationError(error, channelId, operation = "send") {
            const code = discordErrorCode(error);
            const detail = discordErrorDetail(error);
            if (code === 50001 || code === 50013) {
              return `❌ Discord denied access to <#${channelId}>. Recheck Goliath's effective channel and category permissions.`;
            }
            if (code === 50035) {
              return `❌ Discord rejected part of the embed or its buttons: ${detail}`;
            }
            if (code === 10008 && operation === "update") {
              return "⚠️ The original embed message no longer exists.";
            }
            return `❌ Discord could not ${operation} the embed${code ? ` (error ${code})` : ""}: ${detail}`;
          }
          '''
          if "function discordErrorCode(error)" not in text:
              if helper_anchor not in text:
                  raise SystemExit("trim helper anchor not found")
              text = text.replace(helper_anchor, helpers, 1)

          update_pattern = re.compile(
              r'    if \(i\.customId === "embed:update-existing"\) \{.*?(?=    if \(i\.customId === "embed:use"\) \{)',
              re.S,
          )
          update_block = '''    if (i.customId === "embed:update-existing") {
            const deployment = getEmbedDeployment(
              i.guild.id,
              getDeploymentKeyFromState(s),
            );
            if (!deployment)
              return i.reply({
                content: "⚠️ No deployed embed found. Use the embed first.",
                flags: 64,
              });

            const channel =
              i.guild.channels.cache.get(deployment.channelId) ||
              (await i.guild.channels.fetch(deployment.channelId).catch(() => null));
            if (!channel?.isTextBased())
              return i.reply({
                content: "⚠️ The original embed channel no longer exists or is not text-based.",
                flags: 64,
              });

            const access = await validateChannelAccess(
              i.guild,
              channel.id,
              [
                PermissionFlagsBits.ViewChannel,
                PermissionFlagsBits.ReadMessageHistory,
                PermissionFlagsBits.SendMessages,
                PermissionFlagsBits.EmbedLinks,
              ],
              { scope: "embed.update" },
            );
            if (!access.ok)
              return i.reply({ content: trim(access.message, 1800), flags: 64 });

            let payload;
            try {
              payload = {
                content: s.allowUserPing ? `<@${i.user.id}>` : "",
                embeds: buildPreviewEmbeds(s, i),
                components: buttonRows(s),
                allowedMentions: allowedMentions(s, i),
              };
            } catch (error) {
              console.error("Embed update payload build failed:", error);
              return i.reply({
                content: `❌ The embed could not be built: ${discordErrorDetail(error)}`,
                flags: 64,
              });
            }

            try {
              const message = await channel.messages.fetch(deployment.messageId);
              await message.edit(payload);
              return i.reply({ content: "✅ Existing embed updated.", flags: 64 });
            } catch (error) {
              console.error("Failed to update existing embed:", error);
              return i.reply({
                content: embedOperationError(error, channel.id, "update"),
                flags: 64,
              });
            }
          }
          '''
          text, update_count = update_pattern.subn(update_block, text, count=1)
          if update_count != 1:
              raise SystemExit(f"expected one update-existing block, found {update_count}")

          use_pattern = re.compile(
              r'    if \(i\.customId === "embed:use"\) \{.*?(?=      const presetName =)',
              re.S,
          )
          use_block = '''    if (i.customId === "embed:use") {
            const channel =
              i.guild.channels.cache.get(s.channelId) ||
              (await i.guild.channels.fetch(s.channelId).catch(() => null));
            if (!channel?.isTextBased())
              return i.reply({ content: "Invalid channel.", flags: 64 });

            const access = await validateChannelAccess(
              i.guild,
              channel.id,
              [
                PermissionFlagsBits.ViewChannel,
                PermissionFlagsBits.SendMessages,
                PermissionFlagsBits.EmbedLinks,
              ],
              { scope: "embed.deploy" },
            );
            if (!access.ok)
              return i.reply({ content: trim(access.message, 1800), flags: 64 });

            let payload;
            try {
              payload = {
                content: s.allowUserPing ? `<@${i.user.id}>` : "",
                embeds: buildPreviewEmbeds(s, i),
                components: buttonRows(s),
                allowedMentions: allowedMentions(s, i),
              };
            } catch (error) {
              console.error("Embed payload build failed:", error);
              return i.reply({
                content: `❌ The embed could not be built: ${discordErrorDetail(error)}`,
                flags: 64,
              });
            }

            let sent;
            try {
              sent = await channel.send(payload);
            } catch (error) {
              console.error("Embed send failed:", error);
              return i.reply({
                content: embedOperationError(error, channel.id, "send"),
                flags: 64,
              });
            }
          '''
          text, use_count = use_pattern.subn(use_block, text, count=1)
          if use_count != 1:
              raise SystemExit(f"expected one embed-use block, found {use_count}")

          path.write_text(text, encoding="utf-8")

          temporary_workflow = Path(".github/workflows/fix-embed-channel-diagnostics.yml")
          if temporary_workflow.exists():
              temporary_workflow.unlink()

      - name: Validate patched source
        run: node --check src/modules/embed/embedPanel.js

      - name: Commit permanent source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/embed/embedPanel.js
          git add -u .github/workflows
          if git diff --cached --quiet; then
            echo "Embed diagnostics source is already current."
          else
            git commit -m "fix: diagnose embed channel and payload failures accurately"
            git push origin dev
          fi

      - name: Deploy DEV to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: bash /home/goliath/deploy-dev.sh
