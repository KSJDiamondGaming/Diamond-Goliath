name: Deploy DEV

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy DEV to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e

            cd /home/goliath/dev

            git fetch origin
            git reset --hard origin/dev
            git clean -fd

            npm install

            pm2 restart goliath-dev --update-env
            pm2 save

            echo "✅ DEV auto deploy complete"