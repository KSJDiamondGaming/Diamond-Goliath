name: Deploy DEV to VPS

on:
  push:
    branches:
      - dev

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy DEV to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "🚀 Deploying DEV..."

            cd /home/goliath/dev

            echo "🛑 Stopping DEV..."
            pm2 stop goliath-dev || true

            echo "📥 Syncing DEV branch..."
            git fetch origin
            git reset --hard origin/dev
            git clean -fd

            echo "📦 Installing dependencies..."
            npm install

            echo "🚀 Starting DEV..."
            pm2 restart ecosystem.config.js --only goliath-dev --update-env

            pm2 save

            echo "✅ DEV deployment complete"