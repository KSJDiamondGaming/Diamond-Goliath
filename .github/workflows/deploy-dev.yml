name: Deploy DEV to VPS

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Goliath DEV
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e

            echo "🚀 Starting Goliath DEV deployment..."

            cd /home/goliath/Diamond-Goliath

            echo "📥 Syncing DEV branch..."
            git checkout dev
            git fetch origin dev
            git reset --hard origin/dev

            echo "📦 Installing dependencies..."
            npm install

            echo "♻️ Restarting DEV bot..."
            BOT_MODE=dev pm2 restart goliath-dev --update-env

            pm2 save

            echo "✅ DEV deployment complete"