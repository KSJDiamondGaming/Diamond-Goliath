name: Deploy Goliath

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: beta
        type: choice
        options:
          - beta
          - production

permissions:
  contents: write

# DEV commits queue in order instead of cancelling each other. Manual BETA and
# PRODUCTION promotions use their own queues.
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'dev' || inputs.environment }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      source_branch: ${{ steps.target.outputs.source_branch }}
      target_branch: ${{ steps.target.outputs.target_branch }}
      deploy_script: ${{ steps.target.outputs.deploy_script }}
      app_dir: ${{ steps.target.outputs.app_dir }}
      runtime_dir: ${{ steps.target.outputs.runtime_dir }}
    steps:
      - name: Resolve deployment target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            ENVIRONMENT="dev"
          else
            ENVIRONMENT="${{ inputs.environment }}"
          fi

          case "$ENVIRONMENT" in
            dev)
              SOURCE_BRANCH="dev"
              TARGET_BRANCH="dev"
              DEPLOY_SCRIPT="/home/goliath/deploy-dev.sh"
              APP_DIR="/home/goliath/dev"
              RUNTIME_DIR="/home/goliath/dev/src/runtime/dev"
              ;;
            beta)
              SOURCE_BRANCH="dev"
              TARGET_BRANCH="beta"
              DEPLOY_SCRIPT="/home/goliath/deploy-beta.sh"
              APP_DIR="/home/goliath/beta"
              RUNTIME_DIR="/home/goliath/beta/src/runtime/beta"
              ;;
            production)
              SOURCE_BRANCH="dev"
              TARGET_BRANCH="production"
              DEPLOY_SCRIPT="/home/goliath/deploy-production.sh"
              APP_DIR="/home/goliath/production"
              RUNTIME_DIR="/home/goliath/production/src/runtime/production"
              ;;
            *)
              echo "Unsupported environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "deploy_script=$DEPLOY_SCRIPT" >> "$GITHUB_OUTPUT"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "runtime_dir=$RUNTIME_DIR" >> "$GITHUB_OUTPUT"

  preflight:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deployment gate
        shell: bash
        run: |
          set -euo pipefail
          npm run doctor
          npm test
          npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn

  promote:
    needs:
      - resolve
      - preflight
    if: needs.resolve.outputs.environment != 'dev'
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.sha.outputs.target_sha }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.target_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward DEV into target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ needs.resolve.outputs.source_branch }}" "${{ needs.resolve.outputs.target_branch }}"
          git checkout "${{ needs.resolve.outputs.target_branch }}"
          git reset --hard "origin/${{ needs.resolve.outputs.target_branch }}"
          git merge --ff-only "origin/${{ needs.resolve.outputs.source_branch }}"
          git push origin "${{ needs.resolve.outputs.target_branch }}"

      - name: Record promoted commit
        id: sha
        run: echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  dev-sha:
    needs:
      - resolve
      - preflight
    if: needs.resolve.outputs.environment == 'dev'
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.sha.outputs.target_sha }}
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 1

      - name: Record DEV commit
        id: sha
        run: echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs:
      - resolve
      - preflight
      - promote
      - dev-sha
    if: always() && needs.preflight.result == 'success' && (needs.promote.result == 'success' || needs.promote.result == 'skipped') && (needs.dev-sha.result == 'success' || needs.dev-sha.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve expected commit
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ needs.promote.outputs.target_sha }}"
          if [ -z "$SHA" ]; then SHA="${{ needs.dev-sha.outputs.target_sha }}"; fi
          if [ -z "$SHA" ]; then
            echo "Unable to resolve deployment commit."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy affected components to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          TARGET_BRANCH: ${{ needs.resolve.outputs.target_branch }}
          DEPLOY_SCRIPT: ${{ needs.resolve.outputs.deploy_script }}
          APP_DIR: ${{ needs.resolve.outputs.app_dir }}
          RUNTIME_DIR: ${{ needs.resolve.outputs.runtime_dir }}
          EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          envs: ENVIRONMENT,TARGET_BRANCH,DEPLOY_SCRIPT,APP_DIR,RUNTIME_DIR,EXPECTED_SHA
          script: |
            set -euo pipefail

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Expected Git checkout missing: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"
            OLD_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
            git fetch origin "$TARGET_BRANCH"

            if ! git cat-file -e "$EXPECTED_SHA^{commit}" 2>/dev/null; then
              echo "Expected commit is not available on the VPS: $EXPECTED_SHA"
              exit 1
            fi

            FULL_FALLBACK=false
            CHANGED_FILE_LIST=""
            if [ -n "$OLD_SHA" ] && git cat-file -e "$OLD_SHA^{commit}" 2>/dev/null; then
              CHANGED_FILE_LIST="$(git diff --name-only "$OLD_SHA" "$EXPECTED_SHA" || true)"
            else
              FULL_FALLBACK=true
            fi

            echo "========================================"
            echo "Goliath affected-change deployment"
            echo "Environment : $ENVIRONMENT"
            echo "Branch      : $TARGET_BRANCH"
            echo "Previous    : ${OLD_SHA:-unknown}"
            echo "Target      : $EXPECTED_SHA"
            echo "========================================"

            if [ -n "$CHANGED_FILE_LIST" ]; then
              echo "Changed files:"
              printf '%s\n' "$CHANGED_FILE_LIST" | sed 's/^/  - /'
            elif [ "$FULL_FALLBACK" = false ]; then
              echo "No file changes detected."
            fi

            NEED_DEPS=false
            NEED_COMMAND_SYNC=false
            NEED_DASHBOARD_BUILD=false
            NEED_APP_RELOAD=false
            NEED_DOCTOR=false

            while IFS= read -r file; do
              [ -z "$file" ] && continue

              case "$file" in
                package.json|package-lock.json|npm-shrinkwrap.json)
                  NEED_DEPS=true
                  NEED_APP_RELOAD=true
                  NEED_DASHBOARD_BUILD=true
                  NEED_COMMAND_SYNC=true
                  NEED_DOCTOR=true
                  ;;
                src/commands/*)
                  NEED_COMMAND_SYNC=true
                  NEED_APP_RELOAD=true
                  NEED_DOCTOR=true
                  ;;
                src/dashboard/*|vite.config.*)
                  NEED_DASHBOARD_BUILD=true
                  NEED_DOCTOR=true
                  ;;
                server.js|scripts/goliath.js|src/core/*|src/core/**/*|src/events/*|src/events/**/*|src/modules/*|src/modules/**/*|src/server/*|src/server/**/*)
                  NEED_APP_RELOAD=true
                  NEED_DOCTOR=true
                  ;;
                src/runtime/*.js|src/runtime/**/*.js)
                  NEED_APP_RELOAD=true
                  NEED_DOCTOR=true
                  ;;
                .github/workflows/*|test/*|test/**/*|docs/*|docs/**/*|*.md)
                  ;;
                *)
                  echo "Unclassified application change: $file"
                  FULL_FALLBACK=true
                  ;;
              esac
            done <<< "$CHANGED_FILE_LIST"

            if [ "$FULL_FALLBACK" = true ]; then
              echo "Complex/unclassified change detected: using safe full-deploy fallback."
              NEED_DEPS=true
              NEED_COMMAND_SYNC=true
              NEED_DASHBOARD_BUILD=true
              NEED_APP_RELOAD=true
              NEED_DOCTOR=true
            fi

            BACKUP_DIR="/home/goliath/.goliath-${ENVIRONMENT}-runtime-deploy-backup"
            rm -rf "$BACKUP_DIR"
            mkdir -p "$BACKUP_DIR"
            if [ -d "$RUNTIME_DIR" ]; then
              cp -a "$RUNTIME_DIR/." "$BACKUP_DIR/"
            fi

            restore_runtime() {
              mkdir -p "$RUNTIME_DIR"
              if [ -d "$BACKUP_DIR" ]; then
                rm -rf "$RUNTIME_DIR"/* "$RUNTIME_DIR"/.[!.]* "$RUNTIME_DIR"/..?* 2>/dev/null || true
                cp -a "$BACKUP_DIR/." "$RUNTIME_DIR/"
              fi
            }

            cleanup() {
              status=$?
              restore_runtime
              rm -rf "$BACKUP_DIR"
              exit "$status"
            }
            trap cleanup EXIT

            git checkout "$TARGET_BRANCH"
            git reset --hard "$EXPECTED_SHA"
            restore_runtime

            ACTUAL_SHA="$(git rev-parse HEAD)"
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "VPS checkout mismatch. Expected $EXPECTED_SHA, got $ACTUAL_SHA"
              exit 1
            fi

            echo "Deployment plan:"
            echo "  Dependencies : $NEED_DEPS"
            echo "  Dashboard    : $NEED_DASHBOARD_BUILD"
            echo "  Commands     : $NEED_COMMAND_SYNC"
            echo "  App reload   : $NEED_APP_RELOAD"
            echo "  Doctor       : $NEED_DOCTOR"
            echo "  Full fallback: $FULL_FALLBACK"

            # Install dependencies exactly once when dependency definitions changed.
            # Also self-heal an incomplete node_modules tree before any restart.
            if [ "$NEED_DEPS" = true ] || ! node -e "require.resolve('express')" >/dev/null 2>&1; then
              echo "Installing dependencies with npm ci..."
              npm ci
            fi

            if [ "$NEED_DOCTOR" = true ]; then
              echo "Running environment doctor..."
              BOT_MODE="$ENVIRONMENT" npm run doctor
            fi

            if [ "$NEED_DASHBOARD_BUILD" = true ]; then
              echo "Building affected dashboard assets..."
              rm -rf dist
              npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn

              # DEV is now a single-pass deployment: publish the dashboard that
              # was just built instead of calling deploy-dev.sh and rebuilding it.
              if [ "$ENVIRONMENT" = "dev" ]; then
                echo "Publishing DEV dashboard..."
                rm -rf /var/www/goliath-dashboard
                mkdir -p /var/www/goliath-dashboard
                cp -a dist/. /var/www/goliath-dashboard/
                nginx -t
                systemctl reload nginx
              fi
            fi

            if [ "$NEED_COMMAND_SYNC" = true ]; then
              echo "Synchronizing Discord commands for $ENVIRONMENT..."
              BOT_MODE="$ENVIRONMENT" COMMAND_SYNC_DELETE_STALE=true COMMAND_SYNC_UPDATE_EXISTING=true node scripts/goliath.js sync-commands "$ENVIRONMENT"
            fi

            if [ "$NEED_APP_RELOAD" = true ]; then
              if [ "$ENVIRONMENT" = "dev" ]; then
                echo "Restarting goliath-dev exactly once..."
                if pm2 describe goliath-dev >/dev/null 2>&1; then
                  pm2 restart goliath-dev --update-env
                else
                  BOT_MODE=dev NODE_ENV=development pm2 start server.js --name goliath-dev --cwd "$APP_DIR"
                fi
                pm2 save
              else
                echo "Reloading affected $ENVIRONMENT application processes..."
                bash "$DEPLOY_SCRIPT"
                cd "$APP_DIR"
                git fetch origin "$TARGET_BRANCH"
                git reset --hard "$EXPECTED_SHA"
                restore_runtime
              fi
            else
              echo "No live application reload required."
            fi

            ACTUAL_SHA="$(git rev-parse HEAD)"
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "VPS checkout mismatch after deploy. Expected $EXPECTED_SHA, got $ACTUAL_SHA"
              exit 1
            fi

            # Confirm PM2 accepted the DEV process after the one controlled restart.
            if [ "$ENVIRONMENT" = "dev" ] && [ "$NEED_APP_RELOAD" = true ]; then
              sleep 3
              PM2_STATUS="$(pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const list=JSON.parse(s);const p=list.find(x=>x.name==='goliath-dev');process.stdout.write(p?.pm2_env?.status||'missing')})")"
              if [ "$PM2_STATUS" != "online" ]; then
                echo "goliath-dev failed post-deploy health check: $PM2_STATUS"
                pm2 logs goliath-dev --lines 80 --nostream || true
                exit 1
              fi
              echo "goliath-dev PM2 health: online"
            fi

            restore_runtime
            trap - EXIT
            rm -rf "$BACKUP_DIR"

            echo "Deployment verified: $ENVIRONMENT @ $ACTUAL_SHA"

      - name: Deployment summary
        shell: bash
        run: |
          echo "### 🚀 Goliath deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: **${{ needs.resolve.outputs.environment }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: **${{ needs.resolve.outputs.source_branch }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: **${{ needs.resolve.outputs.target_branch }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ steps.expected.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preflight: ✅ doctor, tests, dashboard compile" >> "$GITHUB_STEP_SUMMARY"
          echo "- VPS Git: ✅ exact target commit" >> "$GITHUB_STEP_SUMMARY"
          echo "- DEV process: ✅ single-pass deploy, one controlled PM2 restart when required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ✅ affected components only, full fallback when required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Discord commands: ✅ synchronized automatically when command/dependency definitions change" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime data: ✅ destination environment preserved" >> "$GITHUB_STEP_SUMMARY"
