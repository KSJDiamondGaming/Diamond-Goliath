name: Fix Bulk Delete Access Once

on:
  push:
    branches:
      - 'work/fix-bulk-delete-access-final2'
    paths:
      - '.github/workflows/fix-bulk-delete-access-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/fix-bulk-delete-access-final2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repair
        run: python3 scripts/fix-bulk-delete-access-once.py
      - name: Validate source
        run: |
          node --check src/owner/dev/duplicator/selective.js
          node --check src/owner/dev/duplicator/index.js
          npm run contracts
      - name: Remove one-off files
        run: |
          git rm -f .github/workflows/fix-bulk-delete-access-once.yml
          git rm -f scripts/fix-bulk-delete-access-once.py
      - name: Run Doctor
        run: npm run doctor
      - name: Build dashboard
        run: npm run build
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(duplicator): preflight bulk delete access and retain control ACL'
          git push origin HEAD:work/fix-bulk-delete-access-final2
