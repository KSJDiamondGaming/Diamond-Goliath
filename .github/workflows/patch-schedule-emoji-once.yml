name: Patch Schedule Emoji Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-schedule-emoji-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply canonical schedule emoji patch
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('fs');
          const path = 'src/modules/utilityStudio/schedule/schedule.js';
          let source = fs.readFileSync(path, 'utf8');
          function replaceOnce(from, to, label) {
            if (!source.includes(from)) throw new Error(`Missing patch anchor: ${label}`);
            source = source.replace(from, to);
          }
          replaceOnce(
            "const guildManager = require('../../../core/guild/guildManager');\nconst { getModuleSection, saveModuleSection, updateModuleSection } = require('../../../core/guild/moduleSectionManager');",
            "const guildManager = require('../../../core/guild/guildManager');\nconst { getModuleSection, saveModuleSection, updateModuleSection } = require('../../../core/guild/moduleSectionManager');\nconst emojiPayload = require('../emojis/emojiPayload');",
            'emoji payload import'
          );
          replaceOnce(
            "  await channel.send({ content: `${mentions ? `${mentions} ` : ''}**${event.title}** starts <t:${unix}:R> (<t:${unix}:F>).`, allowedMentions: { roles: event.mentionRoleIds } });",
            "  const payload = await emojiPayload.resolveMessagePayload(guild.client, guild.id, { content: `${mentions ? `${mentions} ` : ''}**${event.title}** starts <t:${unix}:R> (<t:${unix}:F>).`, allowedMentions: { roles: event.mentionRoleIds } }, 'schedule');\n  await channel.send(payload);",
            'schedule reminder payload'
          );
          replaceOnce(
            "  await channel.send({ content: mentions || undefined, embeds: [{ color: event.color || 0x5865F2, title: renderNotificationText(notification.title, event), description: renderNotificationText(notification.description, event) }], allowedMentions: { roles } });",
            "  const payload = await emojiPayload.resolveMessagePayload(guild.client, guild.id, { content: mentions || undefined, embeds: [{ color: event.color || 0x5865F2, title: renderNotificationText(notification.title, event), description: renderNotificationText(notification.description, event) }], allowedMentions: { roles } }, 'schedule');\n  await channel.send(payload);",
            'schedule custom notification payload'
          );
          fs.writeFileSync(path, source);
          console.log('Canonical Schedule emoji delivery patched.');
          NODE

      - name: Validate changed source
        run: node --check src/modules/utilityStudio/schedule/schedule.js

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-schedule-emoji-once.yml

      - name: Run project doctor
        run: npm run doctor

      - name: Build project
        run: npm run build

      - name: Commit clean feature
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(schedule): resolve canonical notification emoji payloads'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
