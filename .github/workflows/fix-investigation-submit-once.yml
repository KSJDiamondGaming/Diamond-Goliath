name: Fix Investigation Submit Once
on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/fix-investigation-submit-once.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm ci
      - name: Apply fix
        run: |
          node scripts/fix-investigation-submit-once.js
      - name: Remove one-off patcher before validation
        run: |
          rm -f scripts/fix-investigation-submit-once.js
          rm -f .github/workflows/fix-investigation-submit-once.yml
      - name: Validate fix
        run: |
          node --check src/core/administration/mod/quarantineInteractions.js
          npm run doctor
      - name: Commit fix
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'fix(mod): acknowledge investigation modal before isolation work'
          git push origin HEAD:dev
