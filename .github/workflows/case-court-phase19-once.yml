name: Case Court Phase 19 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/case-court-phase19.py'
      - '.github/workflows/case-court-phase19-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply Court appeal remedy retry
        run: python3 .github/case-court-phase19.py
      - name: Validate source
        run: node --check src/core/administration/mod/cases.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: node -e "require('./src/core/administration/mod/cases')"
      - name: Remove one-off files before Doctor
        run: rm -f .github/case-court-phase19.py .github/workflows/case-court-phase19-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit Court appeal remedy retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(mod): add court appeal remedy retry recovery"
          git pull --rebase origin dev
          git push origin HEAD:dev
