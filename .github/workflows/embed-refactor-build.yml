name: Build Canonical Embed Module

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/embed-refactor-build.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record workflow run id
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .goliath
          echo "${GITHUB_RUN_ID}" > .goliath/embed-build-run-id.txt
          git add .goliath/embed-build-run-id.txt
          git commit -m "chore: record Embed build run"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin dev && git push && break
            sleep 5
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build canonical Embed architecture
        run: |
          python3 .goliath/embed_refactor.py
          python3 .goliath/embed_doctor_cleanup.py

      - name: Validate JavaScript syntax
        run: |
          find src/modules/messageStudio/embed -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check src/server/routes/embeds.js
          node --check src/events/interactions/interactionCreate.js
          node --check src/commands/embeds/embed.js
          node --check src/server/routes/modules.js
          node --check src/server/routes/permissionHealth.js
          node --check src/modules/feedbackStudio/forms/formsTracking.js
          node --check src/modules/roleStudio/reactionRoles/reactionRoles.js
          node --check server.js

      - name: Verify canonical layout and imports
        run: |
          test "$(find src/modules/messageStudio/embed -maxdepth 1 -name '*.js' | wc -l)" -eq 8
          for file in embed.js embedPanel.js embedInteractions.js embedTemplates.js embedDeployments.js embedTracking.js embedValidation.js embedHealth.js; do
            test -f "src/modules/messageStudio/embed/$file"
          done
          ! grep -R -nE 'messageStudio/embed/(embedTemplateManager|presetStore|embedPayloadNormalizer|embedDeploymentStore|embedSocketEvents)|server/routes/config/embeds|tickets/(ticketManager|ticketChannelManager|ticketPanelManager|ticketStore)' src server.js

      - name: Runtime smoke test
        run: |
          node - <<'NODE'
          const modules = [
            './src/modules/messageStudio/embed/embedTemplates',
            './src/modules/messageStudio/embed/embedTracking',
            './src/modules/messageStudio/embed/embedDeployments',
            './src/modules/messageStudio/embed/embedValidation',
            './src/modules/messageStudio/embed/embedPanel',
            './src/modules/messageStudio/embed/embedInteractions',
            './src/modules/messageStudio/embed/embedHealth',
            './src/modules/messageStudio/embed/embed',
          ];
          for (const modulePath of modules) {
            const api = require(modulePath);
            if (!api || typeof api !== 'object') throw new Error(`Invalid module API: ${modulePath}`);
          }
          NODE

      - name: Run Doctor
        run: npm run doctor

      - name: Run Audit
        run: npm run audit

      - name: Commit canonical Embed refactor
        run: |
          rm -f .goliath/embed-build-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor Embed into eight canonical files"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin dev && git push && break
            sleep 5
          done
