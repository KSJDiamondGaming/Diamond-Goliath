name: Apply Social Studio panel live refresh fix DEV

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/social-panel-live-refresh-fix-dev.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch Social Studio panel
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/modules/socialStudio/socialAlerts/socialStudioPanel.js')
          s = p.read_text()
          old_main = "return { embeds: [embed(c, '📣 Social Studio', d, requestedBy)], components: [row(btn(`${P}creators`, '👥 Creator Profiles', ButtonStyle.Primary), btn(`${P}channels`, '📂 Channels'), btn(`${P}templates`, '🎨 Templates', ButtonStyle.Secondary, true)), navigation('main')] };"
          new_main = "return { embeds: [embed(c, '📣 Social Studio', d, requestedBy)], components: [row(btn(`${P}creators`, '👥 Creator Profiles', ButtonStyle.Primary), btn(`${P}channels`, '📂 Channels'), btn(`${P}refresh`, '🔄 Refresh', ButtonStyle.Secondary), btn(`${P}templates`, '🎨 Templates', ButtonStyle.Secondary, true)), navigation('main')] };"
          if old_main in s:
              s = s.replace(old_main, new_main, 1)
          s = s.replace("if (id === `${P}main`) {", "if (id === `${P}main` || id === `${P}refresh`) {")
          s = s.replace("buildMainPanel(i, config),", "buildMainPanel(i.guild, who(i)),")
          p.write_text(s)
      - name: Verify patch
        shell: bash
        run: |
          grep -n "social:refresh\|P}refresh\|buildMainPanel(i.guild, who(i))" src/modules/socialStudio/socialAlerts/socialStudioPanel.js
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/social-panel-live-refresh-fix-dev.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/socialStudio/socialAlerts/socialStudioPanel.js .github/workflows/social-panel-live-refresh-fix-dev.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: refresh Social Studio dashboard from current guild state"
          git push origin HEAD:dev
