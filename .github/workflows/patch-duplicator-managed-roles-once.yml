name: Patch Duplicator Managed Roles Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-duplicator-managed-roles-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch managed role dependency handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core_path = Path('src/owner/dev/duplicator/core.js')
          core = core_path.read_text()

          old = "function snapshot(guild, selectedOptions = [...ACTIVE_OPTIONS]) {\n  const selected = new Set(selectedOptions);\n  const channels = selected.has('categories') || selected.has('channels') || selected.has('permissions') ? guild.channels.cache.filter((c) => selected.has('channels') || c.type === ChannelType.GuildCategory).sort((a, b) => (a.rawPosition ?? a.position ?? 0) - (b.rawPosition ?? b.position ?? 0)).map(serializeChannel) : [];\n  const roles = selected.has('roles') || selected.has('permissions') ? guild.roles.cache.filter((r) => r.id !== guild.id && !r.managed).sort((a, b) => a.position - b.position).map((r) => ({ id: r.id, name: r.name, color: r.color, hoist: r.hoist, mentionable: r.mentionable, permissions: r.permissions.bitfield.toString(), position: r.position })) : [];\n  const emojis = selected.has('emojis') ? guild.emojis.cache.map((e) => ({ id: e.id, name: e.name, animated: e.animated, url: typeof e.imageURL === 'function' ? e.imageURL({ extension: e.animated ? 'gif' : 'png' }) : e.url })) : [];\n  const settings = selected.has('serverSettings') ? { name: guild.name, description: guild.description || null, verificationLevel: guild.verificationLevel, explicitContentFilter: guild.explicitContentFilter, defaultMessageNotifications: guild.defaultMessageNotifications, afkTimeout: guild.afkTimeout, iconURL: guild.iconURL({ extension: 'png', size: 1024 }) || null, bannerURL: guild.bannerURL({ extension: 'png', size: 2048 }) || null, splashURL: guild.splashURL({ extension: 'png', size: 2048 }) || null } : null;\n  const future = {}; for (const key of FUTURE_OPTIONS) if (selected.has(key)) future[key] = { requested: true, supported: false, reason: 'Reserved for Duplicator API expansion.' };\n  return { sourceGuild: { id: guild.id, name: guild.name }, options: [...selected], settings, roles, channels, emojis, future, stats: { roles: roles.length, categories: channels.filter((c) => c.type === ChannelType.GuildCategory).length, channels: channels.filter((c) => c.type !== ChannelType.GuildCategory).length, permissionOverwrites: channels.reduce((total, c) => total + (c.permissionOverwrites?.length || 0), 0), emojis: emojis.length } };\n}"
          new = "function serializeManagedRole(role) {\n  const tags = role.tags || {};\n  return {\n    id: role.id, name: role.name, managed: true, permissions: role.permissions.bitfield.toString(), position: role.position,\n    tags: { botId: tags.botId || null, integrationId: tags.integrationId || null, subscriptionListingId: tags.subscriptionListingId || null },\n  };\n}\nfunction snapshot(guild, selectedOptions = [...ACTIVE_OPTIONS]) {\n  const selected = new Set(selectedOptions);\n  const channels = selected.has('categories') || selected.has('channels') || selected.has('permissions') ? guild.channels.cache.filter((c) => selected.has('channels') || c.type === ChannelType.GuildCategory).sort((a, b) => (a.rawPosition ?? a.position ?? 0) - (b.rawPosition ?? b.position ?? 0)).map(serializeChannel) : [];\n  const roles = selected.has('roles') || selected.has('permissions') ? guild.roles.cache.filter((r) => r.id !== guild.id && !r.managed).sort((a, b) => a.position - b.position).map((r) => ({ id: r.id, name: r.name, color: r.color, hoist: r.hoist, mentionable: r.mentionable, permissions: r.permissions.bitfield.toString(), position: r.position })) : [];\n  const managedRoles = selected.has('permissions') ? guild.roles.cache.filter((r) => r.id !== guild.id && r.managed).sort((a, b) => a.position - b.position).map(serializeManagedRole) : [];\n  const emojis = selected.has('emojis') ? guild.emojis.cache.map((e) => ({ id: e.id, name: e.name, animated: e.animated, url: typeof e.imageURL === 'function' ? e.imageURL({ extension: e.animated ? 'gif' : 'png' }) : e.url })) : [];\n  const settings = selected.has('serverSettings') ? { name: guild.name, description: guild.description || null, verificationLevel: guild.verificationLevel, explicitContentFilter: guild.explicitContentFilter, defaultMessageNotifications: guild.defaultMessageNotifications, afkTimeout: guild.afkTimeout, iconURL: guild.iconURL({ extension: 'png', size: 1024 }) || null, bannerURL: guild.bannerURL({ extension: 'png', size: 2048 }) || null, splashURL: guild.splashURL({ extension: 'png', size: 2048 }) || null } : null;\n  const future = {}; for (const key of FUTURE_OPTIONS) if (selected.has(key)) future[key] = { requested: true, supported: false, reason: 'Reserved for Duplicator API expansion.' };\n  return { sourceGuild: { id: guild.id, name: guild.name, botUserId: guild.client.user?.id || null }, options: [...selected], settings, roles, managedRoles, channels, emojis, future, stats: { roles: roles.length, managedRoles: managedRoles.length, categories: channels.filter((c) => c.type === ChannelType.GuildCategory).length, channels: channels.filter((c) => c.type !== ChannelType.GuildCategory).length, permissionOverwrites: channels.reduce((total, c) => total + (c.permissionOverwrites?.length || 0), 0), emojis: emojis.length } };\n}"
          if old not in core:
              raise SystemExit('snapshot block not found')
          core = core.replace(old, new, 1)

          marker = "async function applyRoles(guild, snap, maps, log, conflictMode) {"
          managed_fn = """async function applyManagedRoleMappings(guild, snap, maps, log) {
  const dependencies = snap.managedRoles || [];
  if (!dependencies.length) return;
  const destinationManaged = [...guild.roles.cache.values()].filter((role) => role.managed);
  for (const sourceRole of dependencies) {
    let target = null;
    const sourceBotId = sourceRole.tags?.botId || null;
    if (sourceBotId && sourceBotId === snap.sourceGuild?.botUserId) {
      target = destinationManaged.find((role) => role.tags?.botId === guild.client.user?.id) || null;
    }
    if (!target && sourceBotId) {
      target = destinationManaged.find((role) => role.tags?.botId === sourceBotId) || null;
    }
    if (!target) {
      const sameName = destinationManaged.filter((role) => role.name.toLowerCase() === String(sourceRole.name || '').toLowerCase());
      if (sameName.length === 1) target = sameName[0];
    }
    if (target) {
      maps.roles.set(sourceRole.id, target.id);
      log.notes.push(`Managed role remapped: ${sourceRole.name} (${sourceRole.id}) -> ${target.name} (${target.id}).`);
    } else {
      const message = `Managed permission role could not be remapped: ${sourceRole.name} (${sourceRole.id}). Discord-managed roles cannot be recreated; the matching bot/integration must exist in the destination.`;
      log.errors.push(message);
      log.notes.push(message);
    }
  }
}
"""
          if marker not in core:
              raise SystemExit('applyRoles marker not found')
          core = core.replace(marker, managed_fn + marker, 1)

          old_stage = "  await executeStage('Server settings', log, () => applySettings(guild, snap, log));\n  await executeStage('Roles', log, () => applyRoles(guild, snap, maps, log, session.conflictMode));"
          new_stage = "  await executeStage('Server settings', log, () => applySettings(guild, snap, log));\n  await executeStage('Managed role remap', log, () => applyManagedRoleMappings(guild, snap, maps, log));\n  await executeStage('Roles', log, () => applyRoles(guild, snap, maps, log, session.conflictMode));"
          if old_stage not in core:
              raise SystemExit('execution stages not found')
          core = core.replace(old_stage, new_stage, 1)
          core_path.write_text(core)

          selective_path = Path('src/owner/dev/duplicator/selective.js')
          selective = selective_path.read_text()

          old_filtered = "  const channels = (snapshot.channels || []).filter((channel) => requiredChannels.has(channel.id));\n  const roles = (snapshot.roles || []).filter((role) => roleIds.has(role.id));\n  const permissionOverwrites = channels.reduce((sum, channel) => sum + (channel.permissionOverwrites || []).length, 0);"
          new_filtered = "  const channels = (snapshot.channels || []).filter((channel) => requiredChannels.has(channel.id));\n  const roles = (snapshot.roles || []).filter((role) => roleIds.has(role.id));\n  const managedRoles = (snapshot.managedRoles || []).filter((role) => roleIds.has(role.id));\n  const permissionOverwrites = channels.reduce((sum, channel) => sum + (channel.permissionOverwrites || []).length, 0);"
          if old_filtered not in selective:
              raise SystemExit('filtered vars not found')
          selective = selective.replace(old_filtered, new_filtered, 1)
          selective = selective.replace("    roles,\n    channels,", "    roles,\n    managedRoles,\n    channels,", 1)
          selective = selective.replace("      roles: roles.length,\n      categories:", "      roles: roles.length,\n      managedRoles: managedRoles.length,\n      roleDependencies: roles.length + managedRoles.length,\n      categories:", 1)

          old_review_roles = "  const roleNames = snap.roles.slice(0, 15).map((role) => `• ${role.name}`).join('\\n') || '• None';"
          new_review_roles = "  const roleNames = [...snap.roles.map((role) => `• ${role.name}`), ...(snap.managedRoles || []).map((role) => `• 🔗 ${role.name} (managed → remap only)`) ].slice(0, 15).join('\\n') || '• None';"
          if old_review_roles not in selective:
              raise SystemExit('review role names not found')
          selective = selective.replace(old_review_roles, new_review_roles, 1)
          selective = selective.replace("`Required roles: **${snap.stats.roles}**`, `Permission overwrites:", "`Required role dependencies: **${snap.stats.roleDependencies ?? snap.stats.roles}**`, `Managed role remaps: **${snap.stats.managedRoles || 0}**`, `Permission overwrites:", 1)
          selective = selective.replace("**${snap.stats.roles} required roles**, and rebuild", "**${snap.stats.roleDependencies ?? snap.stats.roles} required role dependencies** (${snap.stats.managedRoles || 0} managed/remapped), and rebuild", 1)

          old_map_start = "  const roleMappings = filtered.roles.map((role) => {"
          if old_map_start not in selective:
              raise SystemExit('role mappings not found')
          selective = selective.replace(old_map_start, "  const standardRoleMappings = filtered.roles.map((role) => {", 1)
          old_map_end = "  });\n  const categoryMap = new Map();"
          managed_map = """  });
  const managedRoleMappings = (filtered.managedRoles || []).map((role) => {
    const managed = destinationSnapshot.managedRoles || [];
    let candidates = [];
    if (role.tags?.botId && role.tags.botId === filtered.sourceGuild?.botUserId && destinationSnapshot.sourceGuild?.botUserId) {
      candidates = managed.filter((dest) => dest.tags?.botId === destinationSnapshot.sourceGuild.botUserId);
    }
    if (!candidates.length && role.tags?.botId) candidates = managed.filter((dest) => dest.tags?.botId === role.tags.botId);
    if (!candidates.length) candidates = managed.filter((dest) => dest.name === role.name);
    const match = candidates.length === 1 ? candidates[0] : null;
    return {
      sourceId: role.id, sourceName: role.name, sourcePermissions: role.permissions, managed: true,
      destinationId: match?.id || null, destinationName: match?.name || null,
      status: match ? 'mapped' : candidates.length > 1 ? 'ambiguous-managed' : 'missing-managed',
    };
  });
  const roleMappings = [...standardRoleMappings, ...managedRoleMappings];
  const categoryMap = new Map();"""
          if old_map_end not in selective:
              raise SystemExit('role mapping end not found')
          selective = selective.replace(old_map_end, managed_map, 1)

          selective = selective.replace("Required Roles \\`${manifest.stats.roles}\\`", "Role Dependencies \\`${manifest.stats.roleDependencies ?? manifest.stats.roles}\\`", 1)
          selective = selective.replace("new ButtonBuilder().setCustomId(componentId(session, 'delete-manifest-view')).setLabel('Delete Transfer Channels').setEmoji('🗑️').setStyle(ButtonStyle.Danger).setDisabled(manifest.type !== 'selective-copy')", "new ButtonBuilder().setCustomId(componentId(session, 'delete-manifest-view')).setLabel('Delete Transfer Channels').setEmoji('🗑️').setStyle(ButtonStyle.Danger).setDisabled(manifest.type !== 'selective-copy' || !(manifest.channels || []).some((item) => item.destinationId))", 1)
          selective_path.write_text(selective)
          PY
      - name: Syntax checks
        run: |
          node --check src/owner/dev/duplicator/core.js
          node --check src/owner/dev/duplicator/selective.js
          node --check src/owner/dev/duplicator/index.js
          node --check src/owner/dev/duplicator/history.js
      - name: Remove one-off workflow
        run: rm -f .github/workflows/patch-duplicator-managed-roles-once.yml
      - name: Full project doctor and build
        run: |
          npm run doctor
          npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(duplicator): remap managed permission roles'
          git push origin HEAD:dev
