name: Apply Moderation Appeal Queue Polish
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/mod-appeal-queue-polish-temp.js'
      - '.github/workflows/mod-appeal-queue-polish-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply appeal queue polish
        run: node scripts/mod-appeal-queue-polish-temp.js
      - name: Remove temporary patch files
        run: git rm scripts/mod-appeal-queue-polish-temp.js .github/workflows/mod-appeal-queue-polish-once.yml
      - name: Validate clean source
        run: |
          node --check src/core/administration/mod/cases.js
          npm run doctor
      - name: Commit clean source
        run: |
          git config user.name 'KSJHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add src/core/administration/mod/cases.js
          git commit -m 'refactor(mod): improve appeal queue flow'
          git push origin HEAD:dev
