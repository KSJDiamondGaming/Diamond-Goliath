name: One-time runtime path cleanup

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/runtime-path-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply exact runtime path cleanup
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const targets = [
            ['src/core/security/backup/backupSync.js', 1],
            ['src/core/security/restoreRequestManager.js', 1],
            ['src/server/routes/owner.js', 2],
          ];

          const pattern = /(process\.cwd\(\),\s*)'src',(\s*'runtime',)/g;

          for (const [file, expected] of targets) {
            const original = fs.readFileSync(file, 'utf8');
            let count = 0;
            const updated = original.replace(pattern, (_match, before) => {
              count += 1;
              return `${before}'runtime',`;
            });

            if (count !== expected) {
              throw new Error(`${file}: expected ${expected} runtime path replacement(s), found ${count}`);
            }

            fs.writeFileSync(file, updated, 'utf8');
          }

          const cli = 'scripts/goliath.js';
          const cliSource = fs.readFileSync(cli, 'utf8').replace(/^\uFEFF/, '');
          fs.writeFileSync(cli, `${cliSource.replace(/\s*$/, '')}\n`, 'utf8');
          NODE

      - name: Verify syntax and exact cleanup
        shell: bash
        run: |
          node --check src/core/security/backup/backupSync.js
          node --check src/core/security/restoreRequestManager.js
          node --check src/server/routes/owner.js
          node --check scripts/goliath.js

          node <<'NODE'
          const fs = require('node:fs');
          for (const file of [
            'src/core/security/backup/backupSync.js',
            'src/core/security/restoreRequestManager.js',
            'src/server/routes/owner.js',
          ]) {
            const source = fs.readFileSync(file, 'utf8');
            if (/process\.cwd\(\),\s*'src',\s*'runtime',/.test(source)) {
              throw new Error(`${file}: legacy generated runtime path remains`);
            }
          }
          NODE

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/runtime-path-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/security/backup/backupSync.js \
                  src/core/security/restoreRequestManager.js \
                  src/server/routes/owner.js \
                  scripts/goliath.js \
                  .github/workflows/runtime-path-cleanup.yml
          git diff --cached --check
          git commit -m "finish generated runtime path migration"
          git push origin dev
