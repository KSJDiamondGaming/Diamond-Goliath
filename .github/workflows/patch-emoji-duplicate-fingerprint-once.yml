name: Patch Emoji Duplicate Fingerprint Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-emoji-duplicate-fingerprint-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply animation-aware duplicate fingerprint
        run: node scripts/patch-emoji-duplicate-fingerprint-once.js

      - name: Validate changed source
        run: node --check src/modules/utilityStudio/emojis/emojiStudioService.js

      - name: Remove temporary patch files
        run: rm -f scripts/patch-emoji-duplicate-fingerprint-once.js .github/workflows/patch-emoji-duplicate-fingerprint-once.yml

      - name: Run project doctor
        run: npm run doctor

      - name: Commit clean feature
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(emojis): add animation-aware duplicate detection'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
