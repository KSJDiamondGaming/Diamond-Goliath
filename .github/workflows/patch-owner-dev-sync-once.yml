name: Patch Owner DEV Sync Once

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/patch-owner-dev-sync-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add permanent DEV sync link to Owner panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/owner/command.js')
          s = p.read_text()

          old_field = "{ name: 'Owner Tools', value: showCommandCenter ? '🟢 Server Tools • Security • Command Center' : '🟢 Server Tools • Security', inline: true },"
          new_field = "{ name: 'Owner Tools', value: showCommandCenter ? '🟢 Server Tools • Security • DEV Sync • Command Center' : (isDev ? '🟢 Server Tools • Security • DEV Sync' : '🟢 Server Tools • Security'), inline: true },"
          if old_field in s:
              s = s.replace(old_field, new_field, 1)

          old_nav = """  const navigation = new ActionRowBuilder().addComponents(\n    new ButtonBuilder()\n      .setCustomId(contextualOwnerId('refresh', interaction))\n      .setLabel('Refresh')\n      .setEmoji('🔄')\n      .setStyle(ButtonStyle.Secondary)\n  );"""
          new_nav = """  const navigationComponents = [\n    new ButtonBuilder()\n      .setCustomId(contextualOwnerId('refresh', interaction))\n      .setLabel('Refresh')\n      .setEmoji('🔄')\n      .setStyle(ButtonStyle.Secondary),\n  ];\n\n  if (isDev) {\n    navigationComponents.push(\n      new ButtonBuilder()\n        .setLabel('Sync DEV Now')\n        .setEmoji('🚀')\n        .setStyle(ButtonStyle.Link)\n        .setURL('https://github.com/KSJHub/Goliath/actions/workflows/sync-dev-now.yml')\n    );\n  }\n\n  const navigation = new ActionRowBuilder().addComponents(...navigationComponents);"""

          if old_nav in s:
              s = s.replace(old_nav, new_nav, 1)
          elif "setLabel('Sync DEV Now')" not in s:
              raise SystemExit('Owner navigation anchor not found')

          p.write_text(s)
          PY
      - name: Validate source
        run: |
          node --check src/owner/command.js
          npm run doctor
      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-owner-dev-sync-once.yml
          git config user.name 'Goliath Actions'
          git config user.email 'goliath-actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(owner): add permanent DEV sync control'
          git pull --rebase origin dev
          git push origin HEAD:dev
