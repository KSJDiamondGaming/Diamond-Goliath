name: Add Moderation Quarantine Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/add-moderation-quarantine-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply quarantine controls
        run: |
          python3 scripts/add-moderation-quarantine-once.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/administration/mod/panel.js')
          text = p.read_text()
          text = text.replace("createDangerButton(`mod_open_quarantine:${id}`, 'Quarantine', '🚫')", "createDangerButton(`mod_open_quarantine:${id}`, 'Quarantine', '☢️')")
          text = text.replace("createSecondaryButton(`mod_remove_quarantine:${id}`, 'Remove Quarantine', '🔓')", "createSecondaryButton(`mod_remove_quarantine:${id}`, 'Clear Quarantine', '☢️')")
          text = text.replace("createSecondaryButton(`mod_remove_warning:${id}`, 'Remove Warn', getEmoji('DELETE', '🗑️'))", "createSecondaryButton(`mod_remove_warning:${id}`, 'Clear Warn', '⚠️')")
          p.write_text(text)

          d = Path('docs/architecture/moderation-workspace.md')
          docs = d.read_text()
          docs = docs.replace('Clear Timeout, Remove Quarantine, or Remove Warn', 'Clear Timeout, Clear Quarantine, or Clear Warn')
          d.write_text(docs)
          PY
      - name: Validate source
        run: |
          node --check src/core/administration/mod/panel.js
          node --check src/core/administration/mod/permissions.js
          node --check src/core/administration/mod/interactions.js
          npm run contracts
      - name: Remove one-off files
        run: |
          git rm -f .github/workflows/add-moderation-quarantine-once.yml
          git rm -f scripts/add-moderation-quarantine-once.py
      - name: Run focused validation
        run: |
          npm run syntax
          npm run imports
          npm run dashboard-imports
          npm run contracts
      - name: Commit quarantine controls
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(mod): add quarantine controls to member workspace'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
