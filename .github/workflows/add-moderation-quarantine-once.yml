name: Add Moderation Quarantine Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/add-moderation-quarantine-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply quarantine controls
        run: python3 scripts/add-moderation-quarantine-once.py
      - name: Validate source
        run: |
          node --check src/core/administration/mod/panel.js
          node --check src/core/administration/mod/permissions.js
          node --check src/core/administration/mod/interactions.js
          npm run contracts
      - name: Remove one-off files
        run: |
          git rm -f .github/workflows/add-moderation-quarantine-once.yml
          git rm -f scripts/add-moderation-quarantine-once.py
      - name: Run Doctor
        run: npm run doctor
      - name: Commit quarantine controls
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(mod): add quarantine controls to member workspace'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
