name: Patch Emoji GIF Studio Panel Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-emoji-gif-studio-panel-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch Emoji & GIF Studio panel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/modules/utilityStudio/emojis/emojisPanel.js')
          s = p.read_text()

          replacements = [
            ("throw new Error('Emoji Studio requires a server interaction.');", "throw new Error('Emoji & GIF Studio requires a server interaction.');"),
            (".setTitle('😀 Emoji Studio')", ".setTitle('😀🎞️ Emoji & GIF Studio')"),
            ("'Give your community more emojis without filling this server\\'s normal emoji slots. Goliath\\'s built-in emojis are always ready to use.'", "'Give your community a shared library of static emojis and animated GIFs without filling this server\\'s normal emoji slots. Goliath handles optimisation and animation automatically.'"),
            ("`**Emoji Studio:** ${overview.enabled ? 'On ✅' : 'Off ❌'}`", "`**Emoji & GIF Studio:** ${overview.enabled ? 'On ✅' : 'Off ❌'}`"),
            ("`**Your Emojis:** ${overview.guildCapacity.used} / ${overview.guildCapacity.max}`", "`**Your Emojis & GIFs:** ${overview.guildCapacity.used} / ${overview.guildCapacity.max}`"),
            ("`**Built-in Emojis:** ${overview.coreCapacity.used} / ${overview.coreCapacity.max}`", "`**Built-in Library:** ${overview.coreCapacity.used} / ${overview.coreCapacity.max}`"),
            ("row(button('admin:module:emojis:add', '➕ Add Emojis', ButtonStyle.Primary).setDisabled(!overview.enabled), button('admin:module:emojis:guild', '⭐ Manage Emojis', ButtonStyle.Primary))", "row(button('admin:module:emojis:add', '➕ Add Emoji', ButtonStyle.Primary).setDisabled(!overview.enabled), button('admin:module:emojis:gif-upload-open', '🎞️ Add GIF', ButtonStyle.Success).setDisabled(!overview.enabled), button('admin:module:emojis:guild', '⭐ Manage Library', ButtonStyle.Primary))"),
            (".setTitle('➕ Add Emojis')", ".setTitle('➕ Add Emoji or GIF')"),
            ("'Choose how you want to add emojis to this server.'", "'Choose how you want to add a static emoji or animated GIF to this server.'"),
            ("'**Search for Emojis** — browse the online emoji collection.'", "'**Browse** — search the online emoji and GIF collection.'"),
            ("'**Upload Images & GIFs** — add static or animated emoji files from your device.'", "'**Upload Emoji** — add a static image from your device.\\n**Upload GIF** — add an animated GIF/WebP/APNG/AVIF and let Goliath optimise it.'"),
            ("'**Add from Link** — paste a direct image or animated emoji link.'", "'**Add from Link** — paste a direct image, GIF or animated media link.'"),
            ("row(button('admin:module:emojis:search-open', '🔎 Search for Emojis', ButtonStyle.Primary), button('admin:module:emojis:bulk-open', '📤 Upload Images & GIFs', ButtonStyle.Primary), button('admin:module:emojis:import-url-open', '🔗 Add from Link', ButtonStyle.Secondary))", "row(button('admin:module:emojis:search-open', '🔎 Browse', ButtonStyle.Primary), button('admin:module:emojis:bulk-open', '🖼️ Upload Emoji', ButtonStyle.Primary), button('admin:module:emojis:gif-upload-open', '🎞️ Upload GIF', ButtonStyle.Success), button('admin:module:emojis:import-url-open', '🔗 Add Link', ButtonStyle.Secondary))"),
            (".setTitle('⚙️ Emoji Studio Settings')", ".setTitle('⚙️ Emoji & GIF Studio Settings')"),
            ("'Control Emoji Studio and keep everything running smoothly.'", "'Control Emoji & GIF Studio and keep static and animated media running smoothly.'"),
            ("`**Emoji Studio:** ${overview.enabled ? 'On ✅' : 'Off ❌'}`", "`**Emoji & GIF Studio:** ${overview.enabled ? 'On ✅' : 'Off ❌'}`"),
            ("`**Emoji space used:** ${overview.forecast?.used || 0}/${overview.forecast?.max || 2000}`", "`**Library space used:** ${overview.forecast?.used || 0}/${overview.forecast?.max || 2000}`"),
            ("'**Most used emojis**'", "'**Most used emojis & GIFs**'"),
            ("overview.enabled ? '⏸️ Turn Off Emoji Studio' : '▶️ Turn On Emoji Studio'", "overview.enabled ? '⏸️ Turn Off Studio' : '▶️ Turn On Studio'"),
            (".setTitle('🧹 Manage Storage')", ".setTitle('🧹 Manage Emoji & GIF Storage')"),
            ("'Keep your available emoji collection tidy.'", "'Keep your available emoji and GIF library tidy.'"),
            ("'**Find Unused** — see emojis that are not being used.'", "'**Find Unused** — see emojis or GIFs that are not being used.'"),
            ("'**Find Duplicates** — find identical emoji images taking up extra space.'", "'**Find Duplicates** — find matching static or animated media taking up extra space.'"),
            (".setTitle('⭐ Manage Emojis')", ".setTitle('⭐ Manage Emojis & GIFs')"),
            ("`**Your emojis:** ${overview.guildCapacity.used}/${overview.guildCapacity.max}`", "`**Your emoji & GIF library:** ${overview.guildCapacity.used}/${overview.guildCapacity.max}`"),
            ("`**Built-in emojis:** ${overview.coreCapacity.used}/${overview.coreCapacity.max} always available`", "`**Built-in library:** ${overview.coreCapacity.used}/${overview.coreCapacity.max} always available`"),
            ("'Your & available emojis'", "'Your & available emojis / GIFs'"),
            ("'Built-in emojis'", "'Built-in emojis / GIFs'"),
            ("'🗑️ Delete Emoji'", "'🗑️ Delete Item'"),
            (".setTitle('🗑️ Delete Emoji?')", ".setTitle('🗑️ Delete Emoji / GIF?')"),
            ("'This permanently deletes this emoji from Goliath’s available emoji collection.'", "'This permanently deletes this emoji or GIF from Goliath’s available media library.'"),
            ("'Servers will no longer be able to add it again unless the image is imported or uploaded again.'", "'Servers will no longer be able to add it again unless the media is imported or uploaded again.'"),
            ("'**Built-in emojis cannot be deleted.**'", "'**Built-in emojis and GIFs cannot be deleted.**'"),
            (".setTitle('Search for Emojis')", ".setTitle('Search Emojis & GIFs')"),
            (".setLabel('What emoji are you looking for?')", ".setLabel('What emoji or GIF are you looking for?')"),
            (".setTitle('Add Emoji from Link')", ".setTitle('Add Emoji or GIF from Link')"),
            (".setLabel('Image or GIF link')", ".setLabel('Image / GIF / animation link')"),
            (".setLabel('Emoji name (optional)')", ".setLabel('Emoji / GIF name (optional)')"),
            (".setTitle('Upload Images & GIFs')", ".setTitle('Upload Emoji Images')"),
            (".setLabel('Choose emoji files')", ".setLabel('Choose static emoji files')"),
            (".setDescription('Upload up to 10 images or GIFs. Goliath will optimise them automatically.')", ".setDescription('Upload up to 10 static images. For animated media, use the dedicated Add GIF button.')"),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing anchor: {old[:90]}')
            s = s.replace(old, new, 1)

          bulk = "function bulkUploadModal() { const upload = new FileUploadBuilder().setCustomId('files').setMinValues(1).setMaxValues(10).setRequired(true); return new ModalBuilder().setCustomId('admin:module:emojis:bulk-submit').setTitle('Upload Emoji Images').addComponents(new LabelBuilder().setLabel('Choose static emoji files').setDescription('Upload up to 10 static images. For animated media, use the dedicated Add GIF button.').setFileUploadComponent(upload)); }\n"
          if bulk not in s:
            raise SystemExit('bulk upload modal anchor missing after label refresh')
          gif = "function gifUploadModal() { const upload = new FileUploadBuilder().setCustomId('files').setMinValues(1).setMaxValues(10).setRequired(true); return new ModalBuilder().setCustomId('admin:module:emojis:bulk-submit').setTitle('Upload GIF / Animation').addComponents(new LabelBuilder().setLabel('Choose animated files').setDescription('GIF, animated WebP, APNG or AVIF. Goliath will optimise while preserving animation where possible.').setFileUploadComponent(upload)); }\n"
          s = s.replace(bulk, bulk + gif, 1)

          open_anchor = "  if (id === 'admin:module:emojis:bulk-open') { await interaction.showModal(bulkUploadModal()); return true; }\n"
          if open_anchor not in s:
            raise SystemExit('bulk-open handler missing')
          s = s.replace(open_anchor, open_anchor + "  if (id === 'admin:module:emojis:gif-upload-open') { await interaction.showModal(gifUploadModal()); return true; }\n", 1)

          s = s.replace("setTitle('📤 Upload Complete')", "setTitle('📤 Emoji & GIF Upload Complete')")
          s = s.replace("button('admin:module:emojis:guild', '⭐ Manage Emojis', ButtonStyle.Primary)", "button('admin:module:emojis:guild', '⭐ Manage Library', ButtonStyle.Primary)")
          s = s.replace("button('admin:module:emojis:guild', '⭐ Manage Emojis', ButtonStyle.Secondary)", "button('admin:module:emojis:guild', '⭐ Manage Library', ButtonStyle.Secondary)")

          p.write_text(s)
          PY
      - name: Validate changed source
        run: node --check src/modules/utilityStudio/emojis/emojisPanel.js
      - name: Remove temporary workflow
        run: git rm .github/workflows/patch-emoji-gif-studio-panel-once.yml
      - name: Run doctor
        run: npm run doctor
      - name: Build dashboard
        run: npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(emojis): make GIFs first-class in studio panel'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
