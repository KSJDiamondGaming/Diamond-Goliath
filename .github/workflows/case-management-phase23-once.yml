name: Case Management Phase 23 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/case-management-phase23.py'
      - '.github/workflows/case-management-phase23-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply severity submit isolation
        run: python3 .github/case-management-phase23.py
      - name: Validate source
        run: node --check src/core/administration/mod/caseCourt.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: node -e "require('./src/core/administration/mod/caseCourt')"
      - name: Remove one-off files before Doctor
        run: rm -f .github/case-management-phase23.py .github/workflows/case-management-phase23-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit severity submit isolation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(mod): isolate named severity case submit flow"
          git pull --rebase origin dev
          git push origin HEAD:dev
