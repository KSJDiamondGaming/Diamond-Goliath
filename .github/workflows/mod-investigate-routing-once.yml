name: Repair Moderation Investigate Routing

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/mod-investigate-routing-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Patch moderation quarantine routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/core/administration/mod/interactions.js')
          s = p.read_text()

          anchor = "const caseCourt = require('./caseCourt');\n"
          repl = anchor + "const quarantineInteractions = require('./quarantineInteractions');\n"
          if "const quarantineInteractions = require('./quarantineInteractions');" not in s:
              if anchor not in s:
                  raise SystemExit('import anchor missing')
              s = s.replace(anchor, repl, 1)

          old = "const OPEN_ACTIONS = new Set(['warn', 'quarantine', ...PUNISHMENT_ACTIONS]);"
          new = "const OPEN_ACTIONS = new Set(['warn', ...PUNISHMENT_ACTIONS]);"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('OPEN_ACTIONS anchor missing')

          marker = "async function handleModInteraction(i) {\n  if (!i?.customId || !isModCustomId(i.customId)) return false;\n  if (i.customId.startsWith('nav|')) return false;\n  try {\n"
          injected = marker + "    const quarantineId = String(i.customId || '');\n    if (\n      quarantineId.startsWith('mod_open_quarantine:')\n      || quarantineId.startsWith('mod_quarantine_investigation:')\n      || quarantineId.startsWith('mod_quarantine_security:')\n      || quarantineId.startsWith('mod_remove_quarantine:')\n      || quarantineId.startsWith('mod_submit_quarantine_investigation:')\n      || quarantineId.startsWith('mod_submit_quarantine_security:')\n      || quarantineId.startsWith('mod_submit_quarantine:')\n    ) {\n      const handledQuarantine = await quarantineInteractions.handleQuarantineInteraction(i);\n      if (handledQuarantine) return true;\n    }\n"
          if "const handledQuarantine = await quarantineInteractions.handleQuarantineInteraction(i);" not in s:
              if marker not in s:
                  raise SystemExit('handleModInteraction anchor missing')
              s = s.replace(marker, injected, 1)

          p.write_text(s)
          PY
      - name: Validate source
        run: node --check src/core/administration/mod/interactions.js && node --check src/core/administration/mod/quarantineInteractions.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: node -e "require('./src/core/administration/mod/interactions'); require('./src/core/administration/mod/quarantineInteractions');"
      - name: Remove one-off workflow before Doctor
        run: rm -f .github/workflows/mod-investigate-routing-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Goliath Actions"
          git config user.email "goliath-actions@users.noreply.github.com"
          git add src/core/administration/mod/interactions.js .github/workflows/mod-investigate-routing-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(mod): route investigate through dedicated quarantine workflow"
          git push origin HEAD:dev
