name: Apply Member Intelligence Wiring Once
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/mod-intelligence-wire-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply Member Intelligence wiring
        run: node scripts/mod-intelligence-wire-temp.js
      - name: Remove temporary patch files
        run: rm -f scripts/mod-intelligence-wire-temp.js .github/workflows/mod-intelligence-wire-once.yml
      - name: Validate source
        run: |
          node -c src/core/administration/mod/intelligence.js
          node -c src/core/administration/mod/interactions.js
          node -c src/events/members/memberIntelligence.js
          npm run doctor
          npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Commit clean source to dev
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(mod): expand member intelligence network' || exit 0
          git push origin HEAD:dev
