name: Migrate automod store import

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/migrate-automod-store.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Migrate canonical import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          file = Path('src/core/automod/automodStore.js')
          old = "require('../../../core/guild/guildManager')"
          new = "require('../guild/guildManager')"
          text = file.read_text(encoding='utf-8-sig')
          if old not in text:
              raise SystemExit('Expected legacy import not found')
          file.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/migrate-automod-store.yml').unlink()
          PY
      - name: Verify and commit
        shell: bash
        run: |
          grep -F "require('../guild/guildManager')" src/core/automod/automodStore.js
          ! grep -F "../../../core/guild/guildManager" src/core/automod/automodStore.js
          git config user.name "Goliath Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Migrate automod store to canonical guild manager"
          git push origin HEAD:dev
