name: Fix NPM Audit Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-npm-audit-once.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit before
        run: npm audit --audit-level=moderate || true
      - name: Apply non-breaking audit fixes
        run: npm audit fix || true
      - name: Apply remaining security fixes
        run: npm audit fix --force
      - name: Validate dependency tree
        run: npm ls --all
      - name: Run Doctor
        run: npm run doctor
      - name: Build dashboard
        run: npm run build
      - name: Require clean moderate/high audit
        run: npm audit --audit-level=moderate
      - name: Remove one-off workflow
        run: git rm -f .github/workflows/fix-npm-audit-once.yml
      - name: Commit dependency fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No dependency changes were required.'
            exit 0
          fi
          git commit -m 'fix(deps): remediate npm audit vulnerabilities'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
