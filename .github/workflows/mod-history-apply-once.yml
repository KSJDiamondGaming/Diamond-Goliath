name: Apply Moderator History Redesign

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/mod-history-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply source patch
        run: node scripts/mod-history-redesign-once.js
      - name: Validate moderation source
        run: node --check src/core/administration/mod/panel.js
      - name: Clean temporary patch files
        run: rm -f scripts/mod-history-redesign-once.js .github/workflows/mod-history-apply-once.yml
      - name: Run project doctor
        run: npm run doctor
      - name: Build dashboard
        run: npm run dashboard:build
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/administration/mod/panel.js scripts/mod-history-redesign-once.js .github/workflows/mod-history-apply-once.yml
          git commit -m 'refactor(mod): redesign moderator history'
          git push origin HEAD:dev
