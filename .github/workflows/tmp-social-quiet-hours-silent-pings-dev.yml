name: Apply Social Studio quiet-hours silent pings DEV
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Apply patch
        run: python3 .github/scripts/patch-social-quiet-hours.py
      - name: Validate
        run: |
          node --check src/modules/socialStudio/socialAlerts/socialStudioMonitorCore.js
          node --check src/modules/socialStudio/socialAlerts/socialStudioCreatorActionCompat.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/socialStudio/socialAlerts/socialStudioMonitorCore.js src/modules/socialStudio/socialAlerts/socialStudioCreatorActionCompat.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: make Social Studio quiet hours suppress pings only"
          git push origin dev
