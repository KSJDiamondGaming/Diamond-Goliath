name: Patch Owner Server Tools 3-Col Retry Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-owner-server-tools-3col-retry-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reorganise Server Tools rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('src/owner/command.js')
          text = path.read_text()
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected Server Tools button block not found')
          PY
      - name: Validate
        run: |
          node --check src/owner/command.js
          npm run doctor
          npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Commit and push safely
        shell: bash
        run: |
          rm -f .github/workflows/patch-owner-server-tools-3col-once.yml .github/workflows/patch-owner-server-tools-3col-retry-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/owner/command.js .github/workflows/patch-owner-server-tools-3col-once.yml .github/workflows/patch-owner-server-tools-3col-retry-once.yml
          git commit -m "ui(owner): use three-column server tools rows"
          for attempt in 1 2 3 4; do
            git fetch origin dev
            git rebase origin/dev && git push origin HEAD:dev && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
