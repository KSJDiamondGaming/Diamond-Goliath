name: Case Court Phase 12 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/case-court-phase12-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply Court reversal failure safety
        run: python3 .github/case-court-phase12.py
      - name: Validate source
        run: node --check src/core/administration/mod/caseCourt.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: npm run imports
      - name: Remove one-off files before Doctor
        run: rm -f .github/case-court-phase12.py .github/workflows/case-court-phase12-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit Court reversal failure safety
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix(mod): block sanction re-execution after failed appeal reversal"
          git push origin HEAD:dev
