name: One-time root core cleanup

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/one-time-root-core-cleanup.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Migrate root core imports and remove compatibility tree
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          repo = Path.cwd().resolve()
          root_core = (repo / 'core').resolve()
          canonical_core = (repo / 'src' / 'core').resolve()
          workflow = repo / '.github' / 'workflows' / 'one-time-root-core-cleanup.yml'
          extensions = {'.js', '.cjs', '.mjs', '.jsx', '.ts', '.tsx'}
          path_pattern = re.compile(r"(?P<quote>['\"])(?P<path>(?:\.\.?/)+core/[^'\"]+)(?P=quote)")

          def is_within(path, parent):
              try:
                  path.relative_to(parent)
                  return True
              except ValueError:
                  return False

          changed = []

          for source in repo.rglob('*'):
              if not source.is_file() or source.suffix.lower() not in extensions:
                  continue
              if is_within(source.resolve(), root_core):
                  continue
              if any(part in {'.git', 'node_modules'} for part in source.parts):
                  continue

              original = source.read_text(encoding='utf-8-sig')

              def replace_path(match):
                  relative_import = match.group('path')
                  resolved = (source.parent / relative_import).resolve()
                  if not is_within(resolved, root_core):
                      return match.group(0)

                  suffix = resolved.relative_to(root_core)
                  target = canonical_core / suffix
                  replacement = os.path.relpath(target, source.parent).replace(os.sep, '/')
                  if not replacement.startswith('.'):
                      replacement = f'./{replacement}'
                  return f"{match.group('quote')}{replacement}{match.group('quote')}"

              updated = path_pattern.sub(replace_path, original)
              if updated != original:
                  source.write_text(updated, encoding='utf-8', newline='')
                  changed.append(source.relative_to(repo).as_posix())

          unresolved = []
          for source in repo.rglob('*'):
              if not source.is_file() or source.suffix.lower() not in extensions:
                  continue
              if is_within(source.resolve(), root_core):
                  continue
              if any(part in {'.git', 'node_modules'} for part in source.parts):
                  continue

              content = source.read_text(encoding='utf-8-sig')
              for match in path_pattern.finditer(content):
                  resolved = (source.parent / match.group('path')).resolve()
                  if is_within(resolved, root_core):
                      unresolved.append(f"{source.relative_to(repo)}: {match.group('path')}")

          if unresolved:
              raise SystemExit('Unresolved root core imports:\n' + '\n'.join(unresolved))

          if root_core.exists():
              shutil.rmtree(root_core)

          if workflow.exists():
              workflow.unlink()

          print('Migrated files:')
          for path in changed:
              print(f'  - {path}')
          PY

      - name: Commit cleanup to dev
        shell: bash
        run: |
          git config user.name "Goliath Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes were required."
            exit 0
          fi
          git commit -m "Remove root core compatibility tree"
          git push origin HEAD:dev
