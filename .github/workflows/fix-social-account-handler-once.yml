name: Fix Social Studio Account Handler Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-social-account-handler-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore Social Studio account interactions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/modules/socialStudio/socialAlerts/socialStudioPanel.js')
          s = p.read_text()
          start = s.index('async function handleAccountInteraction(i, context) {')
          end = s.index('\n\nasync function handleTemplateInteraction(i, context) {', start)
          replacement = r'''async function handleAccountInteraction(i, context) {
  const {
    id,
    config,
    actorId,
  } = context;

  if (id === `${P}account:new`) {
    const cid = getCreatorSession(i).creatorId;
    const creator = config.creators[cid];
    if (!creator) throw new Error('Select a creator profile first.');
    setAccountSession(i, { creatorId: cid, accountId: null, platforms: [], routeType: 'default', mode: 'add' });
    return respond(i, buildAccountAddPanel(i, config, creator));
  }

  if (id === `${P}account:select`) {
    const session = getAccountSession(i);
    const creator = config.creators[session.creatorId];
    if (!creator) throw new Error('The selected creator profile no longer exists.');
    const accountId = i.values?.[0] || null;
    const linked = new Set(creator.accountIds || []);
    if (accountId && !linked.has(accountId)) throw new Error('That account is not linked to the selected creator profile.');
    setAccountSession(i, { accountId });
    return respond(i, buildAccountManagePanel(i, config, creator));
  }

  if (id === `${P}account:platforms`) {
    const session = getAccountSession(i);
    const creator = config.creators[session.creatorId];
    if (!creator) throw new Error('The selected creator profile no longer exists.');
    const platforms = (i.values || []).filter((platform) => PLATFORMS.includes(platform)).slice(0, 5);
    setAccountSession(i, { platforms });
    return respond(i, buildAccountAddPanel(i, config, creator));
  }

  if (id === `${P}account:continue`) {
    const session = getAccountSession(i);
    const platforms = (session.platforms || []).filter((platform) => PLATFORMS.includes(platform)).slice(0, 5);
    if (!platforms.length) throw new Error('Select at least one platform first.');
    await i.showModal(accountModal(platforms));
    return true;
  }

  if (id === `${P}account:create-multi`) {
    const session = getAccountSession(i);
    const creator = config.creators[session.creatorId];
    if (!creator) throw new Error('The selected creator profile no longer exists.');
    const platforms = (session.platforms || []).filter((platform) => PLATFORMS.includes(platform)).slice(0, 5);
    let lastAccountId = null;
    for (const platform of platforms) {
      const rawValue = i.fields.getTextInputValue(`account_${platform}`).trim();
      if (!rawValue) continue;
      const result = upsertAccount(config, creator, platform, rawValue);
      lastAccountId = result.accountId;
    }
    saveConfig(i.guildId, config, i.guild, actorId);
    setAccountSession(i, { accountId: lastAccountId, platforms: [], mode: 'manage' });
    return respond(i, buildAccountManagePanel(i, getConfig(i.guildId), getConfig(i.guildId).creators[creator.creatorId]));
  }

  if (id === `${P}account:change` || id === `${P}account:edit`) {
    const session = getAccountSession(i);
    const account = config.accounts[session.accountId];
    if (!account) throw new Error('Select an account first.');
    await i.showModal(accountEditModal(account));
    return true;
  }

  if (id.startsWith(`${P}account:update:`)) {
    const accountId = id.split(':')[2];
    const account = config.accounts[accountId];
    if (!account) throw new Error('The selected account no longer exists.');
    const rawValue = i.fields.getTextInputValue('accountValue').trim();
    const normalized = normalizeAccountInput(account.platform, rawValue);
    account.username = normalized.username;
    account.normalizedUsername = normalized.normalizedUsername;
    account.externalId = normalized.externalId || account.externalId || null;
    account.inputType = normalized.inputType;
    account.canonicalIdentity = normalized.canonicalIdentity;
    account.profileUrl = normalized.profileUrl;
    account.sourceInput = normalized.sourceInput;
    account.updatedAt = now();
    saveConfig(i.guildId, config, i.guild, actorId);
    setAccountSession(i, { accountId });
    const fresh = getConfig(i.guildId);
    const creator = fresh.creators[getAccountSession(i).creatorId];
    return respond(i, buildAccountManagePanel(i, fresh, creator));
  }

  if (id === `${P}account:reset`) {
    const session = getAccountSession(i);
    const creator = config.creators[session.creatorId];
    if (!creator) throw new Error('The selected creator profile no longer exists.');
    setAccountSession(i, { accountId: null });
    return respond(i, buildAccountManagePanel(i, config, creator));
  }

  if (id === `${P}account:delete`) {
    const session = getAccountSession(i);
    const creator = config.creators[session.creatorId];
    const accountId = session.accountId;
    if (!creator || !accountId || !config.accounts[accountId]) throw new Error('Select an account first.');
    creator.accountIds = (creator.accountIds || []).filter((value) => value !== accountId);
    creator.updatedAt = now();
    delete config.accounts[accountId];
    saveConfig(i.guildId, config, i.guild, actorId);
    setAccountSession(i, { accountId: null });
    const fresh = getConfig(i.guildId);
    return respond(i, buildAccountManagePanel(i, fresh, fresh.creators[creator.creatorId]));
  }

  return false;
}'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          node --check src/modules/socialStudio/socialAlerts/socialStudioPanel.js
      - name: Commit repair and remove one-shot workflow
        run: |
          rm -f .github/workflows/fix-social-account-handler-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/socialStudio/socialAlerts/socialStudioPanel.js .github/workflows/fix-social-account-handler-once.yml
          git commit -m "fix(social): restore account management interactions"
          git pull --rebase origin dev
          git push origin dev
