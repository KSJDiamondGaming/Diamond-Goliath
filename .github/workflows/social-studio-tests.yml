name: Social Studio Verification

on:
  push:
    branches:
      - dev
    paths:
      - 'src/modules/social/**'
      - 'src/dashboard/js/pages/modules/Social.jsx'
      - 'test/social/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/social-studio-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-studio-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-social:
    name: Node 22 Social Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Social Studio module syntax
        run: |
          find src/modules/social -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run Social Studio tests
        run: npm run test:social

      - name: Build dashboard
        run: npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
