name: Integrate Case Court Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/integrate-case-court-once.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate court workspace
        shell: python
        run: |
          from pathlib import Path
          import re

          def must_replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]}')
              p.write_text(text.replace(old, new, 1))

          # Moderation panel: route Cases view into the new court workspace.
          panel = Path('src/core/administration/mod/panel.js')
          text = panel.read_text()
          anchor = "const { getQuarantineState } = require('../../security/protection/quarantine');"
          if "require('./caseCourt')" not in text:
              text = text.replace(anchor, anchor + "\nconst caseCourt = require('./caseCourt');", 1)
          pattern = re.compile(r"  else if \(safeView === 'cases'\) \{.*?\n  else if \(safeView === 'analytics'\)", re.S)
          replacement = "  else if (safeView === 'cases') { const courtView = caseCourt.buildCourtDashboard(interaction, target); embeds.push(courtView.embed); components.push(...courtView.components); }\n  else if (safeView === 'analytics')"
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace cases dashboard branch')
          panel.write_text(text)

          # Moderation interaction routing.
          inter = Path('src/core/administration/mod/interactions.js')
          text = inter.read_text()
          anchor = "const memberIntelligence = require('./intelligence');"
          if "require('./caseCourt')" not in text:
              text = text.replace(anchor, anchor + "\nconst caseCourt = require('./caseCourt');", 1)
          text = text.replace(
              "if (i.isStringSelectMenu?.()) return routeHandlers(i, [handleMemberScanStringSelect, handleCaseSearchSelect]);",
              "if (i.isStringSelectMenu?.()) return routeHandlers(i, [caseCourt.handleCourtInteraction, handleMemberScanStringSelect, handleCaseSearchSelect]);",
              1,
          )
          text = text.replace(
              "return routeHandlers(i, [handleExportInteraction, handleConfirmButton, value => handleCaseAction(value, { fetchTarget, createConfirmation }), handleMemberScanButton, handleDashboardNavigation, handleCancelButton, handleBulkButton, handleOpenActionButton, handleCaseToolButton]);",
              "return routeHandlers(i, [handleExportInteraction, handleConfirmButton, caseCourt.handleCourtInteraction, value => handleCaseAction(value, { fetchTarget, createConfirmation }), handleMemberScanButton, handleDashboardNavigation, handleCancelButton, handleBulkButton, handleOpenActionButton, handleCaseToolButton]);",
              1,
          )
          modal_anchor = "  await syncExpiredWarningsToCases(i.guild.id);"
          if "caseCourt.handleCourtModal(i)" not in text:
              text = text.replace(modal_anchor, modal_anchor + "\n  const courtResult = await caseCourt.handleCourtModal(i);\n  if (courtResult) return courtResult;", 1)
          inter.write_text(text)

          # User panel: make Cases live and describe published-only view.
          user_panel = Path('src/core/administration/user/panel.js')
          text = user_panel.read_text()
          text = text.replace(
              "{ key: 'cases', category: 'account', label: 'Cases', emoji: '📁', summary: 'Planned view of your own cases.', status: 'planned' },",
              "{ key: 'cases', category: 'account', label: 'Cases', emoji: '📁', summary: 'View official case records published to you by staff.', status: 'live' },",
              1,
          )
          user_panel.write_text(text)

          # User interactions: expose only published case records.
          user_inter = Path('src/core/administration/user/interactions.js')
          text = user_inter.read_text()
          anchor = "const { getAppealEligibility, getCaseAppeals, openExternalAppealFromCommand } = require('../mod/cases');"
          if "require('../mod/caseCourt')" not in text:
              text = text.replace(anchor, anchor + "\nconst caseCourt = require('../mod/caseCourt');", 1)
          text = text.replace(
              "    if (moduleKey === 'appeals') return showUserAppeals(interaction);",
              "    if (moduleKey === 'cases') return updatePanel(interaction, caseCourt.buildUserPublishedCasesPanel(interaction));\n    if (moduleKey === 'appeals') return showUserAppeals(interaction);",
              1,
          )
          second = "    if (moduleKey === 'appeals') return showUserAppeals(interaction);"
          pos = text.find(second, text.find("const moduleKey = moduleMatch[1];"))
          if pos != -1 and "moduleKey === 'cases'" not in text[max(0, pos-250):pos]:
              text = text[:pos] + "    if (moduleKey === 'cases') return updatePanel(interaction, caseCourt.buildUserPublishedCasesPanel(interaction));\n" + text[pos:]
          user_inter.write_text(text)

      - name: Validate source
        run: |
          node --check src/core/administration/mod/caseCourt.js
          node --check src/core/administration/mod/panel.js
          node --check src/core/administration/mod/interactions.js
          node --check src/core/administration/user/panel.js
          node --check src/core/administration/user/interactions.js
      - name: Install dependencies
        run: npm ci
      - name: Run Doctor
        run: npm run doctor
      - name: Remove one-off workflow
        run: rm -f .github/workflows/integrate-case-court-once.yml
      - name: Commit case court integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat(mod): integrate moderation court case system'
          git push origin dev
