name: Fix Embed Channel Diagnostics

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch Embed Studio channel checks
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/modules/embed/embedPanel.js')
          text = path.read_text(encoding='utf-8')

          old_import = '''  ChannelType,
  ModalBuilder,'''
          new_import = '''  ChannelType,
  PermissionFlagsBits,
  ModalBuilder,'''
          if old_import not in text:
              raise SystemExit('discord.js import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_require = '''const guildManager = require("../../core/guild/guildManager");
'''
          new_require = '''const guildManager = require("../../core/guild/guildManager");
const {
  validateChannelAccess,
} = require("../../core/security/goliathPermissionGuard");
'''
          if old_require not in text:
              raise SystemExit('guildManager require anchor not found')
          text = text.replace(old_require, new_require, 1)

          old_block = '''    if (i.customId === "embed:use") {
      const channel =
        i.guild.channels.cache.get(s.channelId) ||
        (await i.guild.channels.fetch(s.channelId).catch(() => null));
      if (!channel?.isTextBased())
        return i.reply({ content: "Invalid channel.", flags: 64 });
      let sent;
      try {
        sent = await channel.send({
          content: s.allowUserPing ? `<@${i.user.id}>` : "",
          embeds: buildPreviewEmbeds(s, i),
          components: buttonRows(s),
          allowedMentions: allowedMentions(s, i),
        });
      } catch (error) {
        console.error("Embed send failed:", error);
        return i.reply({
          content:
            "❌ I cannot send messages to that channel. Check Send Messages, Embed Links and View Channel permissions.",
          flags: 64,
        });
      }
'''

          new_block = '''    if (i.customId === "embed:use") {
      const channel =
        i.guild.channels.cache.get(s.channelId) ||
        (await i.guild.channels.fetch(s.channelId).catch(() => null));
      if (!channel?.isTextBased())
        return i.reply({ content: "Invalid channel.", flags: 64 });

      const access = await validateChannelAccess(
        i.guild,
        channel.id,
        [
          PermissionFlagsBits.ViewChannel,
          PermissionFlagsBits.SendMessages,
          PermissionFlagsBits.EmbedLinks,
        ],
        { scope: "embed.deploy" },
      );

      if (!access.ok) {
        const missing = (access.missingPermissions || [])
          .map((permission) => `\\`${permission}\\``)
          .join(", ");
        return i.reply({
          content: missing
            ? `❌ Goliath is missing ${missing} in <#${channel.id}>.`
            : `❌ Goliath cannot access <#${channel.id}>. Check its channel and category overrides.`,
          flags: 64,
        });
      }

      let payload;
      try {
        payload = {
          content: s.allowUserPing ? `<@${i.user.id}>` : "",
          embeds: buildPreviewEmbeds(s, i),
          components: buttonRows(s),
          allowedMentions: allowedMentions(s, i),
        };
      } catch (error) {
        console.error("Embed payload build failed:", error);
        return i.reply({
          content: `❌ The embed could not be built: ${trim(error?.message || "invalid embed data", 300)}`,
          flags: 64,
        });
      }

      let sent;
      try {
        sent = await channel.send(payload);
      } catch (error) {
        console.error("Embed send failed:", error);
        const code = Number(error?.code || error?.rawError?.code || 0);
        const detail = trim(
          error?.rawError?.message || error?.message || "Discord rejected the message.",
          300,
        );

        let content = `❌ Discord rejected the embed: ${detail}`;
        if (code === 50001 || code === 50013) {
          content = `❌ Discord denied access to <#${channel.id}>. Recheck Goliath's effective channel/category permissions.`;
        } else if (code === 50035) {
          content = `❌ Discord rejected part of the embed or its buttons: ${detail}`;
        }

        return i.reply({ content, flags: 64 });
      }
'''

          if old_block not in text:
              raise SystemExit('embed use block anchor not found')
          text = text.replace(old_block, new_block, 1)
          path.write_text(text, encoding='utf-8')

      - name: Validate syntax
        run: node --check src/modules/embed/embedPanel.js

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/embed/embedPanel.js
          git commit -m "fix: diagnose embed channel send failures accurately"
          git push origin dev
