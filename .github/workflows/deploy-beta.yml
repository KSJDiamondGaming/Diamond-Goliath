name: Deploy Beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: deploy-beta
  cancel-in-progress: true

jobs:
  deploy-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy BETA to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e

            echo "🚀 Deploying BETA..."

            cd /home/goliath/beta

            echo "📥 Syncing beta branch..."
            git checkout beta
            git fetch origin beta
            git reset --hard origin/beta

            echo "📦 Installing dependencies..."
            npm install

            echo "♻️ Restarting BETA bot..."
            BOT_MODE=beta pm2 restart goliath-beta --update-env

            pm2 save

            echo "✅ BETA deployment complete"
