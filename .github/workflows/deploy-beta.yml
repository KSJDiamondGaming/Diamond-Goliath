name: Deploy Beta

on:
  push:
    branches:
      - beta

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy BETA to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e

            cd /home/goliath/beta

            git fetch origin
            git reset --hard origin/beta
            git clean -fd

            npm install

            pm2 restart goliath-beta --update-env
            pm2 save

            echo "✅ BETA auto deploy complete"