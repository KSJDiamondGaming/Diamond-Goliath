name: Deploy Beta

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /home/goliath/beta

            SNAPSHOT_DIR="/home/goliath/runtime/snapshots/beta"
            SNAPSHOT_NAME="beta-$(date +%Y-%m-%d-%H-%M-%S).tar.gz"

            mkdir -p "$SNAPSHOT_DIR"

            tar -czf "$SNAPSHOT_DIR/$SNAPSHOT_NAME" \
              --exclude=node_modules \
              --exclude=.git \
              -C /home/goliath beta

            cd "$SNAPSHOT_DIR"
            ls -1t beta-*.tar.gz | tail -n +4 | xargs -r rm --

            cd /home/goliath/beta

            git fetch origin
            git reset --hard origin/beta

            npm install

            BOT_MODE=beta pm2 restart goliath-beta --update-env

            pm2 save