name: Deploy Beta

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /home/goliath/beta

            git fetch origin
            git reset --hard origin/beta

            npm install

            BOT_MODE=beta pm2 restart goliath-beta --update-env

            pm2 save