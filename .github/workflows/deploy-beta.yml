name: Deploy BETA

on:
  push:
    branches:
      - beta

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy BETA to VPS
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            echo "🚀 Deploying BETA..."

            cd /home/goliath/beta

            echo "🛑 Stopping BETA..."
            pm2 stop goliath-beta || true

            echo "📥 Syncing BETA branch..."
            git fetch origin
            git reset --hard origin/beta
            git clean -fd

            echo "📦 Installing dependencies..."
            npm install

            echo "🚀 Starting BETA..."
            pm2 restart ecosystem.config.js --only goliath-beta --update-env

            pm2 save

            echo "✅ BETA deployment complete"