name: Deploy Beta

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS (Beta)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e

            echo "🚀 Deploying BETA..."

            cd /home/goliath/Diamond-Goliath

            echo "📦 Creating local backup (runtime system handles snapshots now)"

            git checkout beta
            git fetch origin
            git reset --hard origin/beta

            echo "📥 Installing dependencies..."
            npm install

            echo "♻️ Restarting bot..."
            BOT_MODE=beta pm2 restart goliath-beta --update-env

            pm2 save

            echo "✅ Beta deployment complete"