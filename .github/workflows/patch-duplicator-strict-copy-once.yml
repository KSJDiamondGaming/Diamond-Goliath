name: Patch Duplicator Strict Copy Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-duplicator-strict-copy-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply strict Duplicator repair
        run: node scripts/patch-duplicator-strict-copy-once.js
      - name: Validate changed Duplicator source
        run: |
          node --check src/owner/dev/duplicator/core.js
          node --check src/owner/dev/duplicator/selective.js
          node --check src/owner/dev/duplicator/index.js
      - name: Remove temporary patch script before doctor
        run: rm -f scripts/patch-duplicator-strict-copy-once.js
      - name: Full project doctor
        run: npm run doctor
      - name: Build dashboard
        run: npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Remove one-off workflow
        run: rm -f .github/workflows/patch-duplicator-strict-copy-once.yml
      - name: Commit and push repair safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(duplicator): enforce exact selective copy verification'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
