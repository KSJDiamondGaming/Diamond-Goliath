name: Patch Duplicator Delete Order V2

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/patch-duplicator-delete-order-v2-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/patch-duplicator-delete-order-temp.js
      - run: rm -f scripts/patch-duplicator-delete-order-temp.js
      - run: node --check src/owner/dev/duplicator/selective.js
      - run: npm run doctor
      - run: npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/owner/dev/duplicator/selective.js scripts/patch-duplicator-delete-order-temp.js
          git commit -m 'fix(duplicator): mirror Discord order in bulk delete'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
