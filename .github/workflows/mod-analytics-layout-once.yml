name: Apply Moderation Analytics Layout Cleanup

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/mod-analytics-layout-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply moderation analytics layout patch
        run: node scripts/mod-analytics-layout-temp.js
      - name: Validate clean source
        run: |
          set -euo pipefail
          node --check src/core/administration/mod/panel.js
          npm run syntax
          npm run imports
          rm scripts/mod-analytics-layout-temp.js
          rm .github/workflows/mod-analytics-layout-once.yml
          npm run doctor
      - name: Commit clean source
        run: |
          set -euo pipefail
          git config user.name "KSJHub"
          git config user.email "actions@users.noreply.github.com"
          git add src/core/administration/mod/panel.js
          git add -u scripts/mod-analytics-layout-temp.js .github/workflows/mod-analytics-layout-once.yml
          git diff --cached --check
          git commit -m "refactor(mod): improve analytics layout and navigation"
          git push origin HEAD:dev
