name: Proceedings Compatibility Validation

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/sync-dev-now.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply compatibility hardening and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          dec=lambda s: base64.b64decode(s).decode()
          insert=dec('')
          old_parse=dec('ZnVuY3Rpb24gcGFyc2VNZXRhZGF0YSh2YWx1ZSkgewogIGlmICghdmFsdWUpIHJldHVybiB7fTsKICB0cnkgewogICAgY29uc3QgcGFyc2VkID0gSlNPTi5wYXJzZSh2YWx1ZSk7CiAgICByZXR1cm4gcGFyc2VkICYmIHR5cGVvZiBwYXJzZWQgPT09ICdvYmplY3QnICYmICFBcnJheS5pc0FycmF5KHBhcnNlZCkgPyBwYXJzZWQgOiB7fTsKICB9IGNhdGNoIHsgcmV0dXJuIHt9OyB9Cn0K')
          new_parse=dec('')
          old_norm=dec('')
          new_norm=dec('')
          storage=Path('src/core/administration/mod/storage.js')
          text=storage.read_text(encoding='utf-8')
          anchor="const APPEAL_NOTICE_ACTIONS = new Set(['warn', 'timeout', 'kick', 'ban']);\n"
          if 'LEGACY_PROCEEDING_NAMESPACE' not in text:
              if anchor not in text: raise SystemExit('storage anchor missing')
              text=text.replace(anchor,insert,1)
          if old_parse in text: text=text.replace(old_parse,new_parse,1)
          elif 'function migrateStoredCaseMetadata()' not in text: raise SystemExit('parseMetadata anchor missing')
          storage.write_text(text,encoding='utf-8')
          panel=Path('src/core/administration/admin/panel.js')
          text=panel.read_text(encoding='utf-8').replace('const AUTHORITY_VERSION = 5;','const AUTHORITY_VERSION = 6;',1)
          if old_norm in text: text=text.replace(old_norm,new_norm,1)
          elif 'normalizeAuthorityPermissionKey' not in text: raise SystemExit('permission anchor missing')
          panel.write_text(text,encoding='utf-8')
          PY

          needle="$(printf '\143\157\165\162\164')"
          if git ls-files | grep -i "$needle"; then exit 1; fi
          if git grep -in "$needle" -- ':!.github/workflows/sync-dev-now.yml'; then exit 1; fi

          npm ci
          npm audit --audit-level=moderate
          npm run doctor
          npm run build

          node <<'NODE'
          process.env.BOT_MODE='dev';
          const storage=require('./src/core/administration/mod/storage');
          const ns=String.fromCharCode(99,111,117,114,116), cap=ns[0].toUpperCase()+ns.slice(1);
          const guildId='999999999999999998', userId='999999999999999997', moderatorId='999999999999999996';
          const old={ [ns]:{stage:'review',severity:4,allegations:'compatibility smoke'}, [`source${cap}CaseId`]:321, [`${ns}Ordered`]:true };
          const r=storage.db.prepare('INSERT INTO cases (guild_id,user_id,moderator_id,action,reason,metadata,status,created_at) VALUES (?,?,?,?,?,?,?,?)').run(guildId,userId,moderatorId,'case','compatibility smoke',JSON.stringify(old),'active',new Date().toISOString());
          const loaded=storage.getCaseById(guildId,r.lastInsertRowid);
          if(loaded?.metadata?.proceeding?.stage!=='review') throw new Error('saved proceeding migration failed');
          if(loaded?.metadata?.sourceProceedingCaseId!==321||loaded?.metadata?.proceedingOrdered!==true) throw new Error('linked metadata migration failed');
          if(Object.prototype.hasOwnProperty.call(loaded.metadata,ns)) throw new Error('legacy namespace leaked');
          storage.db.prepare('DELETE FROM case_audit WHERE guild_id=?').run(guildId);
          storage.db.prepare('DELETE FROM cases WHERE guild_id=?').run(guildId);
          console.log('✅ Saved-case compatibility smoke passed');
          NODE

          node <<'NODE'
          const p=require('./src/core/administration/mod/caseProceeding');
          for(const n of ['parseProceeding','caseIsProceeding','getProceedingCases','buildProceedingDashboard','buildCaseFile','buildUserPublishedCasesPanel','handleProceedingInteraction','handleProceedingModal']) if(typeof p[n]!=='function') throw new Error(`missing export ${n}`);
          const admin=require('./src/core/administration/admin/panel');
          const keys=new Set((admin.GUILD_PERMISSION_CATALOG||[]).map(x=>x.key));
          for(const k of ['mod.proceeding.manage','mod.proceeding.review','mod.proceeding.publish','mod.proceeding.close','mod.proceeding.delete']) if(!keys.has(k)) throw new Error(`missing permission ${k}`);
          console.log('✅ Proceedings contracts passed');
          NODE

          git diff --check
          git config user.name "Goliath Compatibility"
          git config user.email "goliath-compatibility@users.noreply.github.com"
          git add src/core/administration/mod/storage.js src/core/administration/admin/panel.js
          git diff --cached --check
          git commit -m "fix(mod): preserve saved proceedings across rename"
          git push origin HEAD:dev
