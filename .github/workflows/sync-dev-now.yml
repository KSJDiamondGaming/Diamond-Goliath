name: Case Proceedings Rename Validation

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/sync-dev-now.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Rename Court subsystem to Case Proceedings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          skip_dirs = {'.git', 'node_modules', 'dist', 'build', 'coverage'}
          skip_files = {Path('.github/workflows/sync-dev-now.yml')}
          binary_ext = {'.png','.jpg','.jpeg','.gif','.webp','.ico','.zip','.gz','.sqlite','.db','.woff','.woff2','.ttf','.mp3','.mp4','.pdf'}

          for path in list(root.rglob('*')):
              if not path.is_file() or path in skip_files or any(part in skip_dirs for part in path.parts) or path.suffix.lower() in binary_ext:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              changed = text.replace('COURT', 'PROCEEDING').replace('Court', 'Proceeding').replace('court', 'proceeding')
              if changed != text:
                  path.write_text(changed, encoding='utf-8')

          old = Path('src/core/administration/mod/caseCourt.js')
          new = Path('src/core/administration/mod/caseProceeding.js')
          if old.exists():
              old.rename(new)

          # User-facing terminology: keep the judicial workflow feel without naming it after a court.
          for path in [Path('src/core/administration/mod/caseProceeding.js'), Path('src/core/administration/mod/cases.js'), Path('src/core/administration/user/interactions.js')]:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('Case Proceeding Dashboard', 'Case Proceedings')
              text = text.replace('Proceeding Dashboard', 'Case Proceedings')
              text = text.replace('Proceeding Case', 'Case File')
              text = text.replace('Proceeding case', 'case file')
              text = text.replace('Proceeding record', 'case record')
              text = text.replace('proceeding record', 'case record')
              path.write_text(text, encoding='utf-8')
          PY

          # The requested term must be absent from the application/repository tree,
          # excluding this temporary validator because its own migration script names it.
          if git grep -in 'court' -- ':!.github/workflows/sync-dev-now.yml'; then
            echo 'Forbidden legacy terminology remains.' >&2
            exit 1
          fi

          npm ci
          npm audit --audit-level=moderate
          npm run doctor
          npm run build

          git config user.name "Goliath Case Proceedings"
          git config user.email "goliath-case-proceedings@users.noreply.github.com"
          git add -A -- ':!.github/workflows/sync-dev-now.yml'
          git diff --cached --check
          git commit -m "refactor(mod): rename Court system to Case Proceedings"
          git push origin HEAD:dev
