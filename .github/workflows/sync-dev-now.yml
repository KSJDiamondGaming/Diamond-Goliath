name: Sync Goliath

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target environment
        required: true
        default: beta
        type: choice
        options:
          - beta
          - production
          - dev

permissions:
  contents: write
  statuses: write

concurrency:
  group: sync-goliath-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      promoted_sha: ${{ steps.promote.outputs.promoted_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Promote DEV application tree to target branch
        id: promote
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [ "$TARGET" = "dev" ]; then
            SHA="$(git rev-parse HEAD)"
            echo "DEV selected: no branch promotion required."
            echo "promoted_sha=$SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin dev "$TARGET"
          DEV_SHA="$(git rev-parse origin/dev)"
          TARGET_SHA="$(git rev-parse origin/$TARGET)"

          git config user.name "Goliath Sync"
          git config user.email "goliath-sync@users.noreply.github.com"
          git switch -C "promote-$TARGET" "$TARGET_SHA"

          # Promote the complete application tree from DEV while keeping the
          # target branch's GitHub workflow control files. GITHUB_TOKEN cannot
          # rewrite workflow files without an additional workflows permission,
          # and workflow YAML is not part of the running Goliath application.
          git diff --binary "$TARGET_SHA" "$DEV_SHA" -- . ':(exclude).github/workflows/**' > /tmp/goliath-promotion.patch

          if [ -s /tmp/goliath-promotion.patch ]; then
            git apply --index /tmp/goliath-promotion.patch
            git commit -m "Promote DEV $DEV_SHA to $TARGET"
            git push origin "HEAD:refs/heads/$TARGET"
          else
            echo "$TARGET already matches DEV application files."
          fi

          git fetch --no-tags origin dev "$TARGET"
          FINAL_SHA="$(git rev-parse origin/$TARGET)"

          if ! git diff --quiet origin/dev "origin/$TARGET" -- . ':(exclude).github/workflows/**'; then
            echo "Promotion verification failed: $TARGET application files do not match DEV." >&2
            git diff --stat origin/dev "origin/$TARGET" -- . ':(exclude).github/workflows/**' >&2
            exit 1
          fi

          echo "promoted_sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"
          echo "✅ DEV application tree promoted to $TARGET at $FINAL_SHA"

  deploy:
    needs: promote
    uses: ./.github/workflows/deploy-dev.yml
    with:
      environment: ${{ inputs.target }}
      operation: sync
    secrets: inherit

  summary:
    needs: [promote, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write sync summary
        shell: bash
        run: |
          {
            echo "## Sync Goliath"
            echo ""
            echo "- Target: **${{ inputs.target }}**"
            echo "- Promotion result: **${{ needs.promote.result }}**"
            echo "- VPS deploy result: **${{ needs.deploy.result }}**"
            echo "- Target commit: **${{ needs.promote.outputs.promoted_sha }}**"
            echo ""
            if [ "${{ inputs.target }}" = "dev" ]; then
              echo "DEV branch → DEV VPS."
            else
              echo "DEV application files → $TARGET branch → $TARGET VPS."
              echo "Target branch workflow-control YAML is intentionally preserved; all Goliath runtime/application files come from DEV."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "${{ needs.promote.result }}" = "success" ]
          [ "${{ needs.deploy.result }}" = "success" ]
