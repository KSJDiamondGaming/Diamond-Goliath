      - name: Validate changed source
        shell: bash
        run: |
          set -euo pipefail
          node --check src/core/administration/mod/cases.js
          node --check src/core/administration/mod/caseCourt.js
          npm ci
          npm run doctor

      - name: Commit source fixes and restore permanent workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "Goliath Actions"
          git config user.email "actions@users.noreply.github.com"
          git show HEAD^:.github/workflows/sync-dev-now.yml > .github/workflows/sync-dev-now.yml
          git add src/core/administration/mod/cases.js src/core/administration/mod/caseCourt.js .github/workflows/sync-dev-now.yml
          git diff --cached --check
          git commit -m "fix(mod): complete Case Court consistency hardening"
          git push origin HEAD:dev
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch validated DEV deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-dev.yml --ref dev -f environment=dev
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow deploy-dev.yml --branch dev --event workflow_dispatch --limit 10 --json databaseId,headSha,status --jq '.[] | select(.headSha == env.SOURCE_SHA) | .databaseId' | head -n1)"
            if [ -n "$RUN_ID" ]; then
              echo "Deployment run: $RUN_ID"
              gh run watch "$RUN_ID" --exit-status
              exit 0
            fi
            sleep 2
          done
          echo "Could not locate the dispatched DEV deployment run for $SOURCE_SHA" >&2
          exit 1
