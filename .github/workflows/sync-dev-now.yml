name: Express 5 Validation

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/sync-dev-now.yml'

permissions:
  contents: write

jobs:
  validate-express5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply Express 5 compatibility patch in validation worktree
        shell: bash
        run: |
          set -euo pipefail
          export EXPRESS="$(npm view express@5 version --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);console.log(Array.isArray(v)?v[v.length-1]:v)})")"
          echo "Selected express=$EXPRESS"
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies.express = `^${process.env.EXPRESS}`;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const serverPath = 'server.js';
          const source = fs.readFileSync(serverPath, 'utf8');
          const oldLine = "  app.get('*', (req, res) => req.path.startsWith('/api/') ? res.status(404).json({ error: 'Not found' }) : res.sendFile(path.join(dashboardDist, 'index.html')));";
          const newLine = "  app.use((req, res, next) => {\n    if (req.method !== 'GET') return next();\n    return req.path.startsWith('/api/')\n      ? res.status(404).json({ error: 'Not found' })\n      : res.sendFile(path.join(dashboardDist, 'index.html'));\n  });";
          if (!source.includes(oldLine)) throw new Error('Expected SPA fallback route not found');
          fs.writeFileSync(serverPath, source.replace(oldLine, newLine));
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Validate Express 5 application compatibility
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node -e "const express=require('express'); const app=express(); app.get('/health',(req,res)=>res.json({ok:true})); app.use((req,res,next)=>req.method==='GET'?res.send('fallback'):next()); if(typeof app.listen!=='function') process.exit(1); console.log('Express 5 routing smoke test OK')"
          npm run doctor
          npm run build
          npm audit --json > /tmp/audit-final.json || true
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/audit-final.json', 'utf8'));
          const v = data.metadata?.vulnerabilities || {};
          console.log('FINAL_AUDIT', JSON.stringify(v));
          for (const [name, item] of Object.entries(data.vulnerabilities || {})) console.log(`REMAINING ${name} severity=${item.severity} fix=${JSON.stringify(item.fixAvailable)}`);
          if (Number(v.total || 0) !== 0) {
            console.error('Vulnerabilities remain after Express 5 validation; refusing to commit.');
            process.exit(1);
          }
          NODE

      - name: Commit validated Express 5 migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Goliath Dependency Hardening"
          git config user.email "goliath-dependency-hardening@users.noreply.github.com"
          git add package.json package-lock.json server.js
          if git diff --cached --quiet; then
            echo "No Express migration changes required."
            exit 0
          fi
          git commit -m "chore(deps): migrate dashboard server to Express 5"
          git push origin HEAD:dev
