name: Proceedings Compatibility Validation

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/sync-dev-now.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply compatibility hardening and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          storage = Path('src/core/administration/mod/storage.js')
          text = storage.read_text(encoding='utf-8')
          anchor = "const APPEAL_NOTICE_ACTIONS = new Set(['warn', 'timeout', 'kick', 'ban']);\n"
          insert = """const APPEAL_NOTICE_ACTIONS = new Set(['warn', 'timeout', 'kick', 'ban']);
const LEGACY_PROCEEDING_NAMESPACE = String.fromCharCode(99, 111, 117, 114, 116);

function normalizePersistedCaseMetadata(source) {
  const metadata = source && typeof source === 'object' && !Array.isArray(source) ? { ...source } : {};
  const legacyNamespace = LEGACY_PROCEEDING_NAMESPACE;
  const legacyProceeding = metadata[legacyNamespace];
  if ((!metadata.proceeding || typeof metadata.proceeding !== 'object') && legacyProceeding && typeof legacyProceeding === 'object' && !Array.isArray(legacyProceeding)) {
    metadata.proceeding = legacyProceeding;
  }
  delete metadata[legacyNamespace];

  const legacyTitle = `${legacyNamespace[0].toUpperCase()}${legacyNamespace.slice(1)}`;
  const legacySourceCaseIdKey = `source${legacyTitle}CaseId`;
  const legacyOrderedKey = `${legacyNamespace}Ordered`;
  if (metadata.sourceProceedingCaseId == null && metadata[legacySourceCaseIdKey] != null) metadata.sourceProceedingCaseId = metadata[legacySourceCaseIdKey];
  if (metadata.proceedingOrdered == null && metadata[legacyOrderedKey] != null) metadata.proceedingOrdered = metadata[legacyOrderedKey];
  delete metadata[legacySourceCaseIdKey];
  delete metadata[legacyOrderedKey];
  return metadata;
}
"""
          if 'LEGACY_PROCEEDING_NAMESPACE' not in text:
              if anchor not in text:
                  raise SystemExit('storage anchor missing')
              text = text.replace(anchor, insert, 1)

          old_parse = """function parseMetadata(value) {
  if (!value) return {};
  try {
    const parsed = JSON.parse(value);
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
  } catch { return {}; }
}
"""
          new_parse = """function parseMetadata(value) {
  if (!value) return {};
  try {
    const parsed = JSON.parse(value);
    return normalizePersistedCaseMetadata(parsed);
  } catch { return {}; }
}

function migrateStoredCaseMetadata() {
  const rows = db.prepare("SELECT case_id, metadata FROM cases WHERE metadata IS NOT NULL AND metadata <> ''").all();
  const update = db.prepare('UPDATE cases SET metadata = ? WHERE case_id = ?');
  let migrated = 0;
  const transaction = db.transaction(() => {
    for (const row of rows) {
      let parsed;
      try { parsed = JSON.parse(row.metadata); } catch { continue; }
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) continue;
      const normalized = normalizePersistedCaseMetadata(parsed);
      const serialized = JSON.stringify(normalized);
      if (serialized === row.metadata) continue;
      update.run(serialized, row.case_id);
      migrated += 1;
    }
  });
  transaction();
  return migrated;
}

const migratedStoredCaseMetadata = migrateStoredCaseMetadata();
if (migratedStoredCaseMetadata > 0) console.log(`✅ Migrated ${migratedStoredCaseMetadata} saved case metadata record(s) to the current schema.`);
"""
          if old_parse in text:
              text = text.replace(old_parse, new_parse, 1)
          elif 'function migrateStoredCaseMetadata()' not in text:
              raise SystemExit('parseMetadata anchor missing')
          storage.write_text(text, encoding='utf-8')

          panel = Path('src/core/administration/admin/panel.js')
          text = panel.read_text(encoding='utf-8')
          text = text.replace('const AUTHORITY_VERSION = 5;', 'const AUTHORITY_VERSION = 6;', 1)
          old_norm = """function normalizePermissionMap(source, defaults) {
  const permissions = { ...defaults };
  for (const [key, value] of Object.entries(source || {})) if (GUILD_PERMISSION_KEYS.has(key)) permissions[key] = Boolean(value);
  return permissions;
}
"""
          new_norm = """const LEGACY_PERMISSION_SCOPE = String.fromCharCode(99, 111, 117, 114, 116);
function normalizeAuthorityPermissionKey(key) {
  const raw = String(key || '');
  const legacyPrefix = `mod.${LEGACY_PERMISSION_SCOPE}.`;
  return raw.startsWith(legacyPrefix) ? `mod.proceeding.${raw.slice(legacyPrefix.length)}` : raw;
}
function normalizePermissionMap(source, defaults) {
  const permissions = { ...defaults };
  for (const [key, value] of Object.entries(source || {})) {
    const normalizedKey = normalizeAuthorityPermissionKey(key);
    if (GUILD_PERMISSION_KEYS.has(normalizedKey)) permissions[normalizedKey] = Boolean(value);
  }
  return permissions;
}
"""
          if old_norm in text:
              text = text.replace(old_norm, new_norm, 1)
          elif 'normalizeAuthorityPermissionKey' not in text:
              raise SystemExit('permission normalization anchor missing')
          panel.write_text(text, encoding='utf-8')
          PY

          # Removed terminology must remain absent from all application text and filenames.
          needle="$(printf '\143\157\165\162\164')"
          if git ls-files | grep -i "$needle"; then
            echo 'Legacy term remains in tracked filename.' >&2
            exit 1
          fi
          if git grep -in "$needle" -- ':!.github/workflows/sync-dev-now.yml'; then
            echo 'Legacy term remains in application text.' >&2
            exit 1
          fi

          npm ci
          npm audit --audit-level=moderate
          npm run doctor
          npm run build

          # Targeted runtime compatibility smoke: insert old-schema metadata without spelling its namespace.
          node <<'NODE'
          process.env.BOT_MODE = 'dev';
          const storage = require('./src/core/administration/mod/storage');
          const ns = String.fromCharCode(99,111,117,114,116);
          const cap = ns[0].toUpperCase() + ns.slice(1);
          const guildId = '999999999999999998';
          const userId = '999999999999999997';
          const moderatorId = '999999999999999996';
          const old = { [ns]: { stage: 'review', severity: 4, allegations: 'compatibility smoke' }, [`source${cap}CaseId`]: 321, [`${ns}Ordered`]: true };
          const result = storage.db.prepare('INSERT INTO cases (guild_id,user_id,moderator_id,action,reason,metadata,status,created_at) VALUES (?,?,?,?,?,?,?,?)')
            .run(guildId,userId,moderatorId,'case','compatibility smoke',JSON.stringify(old),'active',new Date().toISOString());
          const loaded = storage.getCaseById(guildId, result.lastInsertRowid);
          if (loaded?.metadata?.proceeding?.stage !== 'review') throw new Error('saved case proceeding metadata migration failed');
          if (loaded?.metadata?.sourceProceedingCaseId !== 321 || loaded?.metadata?.proceedingOrdered !== true) throw new Error('linked sanction metadata migration failed');
          if (Object.prototype.hasOwnProperty.call(loaded.metadata, ns)) throw new Error('legacy metadata namespace leaked after normalization');
          storage.db.prepare('DELETE FROM case_audit WHERE guild_id = ?').run(guildId);
          storage.db.prepare('DELETE FROM cases WHERE guild_id = ?').run(guildId);
          console.log('✅ Saved-case compatibility smoke passed');
          NODE

          # Contract-level smoke for renamed subsystem exports and authority catalog.
          node <<'NODE'
          const proceeding = require('./src/core/administration/mod/caseProceeding');
          const required = ['parseProceeding','caseIsProceeding','getProceedingCases','buildProceedingDashboard','buildCaseFile','buildUserPublishedCasesPanel','handleProceedingInteraction','handleProceedingModal'];
          for (const name of required) if (typeof proceeding[name] !== 'function') throw new Error(`missing case proceeding export: ${name}`);
          const admin = require('./src/core/administration/admin/panel');
          const keys = new Set((admin.GUILD_PERMISSION_CATALOG || []).map((entry) => entry.key));
          for (const key of ['mod.proceeding.manage','mod.proceeding.review','mod.proceeding.publish','mod.proceeding.close','mod.proceeding.delete']) if (!keys.has(key)) throw new Error(`missing permission catalog key: ${key}`);
          console.log('✅ Proceedings contracts and authority catalog passed');
          NODE

          git diff --check
          git config user.name "Goliath Compatibility"
          git config user.email "goliath-compatibility@users.noreply.github.com"
          git add src/core/administration/mod/storage.js src/core/administration/admin/panel.js
          git diff --cached --check
          git commit -m "fix(mod): preserve saved proceedings across rename"
          git push origin HEAD:dev
