name: Finish Appeals Integration

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: finish-appeals-integration
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Patch existing moderation decision DM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/core/administration/mod/storage.js')
          text = path.read_text()
          old_intro = "async function sendCaseAppealNotice({ guild, target = null, user = null, caseId = null }) {\n"
          new_intro = "function getAppealsWebBaseUrl() {\n  const raw = String(process.env.CLIENT_URL || process.env.DASHBOARD_CLIENT_URL || process.env.VITE_CLIENT_URL || 'https://goliath.ksjdigital.co.uk').trim();\n  return raw.replace(/\\/+$/, '');\n}\nasync function sendCaseAppealNotice({ guild, target = null, user = null, caseId = null }) {\n"
          if old_intro not in text:
              raise SystemExit('sendCaseAppealNotice insertion point not found')
          text = text.replace(old_intro, new_intro, 1)

          old_field = "        { name: 'How to appeal', value: 'Use **Appeal This Case** below. You can appeal even if you are no longer in the server.\\n\\nIf the button is unavailable, open your DM with **Goliath** and use `/appeal`. A secure web appeal option will also be available in the future.', inline: false },"
          new_field = "        { name: 'How to appeal', value: 'Use **Appeal This Case** below, or choose **Appeal Online** to use the secure Goliath Appeals portal. You can appeal even if you are no longer in the server.\\n\\nIf the Discord button is unavailable, the web portal remains available.', inline: false },"
          if old_field not in text:
              raise SystemExit('appeal help field not found')
          text = text.replace(old_field, new_field, 1)

          old_send = "    await recipient.send({\n      embeds: [embed],\n      components: [new ActionRowBuilder().addComponents(\n        new ButtonBuilder().setCustomId(`mod_appeal_external:${guild.id}:${modCase.caseId}`).setLabel('Appeal This Case').setEmoji('⚖️').setStyle(ButtonStyle.Primary),\n        new ButtonBuilder().setCustomId('mod_appeal_lookup').setLabel('Appeal Another Case').setStyle(ButtonStyle.Secondary)\n      )],\n    });"
          new_send = "    const appealWebUrl = `${getAppealsWebBaseUrl()}/appeals?guild=${encodeURIComponent(guild.id)}&case=${encodeURIComponent(modCase.caseId)}`;\n    await recipient.send({\n      embeds: [embed],\n      components: [new ActionRowBuilder().addComponents(\n        new ButtonBuilder().setCustomId(`mod_appeal_external:${guild.id}:${modCase.caseId}`).setLabel('Appeal This Case').setEmoji('⚖️').setStyle(ButtonStyle.Primary),\n        new ButtonBuilder().setLabel('Appeal Online').setEmoji('🌐').setStyle(ButtonStyle.Link).setURL(appealWebUrl),\n        new ButtonBuilder().setCustomId('mod_appeal_lookup').setLabel('Appeal Another Case').setStyle(ButtonStyle.Secondary)\n      )],\n    });"
          if old_send not in text:
              raise SystemExit('appeal DM button block not found')
          text = text.replace(old_send, new_send, 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate appeals integration
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=moderate
          npm run doctor
          npm run build
          node --check src/core/administration/mod/command.js
          node --check src/core/administration/mod/storage.js
          node --check src/server/routes/auth.js
          grep -q "Appeal Online" src/core/administration/mod/storage.js
          grep -q "appeals?guild=" src/core/administration/mod/storage.js
          grep -q "source: 'web'" src/core/administration/mod/command.js
          grep -q "requireSameOrigin" src/core/administration/mod/command.js
          grep -q "WEB_APPEAL_MAX_SUBMITS" src/core/administration/mod/command.js
          git diff --check

      - name: Commit appeals integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/core/administration/mod/storage.js; then
            echo "No storage integration change required."
            exit 0
          fi
          git config user.name "Goliath Validation"
          git config user.email "goliath-validation@users.noreply.github.com"
          git add src/core/administration/mod/storage.js
          git commit -m "feat(appeals): link moderation DMs to web portal"
          git push origin HEAD:dev
