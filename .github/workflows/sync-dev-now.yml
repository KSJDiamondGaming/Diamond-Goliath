name: Sync DEV Now

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-dev-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger DEV deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-dev.yml/dispatches" \
            -d '{"ref":"dev","inputs":{"environment":"dev"}}'
          echo "DEV deployment dispatch requested."
