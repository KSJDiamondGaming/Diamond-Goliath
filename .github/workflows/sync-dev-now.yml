name: Legacy Terminology Audit

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/sync-dev-now.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify complete legacy terminology removal
        shell: bash
        run: |
          set -euo pipefail
          LEGACY="$(printf '\143\157\165\162\164')"

          echo 'Scanning tracked paths...'
          if git ls-files | grep -i "$LEGACY"; then
            echo 'Legacy terminology remains in a tracked path.' >&2
            exit 1
          fi

          echo 'Scanning all tracked text content...'
          if git grep -Iin "$LEGACY"; then
            echo 'Legacy terminology remains in tracked content.' >&2
            exit 1
          fi

          echo 'No legacy terminology found anywhere in tracked paths or text.'
          npm ci
          npm audit --audit-level=moderate
          npm run doctor
          npm run build
