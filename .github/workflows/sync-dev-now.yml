name: Dependency Hardening

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/sync-dev-now.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Audit and apply non-breaking lockfile remediation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --json > /tmp/audit-before.json || true
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/audit-before.json', 'utf8'));
          console.log('BEFORE', JSON.stringify(data.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(data.vulnerabilities || {})) {
            console.log(`VULN ${name} severity=${item.severity} direct=${Boolean(item.isDirect)} fix=${JSON.stringify(item.fixAvailable)}`);
          }
          NODE

          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci
          npm run doctor
          npm audit --json > /tmp/audit-after.json || true

          node - <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/audit-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('/tmp/audit-after.json', 'utf8'));
          const b = before.metadata?.vulnerabilities || {};
          const a = after.metadata?.vulnerabilities || {};
          const total = (x) => Number(x.total || 0);
          const highish = (x) => Number(x.high || 0) + Number(x.critical || 0);
          console.log('AFTER', JSON.stringify(a));
          for (const [name, item] of Object.entries(after.vulnerabilities || {})) {
            console.log(`REMAINING ${name} severity=${item.severity} direct=${Boolean(item.isDirect)} fix=${JSON.stringify(item.fixAvailable)}`);
          }
          if (total(a) > total(b) || highish(a) > highish(b)) {
            console.error('Safe remediation made the audit worse; refusing to commit.');
            process.exit(1);
          }
          console.log(`AUDIT_DELTA total ${total(b)} -> ${total(a)}, high+critical ${highish(b)} -> ${highish(a)}`);
          NODE

      - name: Commit validated safe dependency updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Goliath Dependency Hardening"
          git config user.email "goliath-dependency-hardening@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No safe lockfile remediation available."
            exit 0
          fi
          git commit -m "chore(deps): apply safe audit remediation"
          git push origin HEAD:dev
