name: Dependency Upgrade Validation

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/sync-dev-now.yml'

permissions:
  contents: write

jobs:
  validate-upgrades:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Select newest compatible dependency lines
        shell: bash
        run: |
          set -euo pipefail
          latest_line() {
            npm view "$1" version --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);console.log(Array.isArray(v)?v[v.length-1]:v)})"
          }
          export EXPRESS="$(latest_line 'express@4')"
          export DISCORD="$(latest_line 'discord.js@14')"
          export UNDICI="$(latest_line 'undici@6')"
          export SHARP="$(latest_line 'sharp@0.35')"
          echo "Selected express=$EXPRESS discord.js=$DISCORD undici=$UNDICI sharp=$SHARP"
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies.express = `^${process.env.EXPRESS}`;
          pkg.dependencies['discord.js'] = `^${process.env.DISCORD}`;
          pkg.dependencies.sharp = `^${process.env.SHARP}`;
          pkg.overrides = { ...(pkg.overrides || {}), undici: process.env.UNDICI };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Validate upgraded dependency set
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node - <<'NODE'
          const sharp = require('sharp');
          (async () => {
            const base = await sharp({ create: { width: 32, height: 32, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } })
              .png().resize(16, 16).toBuffer();
            const meta = await sharp(base).metadata();
            if (meta.width !== 16 || meta.height !== 16 || meta.format !== 'png') throw new Error('Sharp smoke test failed');
            console.log(`Sharp smoke test OK: ${meta.width}x${meta.height} ${meta.format}`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node -e "const d=require('discord.js'); if(!d.Client||!d.EmbedBuilder||!d.ActionRowBuilder) process.exit(1); console.log('discord.js smoke test OK')"
          node -e "const express=require('express'); const app=express(); app.get('/health',(req,res)=>res.json({ok:true})); if(typeof app.listen!=='function') process.exit(1); console.log('Express smoke test OK')"
          npm run doctor
          npm audit --json > /tmp/audit-final.json || true
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/audit-final.json', 'utf8'));
          const v = data.metadata?.vulnerabilities || {};
          console.log('FINAL_AUDIT', JSON.stringify(v));
          for (const [name, item] of Object.entries(data.vulnerabilities || {})) console.log(`REMAINING ${name} severity=${item.severity} fix=${JSON.stringify(item.fixAvailable)}`);
          if (Number(v.high || 0) || Number(v.critical || 0)) {
            console.error('High/critical vulnerabilities remain; refusing to commit this dependency set.');
            process.exit(1);
          }
          NODE

      - name: Commit validated dependency upgrades
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Goliath Dependency Hardening"
          git config user.email "goliath-dependency-hardening@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency manifest changes required."
            exit 0
          fi
          git commit -m "chore(deps): upgrade vulnerable runtime dependencies"
          git push origin HEAD:dev
