name: Case Court Consistency Hardening

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: case-court-consistency-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch existing Case Court implementation in place
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          def bounded(text, start, end, replacement, label, after=0):
              a = text.find(start, after)
              if a < 0:
                  raise SystemExit(f'{label}: start marker not found')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'{label}: end marker not found')
              return text[:a] + replacement + text[b:]

          cases_path = Path('src/core/administration/mod/cases.js')
          text = cases_path.read_text()

          marker = "function claimCourtAppealRemedyForApproval(interaction, modCase) {"
          helper = """function effectiveAppealAction(modCase = {}) {
            const directAction = String(modCase.action || '').trim().toLowerCase();
            if (directAction !== 'case') return directAction;
            const court = modCase?.metadata?.court && typeof modCase.metadata.court === 'object' ? modCase.metadata.court : null;
            return String(court?.sanctionExecution?.action || court?.decision?.action || directAction).trim().toLowerCase();
          }

          """
          if 'function effectiveAppealAction(' not in text:
              text = once(text, marker, helper + marker, 'effective appeal action helper')

          failure_start = 'function persistCourtAppealReversalFailure(interaction, modCase, error, operationId = null) {'
          failure_end = 'async function applyApprovedCourtAppealRemedy(interaction, modCase, fetchTarget) {'
          failure_func = """function persistCourtAppealReversalFailure(interaction, modCase, error, operationId = null) {
            const guildId = interaction.guild.id;
            const actorId = interaction.user?.id || null;
            const current = getCaseById(guildId, modCase.caseId) || modCase;
            const metadata = { ...(current.metadata || {}) };
            const court = metadata.court && typeof metadata.court === 'object' ? metadata.court : {};
            const execution = court.sanctionExecution && typeof court.sanctionExecution === 'object' ? court.sanctionExecution : null;
            const remedyAction = String(execution?.action || court.decision?.action || 'court');
            if (execution?.status === 'reversed') {
              const remedy = { attempted: false, action: remedyAction, ok: true, detail: 'The sanction is already reversed; a late failure result was ignored.' };
              recordCaseAudit({ guildId, caseId: modCase.caseId, actorId, event: 'case.court.appeal_remedy_failure_ignored', before: execution, after: execution, metadata: { operationId, reason: 'already_reversed' } });
              return { case: current, remedy, superseded: true };
            }
            if (operationId && execution?.reversalOperationId && execution.reversalOperationId !== operationId) {
              const remedy = { attempted: true, action: remedyAction, ok: false, detail: 'A newer reversal operation owns this case; the stale failure result was ignored.' };
              recordCaseAudit({ guildId, caseId: modCase.caseId, actorId, event: 'case.court.appeal_remedy_failure_ignored', before: execution, after: execution, metadata: { operationId, currentOperationId: execution.reversalOperationId, reason: 'superseded' } });
              return { case: current, remedy, superseded: true };
            }
            const remedy = { attempted: true, action: remedyAction, ok: false, detail: String(error?.message || error || 'Appeal remedy failed.').slice(0, 300) };
            metadata.court = {
              ...court,
              sanctionExecution: execution ? {
                ...execution,
                status: 'reversal_failed',
                reversalOperationId: operationId || execution.reversalOperationId || null,
                reversalAttemptedBy: actorId,
                reversalAttemptedAt: new Date().toISOString(),
                reversalRemedy: remedy,
              } : execution,
            };
            const updated = updateCaseMetadata(guildId, modCase.caseId, metadata) || current;
            recordCaseAudit({ guildId, caseId: modCase.caseId, actorId, event: 'case.court.appeal_remedy_failed', before: execution, after: metadata.court.sanctionExecution, metadata: { operationId, remedy } });
            return { case: updated, remedy };
          }

          """
          text = bounded(text, failure_start, failure_end, failure_func, 'reversal failure ownership')

          old = """async function applyApprovedCourtAppealRemedy(interaction, modCase, fetchTarget) {
            const guild = interaction.guild;
            const actorId = interaction.user?.id || null;
            const court = modCase.metadata?.court && typeof modCase.metadata.court === 'object' ? modCase.metadata.court : null;
            const execution = court?.sanctionExecution && typeof court.sanctionExecution === 'object' ? court.sanctionExecution : null;
          """
          new = """async function applyApprovedCourtAppealRemedy(interaction, modCase, fetchTarget) {
            const guild = interaction.guild;
            const actorId = interaction.user?.id || null;
            const currentStart = getCaseById(guild.id, modCase.caseId) || modCase;
            const court = currentStart.metadata?.court && typeof currentStart.metadata.court === 'object' ? currentStart.metadata.court : null;
            const execution = court?.sanctionExecution && typeof court.sanctionExecution === 'object' ? court.sanctionExecution : null;
          """
          text = once(text, old, new, 'refresh reversal state before remedy')

          noexec_start = "  if (!execution || execution.status === 'failed') {"
          noexec_end = "  const target = typeof fetchTarget === 'function' ? await fetchTarget(guild, modCase.userId) : null;"
          noexec = """  if (!execution || execution.status === 'failed') {
            remedy = { attempted: false, action, ok: true, detail: 'Appeal approved before any sanction was successfully executed; no physical undo was required.' };
            const current = getCaseById(guild.id, modCase.caseId) || currentStart;
            const metadata = { ...(current.metadata || {}) };
            const currentCourt = metadata.court && typeof metadata.court === 'object' ? metadata.court : court;
            const currentExecution = currentCourt?.sanctionExecution && typeof currentCourt.sanctionExecution === 'object' ? currentCourt.sanctionExecution : null;
            if (currentExecution?.status === 'executed') {
              const claim = claimCourtAppealRemedyForApproval(interaction, current);
              if (!claim.ok) return { attempted: false, action, ok: false, detail: claim.error || 'The sanction state changed while the appeal was being approved.' };
              return applyApprovedCourtAppealRemedy(interaction, claim.case || current, fetchTarget);
            }
            if (currentExecution && !['failed', 'reversed'].includes(currentExecution.status)) {
              return { attempted: false, action, ok: false, detail: `The sanction state changed to ${currentExecution.status}; no false reversal was recorded.` };
            }
            if (currentExecution?.status === 'reversed') return { attempted: false, action, ok: true, detail: 'The sanction was already reversed; no further physical undo was required.' };
            const reversedAt = new Date().toISOString();
            metadata.court = {
              ...currentCourt,
              sanctionExecution: {
                ...(currentExecution || execution || { action }),
                status: 'reversed',
                action,
                reversedBy: actorId,
                reversedAt,
                reversalAttemptedBy: actorId,
                reversalAttemptedAt: reversedAt,
                reversalReason: reason,
                reversalRemedy: remedy,
              },
              appealOutcome: { status: 'approved', reviewedBy: actorId, reviewedAt: reversedAt, remedy },
            };
            updateCaseMetadata(guild.id, modCase.caseId, metadata);
            updateCaseStatus(guild.id, modCase.caseId, 'reversed', actorId);
            recordCaseAudit({ guildId: guild.id, caseId: modCase.caseId, actorId, event: 'case.court.appeal_remedy_applied', before: currentExecution || execution, after: metadata.court.sanctionExecution, metadata: { linkedCaseId, remedy } });
            return remedy;
          }

          """
          text = bounded(text, noexec_start, noexec_end, noexec, 'no-execution race protection')

          final_start = '  const current = getCaseById(guild.id, modCase.caseId) || modCase;'
          final_end = '\n  return remedy;\n}\n\nasync function applyApprovedAppealRemedy'
          final_block = """  const current = getCaseById(guild.id, modCase.caseId) || currentStart;
            const metadata = { ...(current.metadata || {}) };
            const currentCourt = metadata.court && typeof metadata.court === 'object' ? metadata.court : court;
            const currentExecution = currentCourt?.sanctionExecution && typeof currentCourt.sanctionExecution === 'object' ? currentCourt.sanctionExecution : null;
            const expectedOperationId = execution?.reversalOperationId || null;
            if (currentExecution?.status === 'reversed') {
              return { ...remedy, ok: true, detail: reversalSucceeded ? remedy.detail : 'The sanction is already reversed; a stale failure result was ignored.' };
            }
            if (expectedOperationId && currentExecution?.reversalOperationId && currentExecution.reversalOperationId !== expectedOperationId) {
              const supersededRemedy = { ...remedy, ok: false, detail: `${String(remedy.detail || 'Appeal remedy completed.').slice(0, 220)} A newer reversal operation owns the case, so this stale result was not persisted.` };
              recordCaseAudit({ guildId: guild.id, caseId: modCase.caseId, actorId, event: 'case.court.appeal_remedy_result_ignored', before: execution, after: currentExecution, metadata: { linkedCaseId, expectedOperationId, currentOperationId: currentExecution.reversalOperationId } });
              return supersededRemedy;
            }
            metadata.court = {
              ...currentCourt,
              sanctionExecution: currentExecution ? {
                ...currentExecution,
                status: reversalSucceeded ? 'reversed' : 'reversal_failed',
                reversedBy: reversalSucceeded ? actorId : null,
                reversedAt: reversalSucceeded ? new Date().toISOString() : null,
                reversalAttemptedBy: actorId,
                reversalAttemptedAt: new Date().toISOString(),
                reversalReason: reason,
                reversalRemedy: remedy,
              } : currentExecution,
              appealOutcome: {
                status: 'approved',
                reviewedBy: actorId,
                reviewedAt: new Date().toISOString(),
                remedy,
              },
            };
            updateCaseMetadata(guild.id, modCase.caseId, metadata);
            if (reversalSucceeded) updateCaseStatus(guild.id, modCase.caseId, 'reversed', actorId);
            recordCaseAudit({ guildId: guild.id, caseId: modCase.caseId, actorId, event: reversalSucceeded ? 'case.court.appeal_remedy_applied' : 'case.court.appeal_remedy_failed', before: currentExecution || execution, after: metadata.court.sanctionExecution, metadata: { linkedCaseId, remedy, operationId: expectedOperationId } });
          """
          pos = text.find(noexec_end)
          a = text.find(final_start, pos)
          b = text.find(final_end, a)
          if pos < 0 or a < 0 or b < 0:
              raise SystemExit('fresh reversal finalization: block markers not found')
          text = text[:a] + final_block + text[b:]

          text = once(text,
              "  if (appeal.status === 'approved' && ['ban', 'kick'].includes(modCase.action) && appeal.remedy?.ok) invite = await createRejoinInvite(interaction.guild, modCase.caseId);",
              "  if (appeal.status === 'approved' && ['ban', 'kick'].includes(effectiveAppealAction(modCase)) && appeal.remedy?.ok === true) invite = await createRejoinInvite(interaction.guild, modCase.caseId);",
              'Court rejoin invite action')

          retry_fn = text.find('async function retryApprovedCourtAppealRemedy(')
          retry_start = "    } catch (error) {\n      remedy = { attempted: true, action: String(claimedExecution.action"
          retry_end = '\n\n    modCase = getCaseById(guildId, caseId) || claimed;'
          a = text.find(retry_start, retry_fn)
          b = text.find(retry_end, a)
          if retry_fn < 0 or a < 0 or b < 0:
              raise SystemExit('retry failure ownership: block markers not found')
          retry_new = """    } catch (error) {
              const failed = persistCourtAppealReversalFailure(interaction, claimed, error, operationId);
              remedy = failed.remedy;
              recordCaseAudit({ guildId, caseId, actorId, event: 'case.court.appeal_remedy_retry_failed', before: claimedExecution, after: remedy, metadata: { appealId, operationId, superseded: Boolean(failed.superseded) } });
            }
          """
          text = text[:a] + retry_new + text[b:]

          history_fn = text.find('function buildAppealHistoryEmbed(')
          history_start = '  const components = [new ActionRowBuilder().addComponents('
          history_end = '\n  return { embeds: [embed], components };\n}\nfunction buildAppealDetailPayload'
          a = text.find(history_start, history_fn)
          b = text.find(history_end, a)
          if history_fn < 0 or a < 0 or b < 0:
              raise SystemExit('appeal history Back row: block markers not found')
          history_new = """  const components = [
            new ActionRowBuilder().addComponents(
              new ButtonBuilder().setCustomId(`mod_case_appeal_history:${modCase.caseId}:${Math.max(0, page - 1)}`).setLabel('◀ Previous').setStyle(ButtonStyle.Secondary).setDisabled(page <= 0),
              new ButtonBuilder().setCustomId(`mod_case_appeal_history:${modCase.caseId}:${Math.min(totalPages - 1, page + 1)}`).setLabel('Next ▶').setStyle(ButtonStyle.Secondary).setDisabled(page >= totalPages - 1),
              new ButtonBuilder().setCustomId(`mod_case_appeal_open:${modCase.caseId}:${pending?.id || 'none'}`).setLabel('Open Pending').setStyle(ButtonStyle.Primary).setDisabled(!pending)
            ),
            new ActionRowBuilder().addComponents(
              new ButtonBuilder().setCustomId(`mod_search_open:${modCase.caseId}`).setLabel('⬅️ Back').setStyle(ButtonStyle.Secondary)
            ),
          ];
          """
          text = text[:a] + history_new + text[b:]

          detail_fn = text.find('function buildAppealDetailPayload(')
          detail_start = '  const components = [new ActionRowBuilder().addComponents('
          detail_end = '\n  return { embeds: [embed], components };\n}\nfunction buildAppealQueuePayload'
          a = text.find(detail_start, detail_fn)
          b = text.find(detail_end, a)
          if detail_fn < 0 or a < 0 or b < 0:
              raise SystemExit('appeal detail Back row: block markers not found')
          detail_new = """  const components = [
            new ActionRowBuilder().addComponents(
              new ButtonBuilder().setCustomId(`mod_case_appeal_decide:${modCase.caseId}:${appeal.id}:approved`).setLabel('✅ Approve').setStyle(ButtonStyle.Success).setDisabled(appeal.status !== 'pending'),
              new ButtonBuilder().setCustomId(`mod_case_appeal_decide:${modCase.caseId}:${appeal.id}:denied`).setLabel('❌ Deny').setStyle(ButtonStyle.Danger).setDisabled(appeal.status !== 'pending'),
              new ButtonBuilder().setCustomId(`mod_case_appeal_retry_remedy:${modCase.caseId}:${appeal.id}`).setLabel(courtExecution?.status === 'reversing' && !appealRemedyIsStale(courtExecution) ? '⏳ Remedy Running' : '🔁 Retry Remedy').setStyle(ButtonStyle.Primary).setDisabled(!canRetryRemedy)
            ),
            new ActionRowBuilder().addComponents(
              new ButtonBuilder().setCustomId(`mod_search_open:${modCase.caseId}`).setLabel('Case Detail').setStyle(ButtonStyle.Secondary)
            ),
            new ActionRowBuilder().addComponents(
              new ButtonBuilder().setCustomId(`mod_case_appeal_history:${modCase.caseId}:0`).setLabel('⬅️ Back').setStyle(ButtonStyle.Secondary)
            ),
          ];
          """
          text = text[:a] + detail_new + text[b:]

          queue_old = """  rows.push(new ActionRowBuilder().addComponents(
            new ButtonBuilder().setCustomId('mod_dashboard:none:analytics').setLabel('⬅️ Back').setStyle(ButtonStyle.Secondary),
            new ButtonBuilder().setCustomId(`mod_case_appeal_queue_refresh:${activeToken}:${page}`).setLabel('🔄 Refresh').setStyle(ButtonStyle.Secondary),
            new ButtonBuilder().setCustomId(`mod_case_appeal_queue_filter:${activeToken}`).setLabel('🔎 Filter').setStyle(ButtonStyle.Secondary)
          ));
          """
          queue_new = """  rows.push(new ActionRowBuilder().addComponents(
            new ButtonBuilder().setCustomId(`mod_case_appeal_queue_refresh:${activeToken}:${page}`).setLabel('🔄 Refresh').setStyle(ButtonStyle.Secondary),
            new ButtonBuilder().setCustomId(`mod_case_appeal_queue_filter:${activeToken}`).setLabel('🔎 Filter').setStyle(ButtonStyle.Secondary)
          ));
          rows.push(new ActionRowBuilder().addComponents(
            new ButtonBuilder().setCustomId('mod_dashboard:none:analytics').setLabel('⬅️ Back').setStyle(ButtonStyle.Secondary)
          ));
          """
          text = once(text, queue_old, queue_new, 'appeal queue Back row')
          cases_path.write_text(text)

          court_path = Path('src/core/administration/mod/caseCourt.js')
          text = court_path.read_text()
          nav_start = 'function caseManagementNavigationRow(interaction, targetId) {'
          nav_end = 'function auditRows(guildId, caseId, limit = 25) {'
          nav_new = """function caseManagementNavigationRow(interaction, targetId) {
            return row(button(`mod_dashboard:${targetId}:actions`, 'Back', '⬅️'));
          }
          function caseFileBackRow(caseId) { return row(button(`mod_court_file:${caseId}`, 'Back', '⬅️')); }
          function canDeleteCourt(interaction) { return canUseModAction(interaction.member, interaction.guild, 'court_delete', interaction); }
          function caseFileNavigationRow(interaction, modCase) {
            return row(button(`mod_court_back:${modCase.userId}`, 'Back', '⬅️'));
          }
          """
          text = bounded(text, nav_start, nav_end, nav_new, 'Court Back-only navigation helpers')

          dash_old = """    components.push(row(
              button(`mod_court_new:${target.id}`, 'New Case', '➕', ButtonStyle.Primary, !canManageCourt(interaction)),
              button(`mod_court_review_queue:${target.id}`, 'Review Queue', '⚖️'),
              button(`mod_court_published:${target.id}`, 'Published', '📜'),
            ));
            components.push(caseManagementNavigationRow(interaction, target.id));
          """
          dash_new = """    const dashboardActions = [
              button(`mod_court_new:${target.id}`, 'New Case', '➕', ButtonStyle.Primary, !canManageCourt(interaction)),
              button(`mod_court_review_queue:${target.id}`, 'Review Queue', '⚖️'),
              button(`mod_court_published:${target.id}`, 'Published', '📜'),
            ];
            if (canUseModAction(interaction.member, interaction.guild, 'export_cases', interaction)) dashboardActions.push(button(`mod_export_cases:${target.id}`, 'Export', '📤'));
            components.push(row(...dashboardActions));
            components.push(caseManagementNavigationRow(interaction, target.id));
          """
          text = once(text, dash_old, dash_new, 'Court dashboard action separation')

          controls_old = """  controlButtons.push(button('mod_case_appeal_queue:0', 'Appeals', '📥'));
            controlButtons.push(button(isClosed ? `mod_court_reopen:${modCase.caseId}` : `mod_court_close:${modCase.caseId}`, isClosed ? 'Reopen' : 'Close', isClosed ? '🔓' : '🔒', ButtonStyle.Secondary, !canCloseCourt(interaction)));
          """
          controls_new = """  controlButtons.push(button('mod_case_appeal_queue:0', 'Appeals', '📥'));
            if (canDeleteCourt(interaction)) controlButtons.push(button(`mod_court_delete:${modCase.caseId}`, 'Delete Case', '🗑️', ButtonStyle.Danger));
            controlButtons.push(button(isClosed ? `mod_court_reopen:${modCase.caseId}` : `mod_court_close:${modCase.caseId}`, isClosed ? 'Reopen' : 'Close', isClosed ? '🔓' : '🔒', ButtonStyle.Secondary, !canCloseCourt(interaction)));
          """
          text = once(text, controls_old, controls_new, 'Court file action separation')
          court_path.write_text(text)
          PY

      - name: Validate changed source
        shell: bash
        run: |
          set -euo pipefail
          node --check src/core/administration/mod/cases.js
          node --check src/core/administration/mod/caseCourt.js
          npm ci
          npm run doctor

      - name: Commit source fixes and restore permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Goliath Actions"
          git config user.email "actions@users.noreply.github.com"
          git show 7682feb6e249a7e5300aecb4a7c2d289aa883695:.github/workflows/sync-dev-now.yml > .github/workflows/sync-dev-now.yml
          git add src/core/administration/mod/cases.js src/core/administration/mod/caseCourt.js .github/workflows/sync-dev-now.yml
          git diff --cached --check
          git commit -m "fix(mod): complete Case Court consistency hardening"
          git push origin HEAD:dev
