name: Finish command migration

on:
  push:
    paths:
      - '.github/workflows/finish-command-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - name: Migrate User utilities and remove legacy command shims
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/core/systems/user/interactions.js')
          source = path.read_text()

          old_imports = """const pingCommand = require('../../../commands/utility/ping');
          const helpCommand = require('../../../commands/utility/help');
          const serverInfoCommand = require('../../../commands/utility/serverinfo');
          const translateCommand = require('../../../commands/utility/translate');"""
          new_import = "const userUtilities = require('./utilities');"
          if old_imports not in source:
              raise SystemExit('Legacy utility import block not found')
          source = source.replace(old_imports, new_import, 1)

          replacements = {
              'executeUtilityCommand(interaction, pingCommand)': 'executeUtilityCommand(interaction, userUtilities.adapters.ping)',
              'executeUtilityCommand(interaction, helpCommand)': 'executeUtilityCommand(interaction, userUtilities.adapters.help)',
              'executeUtilityCommand(interaction, serverInfoCommand)': 'executeUtilityCommand(interaction, userUtilities.adapters.serverinfo)',
              'executeUtilityCommand(interaction, translateCommand)': 'executeUtilityCommand(interaction, userUtilities.adapters.translate)',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Expected utility call not found: {old}')
              source = source.replace(old, new)

          guild_guard = """  if (!interaction.guild) {
            await interaction.reply({ content: 'This panel can only be used inside a server.', flags: 64 });
            return true;
          }
          """
          submit_route = guild_guard + "\n  if (customId === 'user:utility:translate:submit' && interaction.isModalSubmit?.()) return userUtilities.submitTranslate(interaction);\n"
          if guild_guard not in source:
              raise SystemExit('User guild guard not found')
          source = source.replace(guild_guard, submit_route, 1)
          path.write_text(source)
          PY

          rm -f \
            src/commands/utility/help.js \
            src/commands/utility/ping.js \
            src/commands/utility/serverinfo.js \
            src/commands/utility/translate.js

          git rm .github/workflows/finish-command-migration.yml
          git config user.name "Goliath Migration"
          git config user.email "goliath-migration@users.noreply.github.com"
          git add src/core/systems/user/interactions.js src/commands || true
          git diff --cached --check
          git commit -m "remove final legacy command shims"
          git push origin HEAD:dev
