name: One-time verification core cleanup

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/one-time-verification-core-cleanup.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Migrate verification imports and remove final guild bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/modules/verification/verificationPanel.js'): {
                  "require('../../../core/guild/guildManager')": "require('../../core/guild/guildManager')",
              },
              Path('src/modules/verification/verificationManager.js'): {
                  "require('../../../core/guild/guildManager')": "require('../../core/guild/guildManager')",
                  "require('../../../core/dev/testDevOverrideManager')": "require('../../core/dev/testDevOverrideManager')",
                  "require('../../../core/security/securityCore')": "require('../../core/security/securityCore')",
              },
          }

          for path, mapping in replacements.items():
              content = path.read_text(encoding='utf-8-sig')
              for old, new in mapping.items():
                  if old not in content:
                      raise SystemExit(f'Missing expected import in {path}: {old}')
                  content = content.replace(old, new)
              path.write_text(content, encoding='utf-8', newline='')

          bridge = Path('core/guild/guildManager.js')
          if bridge.exists():
              bridge.unlink()

          workflow = Path('.github/workflows/one-time-verification-core-cleanup.yml')
          workflow.unlink()
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "Goliath Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Migrate verification to canonical core and remove guild bridge"
          git push origin HEAD:dev
