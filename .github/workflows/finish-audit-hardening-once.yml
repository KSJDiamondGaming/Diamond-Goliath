name: Finish audit hardening once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/finish-audit-hardening-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove routing-field mutation dependency
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def read(path): return (root / path).read_text(encoding='utf-8')
          def write(path, text): (root / path).write_text(text, encoding='utf-8')

          user_path = 'src/modules/socialStudio/socialAlerts/socialStudioUserChannelRouting.js'
          user = read(user_path)
          if "require('./socialStudioRoutingResolver')" not in user:
              user = user.replace(
                  "const { ALERT_TYPES } = require('./socialStudioTemplates');",
                  "const { ALERT_TYPES } = require('./socialStudioTemplates');\nconst { resolveSocialRoute } = require('./socialStudioRoutingResolver');",
                  1,
              )

          user, n = re.subn(
              r"function syncUser\(config, userId\) \{.*?\n\}",
              """function syncUser(config, userId) {
  // Routing is resolved dynamically. This compatibility hook only removes
  // account mutations written by older builds so saved account routes remain
  // the account's explicit baseline instead of inherited user routing.
  for (const accountId of creatorAccountsForUser(config, userId)) {
    const account = config.accounts?.[accountId];
    if (account) clearRoutesFromAccount(account);
  }
}""",
              user,
              count=1,
              flags=re.S,
          )
          if n != 1: raise SystemExit('syncUser block not found')

          start = user.find('function effectiveRoute(')
          end = user.find('\nfunction payload(', start)
          if start < 0 or end < 0: raise SystemExit('effective preview block not found')
          user = user[:start] + """function effectivePreview(config, userId) {
  const accounts = creatorAccountsForUser(config, userId)
    .map((accountId) => config.accounts?.[accountId])
    .filter(Boolean);
  const samples = accounts.length ? accounts : [{ discordUserId: userId, platform: '' }];

  return ALERT_TYPES.map((type) => {
    const resolved = samples.map((account) => resolveSocialRoute(config, account, type));
    const unique = new Map(resolved.map((item) => [`${item.channelId || ''}:${item.source}`, item]));
    if (unique.size === 1) {
      const item = [...unique.values()][0];
      const destination = item.channelId ? `<#${item.channelId}>` : 'Not configured';
      return `${TYPE_EMOJI[type] || '🔔'} **${TYPE_LABELS[type] || type}** → ${destination} *(${item.source})*`;
    }
    const details = resolved.map((item, index) => {
      const platform = String(samples[index]?.platform || 'account').toUpperCase();
      return `${platform}: ${item.channelId ? `<#${item.channelId}>` : 'Not configured'} (${item.source})`;
    }).join(' • ');
    return `${TYPE_EMOJI[type] || '🔔'} **${TYPE_LABELS[type] || type}** → *varies by platform* — ${details}`;
  }).join('\n');
}
""" + user[end:]
          user = user.replace(
              '**Fallback:** User content route → User All Content → Server Platform Override → Server Dedicated route → Server Default channel.',
              '**Fallback:** Creator Platform → User Content → User All Content → Creator → Account → Server Platform → Server Dedicated → Server Default.',
          )
          user = user.replace('effectivePreview(config, routes, s.targetUserId)', 'effectivePreview(config, s.targetUserId)')
          write(user_path, user)

          creator_path = 'src/modules/socialStudio/socialAlerts/socialStudioCreatorRoutingCompat.js'
          creator = read(creator_path)
          creator, n = re.subn(
              r"function syncCreatorOverride\(config, creator\) \{.*?\n\}",
              """function syncCreatorOverride(config, creator) {
  if (!creator) return config;
  // Creator routing is resolved dynamically by socialStudioRoutingResolver.
  // Clear inherited account mutations from older builds; do not write creator
  // destinations into account.alertChannelId / account.alertChannels.
  for (const accountId of creator.accountIds || []) {
    const account = config.accounts?.[accountId];
    if (account) clearCreatorOverrideFromAccount(account);
  }
  return config;
}""",
              creator,
              count=1,
              flags=re.S,
          )
          if n != 1: raise SystemExit('syncCreatorOverride block not found')
          write(creator_path, creator)

          test_path = 'test/auditRegression.test.js'
          test = read(test_path)
          addition = r'''

test('Social Studio uses one dynamic resolver instead of inherited account route mutations', () => {
  const resolver = read('src/modules/socialStudio/socialAlerts/socialStudioRoutingResolver.js');
  const monitor = read('src/modules/socialStudio/socialAlerts/socialStudioMonitor.js');
  const user = read('src/modules/socialStudio/socialAlerts/socialStudioUserChannelRouting.js');
  const creator = read('src/modules/socialStudio/socialAlerts/socialStudioCreatorRoutingCompat.js');

  assert.match(monitor, /projectEffectiveAccounts/);
  assert.match(user, /resolveSocialRoute/);
  assert.doesNotMatch(user.slice(user.indexOf('function syncUser('), user.indexOf('function routeSummary(')), /applyRoutesToAccount/);
  assert.doesNotMatch(creator.slice(creator.indexOf('function syncCreatorOverride('), creator.indexOf('function syncAllCreatorOverrides(')), /applyCreatorOverrideToAccount/);
  assert.match(resolver, /Creator Platform Override/);
  assert.match(resolver, /User Content Override/);
  assert.match(resolver, /User All Content/);
  assert.match(resolver, /Creator Override/);
  assert.match(resolver, /Server Platform Override/);
  assert.match(resolver, /Server Dedicated/);
  assert.match(resolver, /Server Default/);
});

test('Command Center configuration and private command cleanup are scoped dynamically', () => {
  const auditStore = read('src/owner/auditIntelligence/auditStore.js');
  const sync = read('src/core/commandRegistry/syncCommands.js');
  assert.match(auditStore, /persistGuildId/);
  assert.match(auditStore, /COMMAND_CENTER_GUILD_ID/);
  assert.match(sync, /cleanupCommandCenterScope/);
  assert.match(sync, /Removed stale private \/commandcenter from non-Command-Center guild/);
});
'''
          if 'uses one dynamic resolver instead of inherited account route mutations' not in test:
              test += addition
          write(test_path, test)
          PY

          npm test
          npm run doctor
          npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/socialStudio/socialAlerts/socialStudioUserChannelRouting.js \
                  src/modules/socialStudio/socialAlerts/socialStudioCreatorRoutingCompat.js \
                  test/auditRegression.test.js
          if ! git diff --cached --quiet; then
            git commit -m "refactor(social): make routing resolver authoritative"
            git push origin dev
          fi

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin dev
          git rm .github/workflows/finish-audit-hardening-once.yml
          git commit -m "chore(ci): remove final audit hardening runner"
          git push origin dev
