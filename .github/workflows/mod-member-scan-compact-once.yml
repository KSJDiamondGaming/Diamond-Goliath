name: Apply Compact Member Scan Once
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/mod-member-scan-compact-once.yml'
      - 'scripts/mod-member-scan-compact-temp.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply compact Member Intelligence Scan
        run: node scripts/mod-member-scan-compact-temp.js
      - name: Remove temporary patch files
        run: rm -f scripts/mod-member-scan-compact-temp.js .github/workflows/mod-member-scan-compact-once.yml
      - name: Validate source
        run: npm run doctor
      - name: Commit clean source to dev
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(mod): compact member intelligence scan' || exit 0
          git push origin HEAD:dev
