name: Apply History Compare Cleanup

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/mod-history-compare-cleanup-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply source patch
        run: node scripts/mod-history-compare-cleanup-temp.js
      - name: Remove temporary script
        run: rm -f scripts/mod-history-compare-cleanup-temp.js
      - name: Validate source
        run: |
          node --check src/core/administration/mod/interactions.js
          npm run doctor
          npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/core/administration/mod/interactions.js scripts/mod-history-compare-cleanup-temp.js
          git commit -m 'refactor(mod): keep compare inside scan history'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
      - name: Remove helper workflow
        run: |
          set -euo pipefail
          git fetch origin dev
          git checkout -B dev origin/dev
          git rm -f .github/workflows/mod-history-compare-cleanup-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(mod): remove history compare cleanup workflow'
          git push origin HEAD:dev
