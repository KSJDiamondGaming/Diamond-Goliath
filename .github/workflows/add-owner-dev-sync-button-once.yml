name: Add Owner DEV Sync Button Once

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/add-owner-dev-sync-button-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Apply owner DEV sync button patch
        run: node scripts/add-owner-dev-sync-button-once.js
      - name: Remove one-off patcher before validation
        run: |
          rm -f scripts/add-owner-dev-sync-button-once.js
          rm -f .github/workflows/add-owner-dev-sync-button-once.yml
      - name: Validate
        run: |
          node --check src/owner/command.js
          npm run doctor
      - name: Commit patch
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m 'feat(owner): add DEV sync control'
          git push origin HEAD:dev
