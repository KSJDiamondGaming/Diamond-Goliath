name: Case Court Phase 13 Once
on:
  push:
    branches: [dev]
    paths:
      - '.github/case-court-phase13.py'
      - '.github/workflows/case-court-phase13-once.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Apply appeal remedy consistency
        run: python3 .github/case-court-phase13.py
      - name: Validate source
        run: node --check src/core/administration/mod/cases.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: node -e "require('./src/core/administration/mod/cases')"
      - name: Remove one-off files before Doctor
        run: rm -f .github/case-court-phase13.py .github/workflows/case-court-phase13-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit appeal remedy consistency
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(mod): keep failed appeal remedies active'
          git push origin dev
