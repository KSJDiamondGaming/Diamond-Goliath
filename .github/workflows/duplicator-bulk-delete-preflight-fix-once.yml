name: Duplicator Bulk Delete Preflight Fix Once
on:
  push:
    branches: [dev]
    paths:
      - '.github/duplicator-bulk-delete-preflight-fix.py'
      - '.github/workflows/duplicator-bulk-delete-preflight-fix-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Apply Duplicator bulk-delete preflight fix
        run: python3 .github/duplicator-bulk-delete-preflight-fix.py
      - name: Syntax check Duplicator modules
        run: |
          node --check src/owner/dev/duplicator/selective.js
          node --check src/owner/dev/duplicator/history.js
          node --check src/owner/dev/duplicator/index.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: node -e "require('./src/owner/dev/duplicator')"
      - name: Remove one-off files before Doctor
        run: rm -f .github/duplicator-bulk-delete-preflight-fix.py .github/workflows/duplicator-bulk-delete-preflight-fix-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(duplicator): let admin rescue reach bulk delete preflight'
          git push origin dev
