name: Patch Duplicator Dry Run Once

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/patch-duplicator-dryrun-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply patch
        run: node scripts/patch-duplicator-dryrun-once.js
      - name: Validate syntax
        run: node --check src/owner/dev/duplicatorV2.js
      - name: Commit patch
        run: |
          git config user.name 'KSJ Hub'
          git config user.email 'sycomorgan@gmail.com'
          git add src/owner/dev/duplicatorV2.js
          git commit -m 'Fix duplicator dry-run planning and permission preflight'
          git push origin HEAD:dev
