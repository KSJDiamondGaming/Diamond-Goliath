name: Patch Emoji DNS Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-emoji-dns-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Apply compatibility patch
        run: node scripts/patch-emoji-pinned-agent.js

      - name: Validate patched source
        run: node --check src/modules/utilityStudio/emojis/emojisApi.js

      - name: Remove one-off files before Doctor
        run: |
          git rm -f .github/workflows/patch-emoji-dns-once.yml scripts/patch-emoji-pinned-agent.js

      - name: Run Doctor and dashboard build
        run: |
          npm run doctor
          npm run build --if-present

      - name: Commit clean DNS repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/utilityStudio/emojis/emojisApi.js
          git diff --cached --check
          git commit -m 'fix(emojis): support Node all-mode pinned DNS lookup'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
