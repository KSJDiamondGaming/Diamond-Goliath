name: Polish Member Intelligence V6 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/polish-member-intelligence-v6-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rewrite Member Intelligence presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/core/administration/mod/intelligence.js')
          text = path.read_text()

          def replace_range(start_marker, end_marker, replacement, label):
              global text
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label} start marker not found')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{label} end marker not found')
              text = text[:start] + replacement + text[end:]

          header = "  const investigationWatch = report.investigation?.watched ? 'On' : 'Off';\n\n  report.embed\n    .setTitle(`🧠 Member Intelligence • ${target.user.tag}`)\n    .setDescription([\n      `**Target:** ${target.user} • ID **${target.id}**`,\n      'Evidence-led member overview for authorised management. Key intelligence and investigation state are summarised below.',\n    ].join('\\n\\n'))\n    .setFooter({ text: `Scanned by ${interaction.user?.tag || interaction.user?.username || interaction.user?.id || 'Unknown'} • Evidence-based intelligence` });"
          replace_range("  const investigationWatch = report.investigation?.watched ? 'ON' : 'OFF';", "\n\n  const riskLines = [", header, 'header')

          if "    riskLines.push('Risk factors **No verified risk factors**');" not in text:
              raise SystemExit('risk fallback not found')
          text = text.replace("    riskLines.push('Risk factors **No verified risk factors**');", "    riskLines.push('**No verified risk factors**');", 1)

          identity = "  const previousIdentityValues = [...knownIdentityValues].filter((value) => !currentIdentityValues.has(value));\n  const identityChanges = (Array.isArray(identity.events) ? identity.events : []).filter((event) => {\n    if (event.event === 'user.identity.update') return true;\n    if (event.event !== 'member.update' && event.event !== 'member.scan.observed') return false;\n    const before = json(event.before_value, {});\n    const after = json(event.after_value, {});\n    const hasBeforeIdentity = before.username || before.globalName || before.displayName;\n    const hasAfterIdentity = after.username || after.globalName || after.displayName;\n    if (!hasBeforeIdentity || !hasAfterIdentity) return false;\n    return before.username !== after.username || before.globalName !== after.globalName || before.displayName !== after.displayName;\n  });\n  const identityChangeCount = Math.max(previousIdentityValues.length, identityChanges.length);\n  const latestIdentityChange = identityChanges[0]?.created_at || null;\n  const identityStatus = identityChangeCount\n    ? `**${identityChangeCount} change${identityChangeCount === 1 ? '' : 's'}**${latestIdentityChange ? ` • Last ${discordTime(latestIdentityChange, 'R')}` : ''}`\n    : '**No recorded changes**';"
          replace_range("  const previousIdentityValues = [...knownIdentityValues].filter((value) => !currentIdentityValues.has(value));", "\n\n  setOrReplaceField(report.embed, '👤 Member'", identity, 'identity')
          text = text.replace("    `Identity ${identityStatus}`,", "    `Identity: ${identityStatus}`,", 1)
          text = text.replace("      ? `Latest **#${latestCase.caseId}", "      ? `Latest: **#${latestCase.caseId}", 1)
          text = text.replace("      : 'Latest **No recorded moderation cases**',", "      : 'Latest: **No recorded moderation cases**',", 1)

          investigation = "  const investigationLines = [\n    `Watch **${report.investigation?.watched ? '🟢' : '⚪'} ${investigationWatch}** • Notes **${report.investigation?.notes?.length || 0}**`,\n    `Evidence **${report.persistentLinks?.length || 0}** • Verified Links **${context.confirmedLinks?.length || 0}**`,\n  ];\n"
          replace_range("  const investigationLines = [", "  if (report.suspects?.length)", investigation, 'investigation')

          network = "  const behaviourTrend = String(behavior.trend || 'stable').toLowerCase();\n  const behaviourLabel = behaviourTrend ? `${behaviourTrend.charAt(0).toUpperCase()}${behaviourTrend.slice(1)}` : 'Stable';\n  const behaviourIcon = behaviourTrend === 'increasing' ? '🟠' : '🟢';\n  const externalCount = Number(reputation.verifiedExternal || 0) + Number(reputation.submitted || 0) + Number(reputation.unverified || 0);\n  const networkLines = [\n    `Guilds **${history.length} observed • ${currentGuilds} current • ${formerGuilds} former**`,\n    `Cross-guild Cases **${context.network?.caseCount || 0}** • External Records **${externalCount}**`,\n  ];\n  if (externalCount > 0) {\n    networkLines.push(`External **${reputation.verifiedExternal || 0} verified • ${reputation.submitted || 0} submitted • ${reputation.unverified || 0} unverified**`);\n  }\n  networkLines.push(`Behaviour **${behaviourIcon} ${behaviourLabel} • ${behavior.windows?.d30?.total || 0} cases / 30d**`);\n  setOrReplaceField(report.embed, '🌐 Network & Behaviour', networkLines.join('\\n'));"
          replace_range("  const behaviourTrend = String(behavior.trend || 'stable').toLowerCase();", "\n\n  const components = [", network, 'network')

          text = text.replace("    .setLabel(report.investigation?.watched ? 'Investigation Watch: ON' : 'Investigation Watch: OFF')", "    .setLabel(report.investigation?.watched ? 'Watch: On' : 'Watch: Off')", 1)

          path.write_text(text)
          PY

      - name: Validate rewritten source
        run: |
          node --check src/core/administration/mod/intelligence.js
          npm run contracts

      - name: Remove one-off workflows before Doctor
        run: |
          git rm -f .github/workflows/polish-member-intelligence-once.yml
          git rm -f .github/workflows/polish-member-intelligence-v3-once.yml
          git rm -f .github/workflows/polish-member-intelligence-v4-once.yml
          git rm -f .github/workflows/polish-member-intelligence-v5-once.yml
          git rm -f .github/workflows/polish-member-intelligence-v6-once.yml

      - name: Run Doctor
        run: npm run doctor

      - name: Commit polished workspace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(mod): polish member intelligence presentation'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
