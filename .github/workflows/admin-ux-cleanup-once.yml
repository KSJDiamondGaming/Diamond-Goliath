name: Apply Admin UX Cleanup

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/admin-ux-cleanup-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply cleanup
        run: python scripts/admin-ux-cleanup-temp.py
      - name: Verify syntax
        run: |
          node -c src/core/administration/admin/panel.js
          node -c src/core/administration/admin/modules.js
          node -c src/core/administration/mod/panel.js
          npm run syntax
      - name: Commit cleanup
        run: |
          rm .github/workflows/admin-ux-cleanup-once.yml
          rm scripts/admin-ux-cleanup-temp.py
          git config user.name "KSJ Hub"
          git config user.email "sycomorgan@gmail.com"
          git add src/core/administration/admin/panel.js src/core/administration/admin/modules.js src/core/administration/mod/panel.js .github/workflows/admin-ux-cleanup-once.yml scripts/admin-ux-cleanup-temp.py
          git commit -m "refactor(admin): simplify administration and moderation navigation"
          git push origin dev
