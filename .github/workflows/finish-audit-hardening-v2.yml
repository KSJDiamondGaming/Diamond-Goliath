name: Finish audit hardening v2

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/finish-audit-hardening-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply final routing hardening
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p, s): Path(p).write_text(s, encoding='utf-8')

          p = 'src/modules/socialStudio/socialAlerts/socialStudioUserChannelRouting.js'
          s = read(p)
          if "require('./socialStudioRoutingResolver')" not in s:
              s = s.replace("const { ALERT_TYPES } = require('./socialStudioTemplates');", "const { ALERT_TYPES } = require('./socialStudioTemplates');\nconst { resolveSocialRoute } = require('./socialStudioRoutingResolver');", 1)
          s, n = re.subn(r"function syncUser\(config, userId\) \{.*?\n\}", """function syncUser(config, userId) {
  for (const accountId of creatorAccountsForUser(config, userId)) {
    const account = config.accounts?.[accountId];
    if (account) clearRoutesFromAccount(account);
  }
}""", s, count=1, flags=re.S)
          if n != 1: raise SystemExit('syncUser not found')
          a = s.find('function effectiveRoute(')
          b = s.find('\nfunction payload(', a)
          if a < 0 or b < 0: raise SystemExit('effective preview block not found')
          preview = """function effectivePreview(config, userId) {
  const accounts = creatorAccountsForUser(config, userId)
    .map((accountId) => config.accounts?.[accountId])
    .filter(Boolean);
  const samples = accounts.length ? accounts : [{ discordUserId: userId, platform: '' }];

  return ALERT_TYPES.map((type) => {
    const resolved = samples.map((account) => resolveSocialRoute(config, account, type));
    const unique = new Map(resolved.map((item) => [`${item.channelId || ''}:${item.source}`, item]));
    if (unique.size === 1) {
      const item = [...unique.values()][0];
      return `${TYPE_EMOJI[type] || '🔔'} **${TYPE_LABELS[type] || type}** → ${item.channelId ? `<#${item.channelId}>` : 'Not configured'} *(${item.source})*`;
    }
    const details = resolved.map((item, index) => `${String(samples[index]?.platform || 'account').toUpperCase()}: ${item.channelId ? `<#${item.channelId}>` : 'Not configured'} (${item.source})`).join(' • ');
    return `${TYPE_EMOJI[type] || '🔔'} **${TYPE_LABELS[type] || type}** → *varies by platform* — ${details}`;
  }).join('\n');
}
"""
          s = s[:a] + preview + s[b:]
          s = s.replace('**Fallback:** User content route → User All Content → Server Platform Override → Server Dedicated route → Server Default channel.', '**Fallback:** Creator Platform → User Content → User All Content → Creator → Account → Server Platform → Server Dedicated → Server Default.')
          s = s.replace('effectivePreview(config, routes, s.targetUserId)', 'effectivePreview(config, s.targetUserId)')
          write(p, s)

          p = 'src/modules/socialStudio/socialAlerts/socialStudioCreatorRoutingCompat.js'
          s = read(p)
          s, n = re.subn(r"function syncCreatorOverride\(config, creator\) \{.*?\n\}", """function syncCreatorOverride(config, creator) {
  if (!creator) return config;
  for (const accountId of creator.accountIds || []) {
    const account = config.accounts?.[accountId];
    if (account) clearCreatorOverrideFromAccount(account);
  }
  return config;
}""", s, count=1, flags=re.S)
          if n != 1: raise SystemExit('syncCreatorOverride not found')
          write(p, s)

          p = 'test/auditRegression.test.js'
          s = read(p)
          s = s.replace("assert.match(source, /User content route → User All Content → Server Platform Override → Server Dedicated route → Server Default channel/);", "assert.match(source, /Creator Platform → User Content → User All Content → Creator → Account → Server Platform → Server Dedicated → Server Default/);")
          if 'routing resolver is authoritative over compatibility mutations' not in s:
              s += r'''

test('routing resolver is authoritative over compatibility mutations', () => {
  const resolver = read('src/modules/socialStudio/socialAlerts/socialStudioRoutingResolver.js');
  const monitor = read('src/modules/socialStudio/socialAlerts/socialStudioMonitor.js');
  const user = read('src/modules/socialStudio/socialAlerts/socialStudioUserChannelRouting.js');
  const creator = read('src/modules/socialStudio/socialAlerts/socialStudioCreatorRoutingCompat.js');
  assert.match(monitor, /projectEffectiveAccounts/);
  assert.match(user, /resolveSocialRoute/);
  assert.doesNotMatch(user.slice(user.indexOf('function syncUser('), user.indexOf('function routeSummary(')), /applyRoutesToAccount/);
  assert.doesNotMatch(creator.slice(creator.indexOf('function syncCreatorOverride('), creator.indexOf('function syncAllCreatorOverrides(')), /applyCreatorOverrideToAccount/);
  for (const label of ['Creator Platform Override', 'User Content Override', 'User All Content', 'Creator Override', 'Server Platform Override', 'Server Dedicated', 'Server Default']) {
    assert.match(resolver, new RegExp(label));
  }
});

test('Command Center selection and private command cleanup are scoped', () => {
  const store = read('src/owner/auditIntelligence/auditStore.js');
  const sync = read('src/core/commandRegistry/syncCommands.js');
  assert.match(store, /persistGuildId/);
  assert.match(sync, /cleanupCommandCenterScope/);
  assert.match(sync, /non-Command-Center guild/);
});
'''
          write(p, s)
          PY

          npm test
          npm run doctor
          npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/socialStudio/socialAlerts/socialStudioUserChannelRouting.js src/modules/socialStudio/socialAlerts/socialStudioCreatorRoutingCompat.js test/auditRegression.test.js
          git commit -m "refactor(social): make routing resolver authoritative"
          git push origin dev

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git pull --rebase origin dev
          git rm .github/workflows/finish-audit-hardening-v2.yml
          git commit -m "chore(ci): remove final audit hardening runner"
          git push origin dev
