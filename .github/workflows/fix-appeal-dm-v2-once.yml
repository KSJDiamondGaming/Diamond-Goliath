name: Fix Appeal DM V2 Once
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-appeal-dm-v2-once.yml'
      - '.github/appeal_patch.py'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 .github/appeal_patch.py
      - run: node --check src/core/administration/mod/storage.js
      - run: node -e "require('./src/core/administration/mod/storage')"
      - run: rm -f .github/appeal_patch.py .github/workflows/fix-appeal-dm-v2-once.yml .github/workflows/fix-appeal-dm-clean-once.yml
      - run: npm run doctor
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A src/core/administration/mod/storage.js .github
          git commit -m "feat(mod): make appeal notice user friendly"
          git push origin dev
