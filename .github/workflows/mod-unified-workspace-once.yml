name: Apply Unified Moderation Workspace

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/mod-unified-workspace-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Merge member workspace into moderation home
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/mod-unified-workspace.js
          node /tmp/mod-unified-workspace.js
          node --check src/core/administration/mod/panel.js
          npm ci
          npm run doctor

      - name: Commit clean source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KSJ Hub"
          git config user.email "sycomorgan@gmail.com"
          git rm .github/workflows/mod-unified-workspace-once.yml
          git add src/core/administration/mod/panel.js
          git diff --cached --check
          git commit -m "refactor(mod): unify member moderation workspace"
          git push origin HEAD:dev
