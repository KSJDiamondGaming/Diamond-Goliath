name: Finalize Duplicator Module Paths Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-duplicator-core-paths-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fix moved core imports and simplify index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/owner/dev/duplicator/core.js')
          s = p.read_text()
          s = s.replace("require('../../core/security/protection/core')", "require('../../../core/security/protection/core')")
          s = s.replace("require('../../core/guild/guildManager')", "require('../../../core/guild/guildManager')")
          s = s.replace("require('../../core/security/restoreBackup/backup')", "require('../../../core/security/restoreBackup/backup')")
          p.write_text(s)
          PY
          cat > src/owner/dev/duplicator/index.js <<'EOF'
          'use strict';

          const { Client } = require('discord.js');
          const core = require('./core');
          const selective = require('./selective');
          selective.configure(core);

          const BOOTSTRAP_KEY = Symbol.for('goliath.duplicator.bridge-bootstrap');
          if (!Client.prototype[BOOTSTRAP_KEY]) {
            const originalLogin = Client.prototype.login;
            Object.defineProperty(Client.prototype, BOOTSTRAP_KEY, { value: true });
            Client.prototype.login = function goliathDuplicatorLogin(...args) {
              core.initializeBridge(this);
              return originalLogin.apply(this, args);
            };
          }

          async function run(interaction) {
            const action = interaction?.options?.getString?.('action', true);
            if (action === 'copy') return selective.startCopy(interaction);
            return core.run(interaction);
          }

          async function handleInteraction(interaction) {
            if (await selective.handleInteraction(interaction)) return true;
            return core.handleInteraction(interaction);
          }

          module.exports = { ...core, run, handleInteraction, selective };
          EOF
          test "$(find src/owner/dev/duplicator -maxdepth 1 -type f | wc -l)" -eq 4
          node --check src/owner/dev/duplicator/index.js
          node --check src/owner/dev/duplicator/core.js
          node --check src/owner/dev/duplicator/selective.js
          node --check src/owner/dev/duplicator/history.js
          rm -f .github/workflows/fix-duplicator-core-paths-once.yml

      - name: Commit final module layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(duplicator): finalize moved module imports"
          git push origin HEAD:dev
