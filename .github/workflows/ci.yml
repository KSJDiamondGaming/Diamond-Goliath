name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check index.js syntax
        run: node --check index.js

      - name: Check all command files syntax
        shell: bash
        run: |
          find src -name "*.js" -print0 | xargs -0 -n1 node --check