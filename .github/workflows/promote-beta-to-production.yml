name: Promote BETA to PRODUCTION

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-beta-to-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Merge beta into working tree
        run: |
          set -e
          git fetch origin beta production
          git merge origin/beta --no-edit

      - name: Open promotion pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/promote-beta-to-production
          base: production
          title: Promote BETA to PRODUCTION
          commit-message: Promote BETA to PRODUCTION
          body: |
            Automated BETA to PRODUCTION promotion.

            This PR exists because production is protected and direct workflow pushes are blocked.