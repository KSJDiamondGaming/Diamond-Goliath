name: Release to PRODUCTION

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-to-production
  cancel-in-progress: false

jobs:
  release-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge BETA into release branch
        run: |
          set -e
          git fetch origin beta production
          git merge origin/beta --no-edit

      - name: Create release PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/release-to-production
          base: production
          title: Release BETA to PRODUCTION
          commit-message: Release BETA to PRODUCTION
          body: |
            Automated release from BETA to PRODUCTION.

      - name: Auto-merge release PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --merge --delete-branch

      - name: Deploy PRODUCTION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Deploy PRODUCTION" --repo KSJHub/Goliath --ref production