name: Promote BETA to PRODUCTION

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-beta-to-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote beta to production
        run: |
          set -e

          echo "🚀 Promoting BETA → PRODUCTION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin beta production

          git checkout production
          git reset --hard origin/production

          echo "🔀 Merging beta into production..."
          git merge origin/beta --no-edit

          echo "📤 Pushing production..."
          git push origin production

          echo "✅ BETA promoted to PRODUCTION"