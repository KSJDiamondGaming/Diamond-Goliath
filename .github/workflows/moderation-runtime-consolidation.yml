name: One-time moderation runtime consolidation

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/moderation-runtime-consolidation.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply exact consolidation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/features/moderation/functions/moderationStore.js';
          const original = fs.readFileSync(file, 'utf8');

          const pathImport = "const path = require('path');\n";
          const runtimeImport = "const { resolveRuntimePath } = require('../../../config/runtimePaths');\n";
          const oldDataDir = "const dataDir = path.join(\n  process.cwd(),\n  'runtime',\n  mode,\n  'database'\n);";
          const newDataDir = "const dataDir = resolveRuntimePath(\n  mode,\n  'database'\n);";

          if ((original.match(/process\.cwd\(\),\n  'runtime',/g) || []).length !== 1) throw new Error('Unexpected runtime construction count.');
          if ((original.match(/const path = require\('path'\);/g) || []).length !== 1) throw new Error('Unexpected path import count.');
          if (original.includes(runtimeImport.trim())) throw new Error('Canonical runtime import already exists.');
          if (!original.includes(oldDataDir)) throw new Error('Expected dataDir block missing.');

          let updated = original.replace(pathImport, `${pathImport}${runtimeImport}`);
          updated = updated.replace(oldDataDir, newDataDir);

          if (updated === original) throw new Error('No changes applied.');
          if (/process\.cwd\(\),\n  'runtime',/.test(updated)) throw new Error('Duplicate runtime construction remains.');
          if (!updated.includes(runtimeImport.trim())) throw new Error('Canonical runtime import missing.');

          fs.writeFileSync(file, updated, 'utf8');
          NODE

      - name: Verify
        run: |
          node --check src/features/moderation/functions/moderationStore.js
          git diff --check

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/moderation-runtime-consolidation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/moderation/functions/moderationStore.js .github/workflows/moderation-runtime-consolidation.yml
          git diff --cached --check
          git commit -m "use canonical runtime path for moderation database"
          git push origin dev
