# Final canonical Goodbye build
name: Build Canonical Goodbye Module

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/goodbye-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record workflow run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .goliath
          echo "${GITHUB_RUN_ID}" > .goliath/goodbye-build-run-id.txt
          git add .goliath/goodbye-build-run-id.txt
          git commit -m "chore: record Goodbye build run"
          git pull --rebase origin dev
          git push origin dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build canonical Goodbye architecture
        run: |
          python3 .goliath/goodbye_refactor.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/modules/feedbackStudio/forms/formsTracking.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace("require('../tickets/ticketManager')", "require('../tickets/ticketsLifecycle')")
          text = text.replace("require('../tickets/ticketChannelManager')", "require('../tickets/ticketsChannels')")
          text = text.replace("require('../tickets/ticketPanelManager')", "require('../tickets/ticketsPanel')")
          text = text.replace("require('../tickets/ticketStore')", "require('../tickets/tickets')")
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Validate JavaScript syntax
        run: |
          find src/modules/messageStudio/goodbye -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check src/server/routes/goodbye.js
          node --check src/events/members/memberJoinLeave.js
          node --check src/events/interactions/interactionCreate.js
          node --check src/modules/feedbackStudio/forms/formsTracking.js
          node --check server.js

      - name: Verify canonical layout and imports
        run: |
          test "$(find src/modules/messageStudio/goodbye -maxdepth 1 -name '*.js' | wc -l)" -eq 3
          for file in goodbye.js goodbyePanel.js goodbyeDeparture.js; do
            test -f "src/modules/messageStudio/goodbye/$file"
          done
          test -f src/server/routes/goodbye.js
          ! grep -R -nE 'goodbye/(departureTemplateSender|goodbyeDepartureDm|goodbyeDmPanel|goodbyeRoute)|messageStudio/goodbye/goodbyeRoute|tickets/(ticketManager|ticketChannelManager|ticketPanelManager|ticketStore)' src server.js scripts

      - name: Runtime smoke test
        run: |
          node - <<'NODE'
          const goodbye = require('./src/modules/messageStudio/goodbye/goodbye');
          const panel = require('./src/modules/messageStudio/goodbye/goodbyePanel');
          const departure = require('./src/modules/messageStudio/goodbye/goodbyeDeparture');
          const route = require('./src/server/routes/goodbye');
          for (const [name, api] of Object.entries({ goodbye, panel, departure, route })) if (!api) throw new Error(`Invalid Goodbye API: ${name}`);
          for (const fn of ['getGoodbyeSection', 'sendGoodbye', 'buildHealthReport']) if (typeof goodbye[fn] !== 'function') throw new Error(`Missing goodbye.${fn}`);
          for (const fn of ['buildGoodbyePanel', 'handleGoodbyeInteraction']) if (typeof panel[fn] !== 'function') throw new Error(`Missing panel.${fn}`);
          for (const fn of ['sendDeparture', 'sendDepartureDm', 'buildDmEmbed']) if (typeof departure[fn] !== 'function') throw new Error(`Missing departure.${fn}`);
          NODE

      - name: Run Doctor
        run: |
          set +e
          timeout 90s npm run doctor 2>&1 | tee /tmp/goodbye-doctor.txt
          status=${PIPESTATUS[0]}
          set -e
          if grep -q '❌' /tmp/goodbye-doctor.txt; then exit 1; fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi

      - name: Run Audit
        run: |
          set +e
          timeout 90s npm run audit 2>&1 | tee /tmp/goodbye-audit.txt
          status=${PIPESTATUS[0]}
          set -e
          if grep -q '❌' /tmp/goodbye-audit.txt; then exit 1; fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi

      - name: Commit canonical Goodbye refactor
        run: |
          rm -f .goliath/goodbye-build-run-id.txt .goliath/goodbye-syntax-error.txt .goliath/goodbye-doctor-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor Goodbye into three canonical files"
          git pull --rebase origin dev
          git push origin dev
