name: Apply Moderation Route Cleanup

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/remove-mod-management-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply cleanup
        run: python scripts/remove-mod-management-temp.py
      - name: Verify source
        run: |
          node -c src/core/administration/mod/panel.js
          node -c src/core/administration/mod/interactions.js
      - name: Commit cleanup
        run: |
          rm .github/workflows/remove-mod-management-once.yml
          rm scripts/remove-mod-management-temp.py
          git config user.name "KSJ Hub"
          git config user.email "sycomorgan@gmail.com"
          git add src/core/administration/mod/panel.js src/core/administration/mod/interactions.js .github/workflows/remove-mod-management-once.yml scripts/remove-mod-management-temp.py
          git commit -m "refactor(mod): remove redundant management route"
          git push origin dev
