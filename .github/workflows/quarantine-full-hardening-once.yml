        run: git rm .github/workflows/quarantine-full-hardening-once.yml
      - name: Full Doctor
        run: npm run doctor
      - name: Commit hardened implementation
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add src/core/security/protection/quarantine.js \
                  src/core/administration/mod/quarantineInteractions.js \
                  src/core/administration/admin/command.js \
                  src/core/administration/mod/caseCourt.js \
                  src/core/administration/mod/cases.js \
                  .github/workflows/quarantine-full-hardening-once.yml
          git commit -m "fix(security): harden quarantine lifecycle end to end"
          git push origin dev
