name: One-time backup runtime consolidation

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/backup-runtime-consolidation.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply exact consolidation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(file, replacements, assertions = []) {
            const original = fs.readFileSync(file, 'utf8');
            for (const [pattern, expected, label] of assertions) {
              const count = (original.match(pattern) || []).length;
              if (count !== expected) throw new Error(`${file}: ${label} count ${count}, expected ${expected}`);
            }
            let updated = original;
            for (const [from, to] of replacements) {
              if (!updated.includes(from)) throw new Error(`${file}: expected block not found`);
              updated = updated.replace(from, to);
            }
            if (updated === original) throw new Error(`${file}: no changes applied`);
            fs.writeFileSync(file, updated, 'utf8');
          }

          replaceExact(
            'src/core/security/backup/backupSync.js',
            [
              ["const crypto = require('node:crypto');\n", "const crypto = require('node:crypto');\nconst { resolveRuntimePath } = require('../../../config/runtimePaths');\n"],
              ["const RUNTIME_ROOT = path.join(\n  process.cwd(),\n  'runtime',\n  BOT_MODE\n);\n\nconst BACKUP_SYNC_DIR = path.join(\n  RUNTIME_ROOT,\n  'backups',\n  'sync'\n);", "const BACKUP_SYNC_DIR = resolveRuntimePath(\n  BOT_MODE,\n  'backups',\n  'sync'\n);"],
            ],
            [
              [/const RUNTIME_ROOT = path\.join\(/g, 1, 'runtime root'],
              [/const BACKUP_SYNC_DIR = path\.join\(/g, 1, 'backup sync dir'],
            ]
          );

          replaceExact(
            'src/core/security/restoreRequestManager.js',
            [
              ["const path = require('node:path');\n", "const path = require('node:path');\nconst { resolveRuntimePath } = require('../../config/runtimePaths');\n"],
              ["const RUNTIME_ROOT = path.join(process.cwd(), 'runtime', BOT_MODE);\n\nconst RESTORE_DIR = path.join(RUNTIME_ROOT, 'recovery', 'restoreRequests');", "const RESTORE_DIR = resolveRuntimePath(BOT_MODE, 'recovery', 'restoreRequests');"],
            ],
            [
              [/const RUNTIME_ROOT = path\.join\(/g, 1, 'runtime root'],
              [/const RESTORE_DIR = path\.join\(/g, 1, 'restore dir'],
            ]
          );

          replaceExact(
            'src/core/security/backup/backupCore.js',
            [
              ["const crypto = require('crypto');\n", "const crypto = require('crypto');\nconst { resolveRuntimePath } = require('../../../config/runtimePaths');\n"],
              ["function getBackupRoot(environment) {\n  return path.join(\n    process.cwd(),\n    'runtime',\n    getModeKey(environment),\n    'backups'\n  );\n}", "function getBackupRoot(environment) {\n  return resolveRuntimePath(\n    getModeKey(environment),\n    'backups'\n  );\n}"],
            ],
            [
              [/function getBackupRoot\(environment\)/g, 1, 'getBackupRoot'],
              [/process\.cwd\(\),\n    'runtime',/g, 1, 'runtime construction'],
            ]
          );
          NODE

      - name: Verify
        run: |
          node --check src/core/security/backup/backupSync.js
          node --check src/core/security/restoreRequestManager.js
          node --check src/core/security/backup/backupCore.js
          ! grep -n "const RUNTIME_ROOT" src/core/security/backup/backupSync.js src/core/security/restoreRequestManager.js
          ! grep -n "process.cwd()," src/core/security/backup/backupCore.js | grep "runtime"
          git diff --check

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/backup-runtime-consolidation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/security/backup/backupSync.js src/core/security/restoreRequestManager.js src/core/security/backup/backupCore.js .github/workflows/backup-runtime-consolidation.yml
          git diff --cached --check
          git commit -m "use canonical runtime paths for backup systems"
          git push origin dev
