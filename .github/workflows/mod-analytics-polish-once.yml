name: Apply Moderation Analytics Polish

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/mod-analytics-polish-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply moderation analytics polish
        run: node scripts/mod-analytics-polish-once.js
      - name: Remove temporary patch files
        run: git rm scripts/mod-analytics-polish-once.js .github/workflows/mod-analytics-polish-once.yml
      - name: Validate clean source
        run: |
          node --check src/core/administration/mod/panel.js
          npm run syntax
          npm run imports
          npm run doctor
      - name: Commit clean source
        run: |
          git config user.name "KSJHub"
          git config user.email "actions@users.noreply.github.com"
          git add src/core/administration/mod/panel.js
          git diff --cached --check
          git commit -m "refactor(mod): polish analytics controls and messaging"
          git push origin HEAD:dev
