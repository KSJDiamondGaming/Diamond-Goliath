name: Release to BETA

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-to-beta
  cancel-in-progress: false

jobs:
  release-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge DEV into release branch
        run: |
          set -e
          git fetch origin dev beta
          git merge origin/dev --no-edit

      - name: Create release PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/release-to-beta
          base: beta
          title: Release DEV to BETA
          commit-message: Release DEV to BETA
          body: |
            Automated release from DEV to BETA.

      - name: Auto-merge release PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --merge --delete-branch

      - name: Deploy BETA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Deploy BETA" --repo KSJHub/Goliath --ref beta