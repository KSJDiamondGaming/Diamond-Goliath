name: Promote DEV to BETA

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-dev-to-beta
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into working tree
        run: |
          set -e
          git fetch origin dev beta
          git merge origin/dev --no-edit

      - name: Open promotion pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/promote-dev-to-beta
          base: beta
          title: Promote DEV to BETA
          commit-message: Promote DEV to BETA
          body: |
            Automated DEV to BETA promotion.

            This PR exists because beta is protected and direct workflow pushes are blocked.