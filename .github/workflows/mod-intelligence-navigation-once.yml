name: Apply Member Intelligence Navigation Cleanup

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/patch-mod-intelligence-navigation-once.js'
      - '.github/workflows/mod-intelligence-navigation-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply source patch
        run: node scripts/patch-mod-intelligence-navigation-once.js
      - name: Remove temporary patch files
        run: |
          rm -f scripts/patch-mod-intelligence-navigation-once.js
          rm -f .github/workflows/mod-intelligence-navigation-once.yml
      - name: Validate source
        run: |
          node --check src/core/administration/mod/interactions.js
          node --check src/core/administration/mod/panel.js
          node --check src/core/administration/mod/permissions.js
          npm run doctor
          npm run build --if-present
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/administration/mod/interactions.js src/core/administration/mod/panel.js src/core/administration/mod/permissions.js scripts/patch-mod-intelligence-navigation-once.js .github/workflows/mod-intelligence-navigation-once.yml
          git commit -m 'fix(mod): make intelligence navigation context-aware'
          git push origin HEAD:dev
