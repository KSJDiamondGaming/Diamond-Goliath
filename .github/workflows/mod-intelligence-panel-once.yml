name: Apply Member Intelligence Panel Cleanup

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/mod-intelligence-panel-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply source patch
        run: node scripts/patch-mod-intel-panel-once.js
      - name: Remove temporary patch files
        run: |
          git rm -f scripts/patch-mod-intel-panel-once.js
          git rm -f .github/workflows/mod-intelligence-panel-once.yml
      - name: Validate source
        run: |
          node --check src/core/administration/mod/intelligence.js
          npm run doctor
          npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/administration/mod/intelligence.js
          git commit -m 'refactor(mod): prioritize member intelligence workflow'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
      - name: Deploy current dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-dev.yml/dispatches" \
            -d '{"ref":"dev","inputs":{"environment":"dev"}}'
