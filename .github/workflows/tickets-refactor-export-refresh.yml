name: Tickets Refactor Export Refresh

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/tickets-refactor-export-refresh.yml'

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: goliath-source-refresh
          path: .
          include-hidden-files: true
          retention-days: 1
      - name: Record artifact id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          mkdir -p .goliath
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "goliath-source-refresh" and .expired == false)][0].id' \
            > .goliath/export-artifact-refresh-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .goliath/export-artifact-refresh-id.txt
          git commit -m "chore: record refreshed source artifact" || exit 0
          git push
