name: Fix Embed Studio Admin Entry Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-admin-embed-entry-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply admin embed entry fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/modules/messageStudio/embed/embedInteractions.js')
          s = p.read_text()
          old = '''async function handleInteraction(i) {\n  if (!i.customId?.startsWith('embed:')) return false;\n  const who = memberName(i);\n  const s = getSession(i);\n'''
          new = '''async function handleInteraction(i) {\n  const customId = String(i.customId || '');\n  if (customId !== 'admin:embed' && !customId.startsWith('embed:')) return false;\n  const who = memberName(i);\n  const s = getSession(i);\n\n  if (customId === 'admin:embed') {\n    await i.update(buildEditorPanel(i, who));\n    return true;\n  }\n'''
          if old not in s:
              raise SystemExit('Target Embed Studio handler entry block not found; refusing unsafe patch.')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check src/modules/messageStudio/embed/embedInteractions.js
      - name: Commit fix and remove one-shot workflow
        run: |
          rm -f .github/workflows/fix-admin-embed-entry-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/messageStudio/embed/embedInteractions.js .github/workflows/fix-admin-embed-entry-once.yml
          git commit -m "fix(embed): handle Message Studio admin entry"
          git pull --rebase origin dev
          git push origin dev
