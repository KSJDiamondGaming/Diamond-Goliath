name: Finish module structure

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/finish-module-structure.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restructure Auto Roles and Verification
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')

          def move(src, dst):
              src = root / src
              dst = root / dst
              if not src.exists():
                  return
              dst.parent.mkdir(parents=True, exist_ok=True)
              if dst.exists():
                  dst.unlink()
              shutil.move(str(src), str(dst))

          def replace(path, replacements):
              path = root / path
              if not path.exists():
                  return
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          def replace_exact_module_imports(path):
              path = root / path
              if not path.exists() or path.suffix not in {'.js', '.cjs', '.mjs', '.jsx'}:
                  return
              text = path.read_text(encoding='utf-8')
              # Only replace imports that end exactly at the module directory.
              text = re.sub(r"(['\"])(\.\.?/[^'\"]*/modules/autoroles)\1", lambda m: f"{m.group(1)}{m.group(2)}/autoroles{m.group(1)}", text)
              text = re.sub(r"(['\"])(\.\.?/[^'\"]*/modules/verification)\1", lambda m: f"{m.group(1)}{m.group(2)}/verification{m.group(1)}", text)
              text = text.replace("'./src/modules/autoroles'", "'./src/modules/autoroles/autoroles'")
              text = text.replace('"./src/modules/autoroles"', '"./src/modules/autoroles/autoroles"')
              text = text.replace("'./src/modules/verification'", "'./src/modules/verification/verification'")
              text = text.replace('"./src/modules/verification"', '"./src/modules/verification/verification"')
              path.write_text(text, encoding='utf-8')

          # AUTO ROLES: explicit files only, no directory entry point.
          index = root / 'src/modules/autoroles/index.js'
          if index.exists():
              index.unlink()

          for path in root.rglob('*'):
              if path.is_file():
                  replace_exact_module_imports(path.relative_to(root))

          replace('scripts/goliath.js', [
              ('src/modules/autoroles.js', 'src/modules/autoroles/autoroles.js'),
              ('src/modules/autorolesPanel.js', 'src/modules/autoroles/autorolesPanel.js'),
              ('src/modules/autorolesRoute.js', 'src/modules/autoroles/autorolesRoute.js'),
          ])

          # VERIFICATION: group all module-owned files together.
          move('src/modules/verification.js', 'src/modules/verification/verification.js')
          move('src/modules/verificationRoute.js', 'src/modules/verification/verificationRoute.js')
          move('src/core/admin/functions/verificationAdminPanel.js', 'src/modules/verification/verificationPanel.js')

          loose_panel = root / 'src/modules/verificationPanel.js'
          if loose_panel.exists():
              loose_panel.unlink()
          server_bridge = root / 'src/server/routes/verification.js'
          if server_bridge.exists():
              server_bridge.unlink()

          replace('src/modules/verification/verification.js', [
              ("require('./verification/verificationStore')", "require('./verificationStore')"),
              ("require('./verification/verificationManager')", "require('./verificationManager')"),
          ])
          replace('src/modules/verification/verificationPanel.js', [
              ("require('../../../modules/verification/verificationManager')", "require('./verificationManager')"),
              ("require('../../../modules/verification/verificationStore')", "require('./verificationStore')"),
          ])
          replace('src/modules/verification/verificationRoute.js', [
              ("require('../core/guild/guildManager')", "require('../../core/guild/guildManager')"),
          ])

          # Explicit panel and route paths.
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.js', '.cjs', '.mjs', '.jsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace("../../modules/verificationPanel", "../../modules/verification/verificationPanel")
              text = text.replace("../../modules/autorolesPanel", "../../modules/autoroles/autorolesPanel")
              text = text.replace("./src/modules/verificationRoute", "./src/modules/verification/verificationRoute")
              text = text.replace("./src/modules/autorolesRoute", "./src/modules/autoroles/autorolesRoute")
              text = text.replace("./src/server/routes/verification", "./src/modules/verification/verificationRoute")
              path.write_text(text, encoding='utf-8')

          replace('scripts/goliath.js', [
              ('src/modules/verification.js', 'src/modules/verification/verification.js'),
              ('src/modules/verificationPanel.js', 'src/modules/verification/verificationPanel.js'),
              ('src/modules/verificationRoute.js', 'src/modules/verification/verificationRoute.js'),
          ])

          # The temporary workflow removes itself in the resulting commit.
          workflow = root / '.github/workflows/finish-module-structure.yml'
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Verify structure and imports
        shell: bash
        run: |
          set -euo pipefail

          test -f src/modules/autoroles/autoroles.js
          test -f src/modules/autoroles/autorolesPanel.js
          test -f src/modules/autoroles/autorolesRoute.js
          test ! -e src/modules/autoroles/index.js
          test ! -e src/modules/autoroles.js
          test ! -e src/modules/autorolesPanel.js
          test ! -e src/modules/autorolesRoute.js

          test -f src/modules/verification/verification.js
          test -f src/modules/verification/verificationPanel.js
          test -f src/modules/verification/verificationRoute.js
          test ! -e src/modules/verification.js
          test ! -e src/modules/verificationPanel.js
          test ! -e src/modules/verificationRoute.js
          test ! -e src/core/admin/functions/verificationAdminPanel.js
          test ! -e src/server/routes/verification.js

          node --check src/modules/autoroles/autoroles.js
          node --check src/modules/autoroles/autorolesPanel.js
          node --check src/modules/autoroles/autorolesRoute.js
          node --check src/modules/verification/verification.js
          node --check src/modules/verification/verificationPanel.js
          node --check src/modules/verification/verificationRoute.js
          node --check server.js
          node --check src/events/interactions/interactionCreate.js
          node --check src/events/members/memberJoinLeave.js
          node --check src/server/routes/modules.js
          node --check src/server/routes/permissionHealth.js
          node --check scripts/goliath.js

          if grep -RInE "modules/(autoroles|verification)['\"]" --include='*.js' server.js src scripts; then
            echo 'Found non-explicit module directory imports.'
            exit 1
          fi

          npm ci --ignore-scripts
          node scripts/goliath.js imports

      - name: Commit completed structure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KSJHub'
          git config user.email '83096833+KSJHub@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: finish autoroles and verification structure'
          git push origin dev
