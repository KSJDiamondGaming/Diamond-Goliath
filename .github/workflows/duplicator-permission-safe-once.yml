name: Duplicator Permission Safe Repair Once

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/duplicator-permission-safe-once.js'
      - '.github/workflows/duplicator-permission-safe-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Duplicator repair
        run: node scripts/duplicator-permission-safe-once.js
      - name: Remove one-off repair files
        run: |
          rm -f scripts/duplicator-permission-safe-once.js
          rm -f .github/workflows/duplicator-permission-safe-once.yml
      - name: Validate Duplicator and repository
        run: |
          node --check src/owner/dev/duplicator/core.js
          node --check src/owner/dev/duplicator/selective.js
          npm run doctor
      - name: Commit repaired Duplicator
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(duplicator): defer unsupported permission bits instead of blocking transfers"
          git push origin HEAD:dev
