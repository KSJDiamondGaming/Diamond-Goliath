name: Canonical Schedule Refactor

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/schedule-canonical-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Finalise canonical Schedule architecture
        run: |
          python3 <<'PY'
          from pathlib import Path
          root = Path.cwd()
          base = root / 'src/modules/utilityStudio/schedule'

          core_path = base / 'schedule.js'
          core = core_path.read_text(encoding='utf-8')
          cut = core.index('function dueReminders')
          prefix = core[:cut]
          exports = """module.exports = {
            SECTION, RSVP_STATES, RECURRENCE_TYPES, defaultSection, getSection, listEvents, getEvent, setEnabled, updateSettings,
            incrementAnalytics, saveEvent, removeEvent, cancelEvent, duplicateEvent, setRsvp, removeRsvp, rsvpCounts, promoteWaitlist, nextOccurrence,
            exportConfiguration: getSection,
            reset: (guildId, meta = {}) => saveSection(guildId, defaultSection(), meta),
          };
          """
          core_path.write_text(prefix + exports, encoding='utf-8', newline='\n')

          panel_path = base / 'schedulePanel.js'
          panel = panel_path.read_text(encoding='utf-8').replace("require('./scheduleDeployment')", "require('./scheduleInteractions')")
          panel_path.write_text(panel, encoding='utf-8', newline='\n')

          old_route = base / 'scheduleRoute.js'
          route = old_route.read_text(encoding='utf-8')
          route = route.replace("const schedule = require('./schedule');", "const schedule = require('../../modules/utilityStudio/schedule/schedule');")
          route = route.replace("const deployment = require('./scheduleDeployment');", "const deployment = require('../../modules/utilityStudio/schedule/scheduleInteractions');")
          route_path = root / 'src/server/routes/schedule.js'
          route_path.write_text(route, encoding='utf-8', newline='\n')

          interaction_path = root / 'src/events/interactions/interactionCreate.js'
          interaction = interaction_path.read_text(encoding='utf-8').replace(
            '../../modules/utilityStudio/schedule/scheduleDeployment',
            '../../modules/utilityStudio/schedule/scheduleInteractions',
          )
          interaction_path.write_text(interaction, encoding='utf-8', newline='\n')

          ready_path = root / 'src/events/schedule/scheduleReady.js'
          ready = ready_path.read_text(encoding='utf-8').replace(
            "../../modules/utilityStudio/schedule/schedule'",
            "../../modules/utilityStudio/schedule/scheduleTracking'",
          )
          ready_path.write_text(ready, encoding='utf-8', newline='\n')

          server_path = root / 'server.js'
          server = server_path.read_text(encoding='utf-8').replace(
            './src/modules/utilityStudio/schedule/scheduleRoute',
            './src/server/routes/schedule',
          )
          server_path.write_text(server, encoding='utf-8', newline='\n')

          (base / 'scheduleDeployment.js').unlink(missing_ok=True)
          old_route.unlink(missing_ok=True)

          docs = root / 'docs/modules/schedule.md'
          docs.write_text("""# Schedule

Schedule uses four canonical implementation files.

```text
src/modules/utilityStudio/schedule/
├── schedule.js
├── schedulePanel.js
├── scheduleInteractions.js
└── scheduleTracking.js
```

- `schedule.js` owns configuration, event persistence, recurrence and RSVP state.
- `schedulePanel.js` is the single source of truth for visible admin UI, embeds, buttons and modals.
- `scheduleInteractions.js` owns event deployment and member RSVP interactions.
- `scheduleTracking.js` owns reminders, completion, recurrence processing, recovery, health and startup.

The dashboard/API router lives at `src/server/routes/schedule.js` and is not a module implementation file.

No wrappers, compatibility layers or duplicate implementations are permitted.
""", encoding='utf-8', newline='\n')

          Path('.github/workflows/schedule-canonical-refactor.yml').unlink(missing_ok=True)
          PY
      - name: Validate
        run: |
          test "$(find src/modules/utilityStudio/schedule -maxdepth 1 -name '*.js' | wc -l)" -eq 4
          find src/modules/utilityStudio/schedule -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check src/server/routes/schedule.js
          node --check src/events/schedule/scheduleReady.js
          node --check src/events/interactions/interactionCreate.js
          node --check server.js
          ! grep -R -nE 'scheduleDeployment|utilityStudio/schedule/scheduleRoute' src server.js
          npm run doctor
          npm run audit
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor Schedule into four canonical files"
          git pull --rebase --autostash origin dev
          git push
