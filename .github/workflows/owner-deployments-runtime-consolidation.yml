name: One-time owner deployments runtime consolidation

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/owner-deployments-runtime-consolidation.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply exact consolidation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/server/routes/ownerDeployments.js';
          const original = fs.readFileSync(file, 'utf8');
          const anchor = "const path = require('path');\n";
          const importLine = "const { resolveRuntimePath } = require('../../config/runtimePaths');\n";
          const oldHelper = `function runtimePath(environment = getRuntimeMode(), ...parts) {\n  return path.join(process.cwd(), 'runtime', getEnvironmentKey(environment), ...parts);\n}`;
          const newHelper = `function runtimePath(environment = getRuntimeMode(), ...parts) {\n  return resolveRuntimePath(getEnvironmentKey(environment), ...parts);\n}`;

          if ((original.match(/const path = require\('path'\);/g) || []).length !== 1) throw new Error('Unexpected path import count.');
          if ((original.match(/function runtimePath\(/g) || []).length !== 1) throw new Error('Unexpected runtimePath helper count.');
          if (!original.includes(oldHelper)) throw new Error('Expected runtimePath implementation not found.');

          let updated = original.replace(anchor, `${anchor}${importLine}`);
          updated = updated.replace(oldHelper, newHelper);

          if (updated === original) throw new Error('No changes applied.');
          if (updated.includes("path.join(process.cwd(), 'runtime'")) throw new Error('Duplicate runtime root remains.');
          fs.writeFileSync(file, updated, 'utf8');
          NODE

      - name: Verify
        shell: bash
        run: |
          node --check src/server/routes/ownerDeployments.js
          git diff --check

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/owner-deployments-runtime-consolidation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/routes/ownerDeployments.js .github/workflows/owner-deployments-runtime-consolidation.yml
          git diff --cached --check
          git commit -m "use canonical runtime paths for owner deployments"
          git push origin dev
