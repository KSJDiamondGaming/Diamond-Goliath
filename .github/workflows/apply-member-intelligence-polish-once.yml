name: Apply Member Intelligence Polish Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-member-intelligence-polish-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply intelligence control polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'{label} not found in {path}')
              path.write_text(text.replace(old, new, 1))

          intelligence = Path('src/core/administration/mod/intelligence.js')
          interactions = Path('src/core/administration/mod/interactions.js')

          replace_once(intelligence,
              "if (report.access?.history) primary.push(new Discord.ButtonBuilder().setCustomId(`mod_scan_history:${target.id}`).setLabel('Scan History').setEmoji('🕘').setStyle(Discord.ButtonStyle.Secondary));",
              "if (report.access?.history) primary.push(new Discord.ButtonBuilder().setCustomId(`mod_scan_history:${target.id}`).setLabel('History').setEmoji('🕘').setStyle(Discord.ButtonStyle.Secondary));",
              'history label')
          replace_once(intelligence,
              "new Discord.ButtonBuilder().setCustomId(`mod_intel_guilds:${target.id}`).setLabel('Network Reputation').setEmoji('🌐').setStyle(Discord.ButtonStyle.Secondary),",
              "new Discord.ButtonBuilder().setCustomId(`mod_intel_guilds:${target.id}`).setLabel('Network').setEmoji('🌐').setStyle(Discord.ButtonStyle.Secondary),",
              'network label')
          replace_once(intelligence,
              "if (report.access?.links) evidence.push(new Discord.ButtonBuilder().setCustomId(`mod_scan_links:${target.id}`).setLabel(`Link Evidence (${report.persistentLinks?.length || 0})`.slice(0, 80)).setEmoji('🔗').setStyle(Discord.ButtonStyle.Secondary));",
              "if (report.access?.links) evidence.push(new Discord.ButtonBuilder().setCustomId(`mod_scan_links:${target.id}`).setLabel(`Correlations (${report.persistentLinks?.length || 0})`.slice(0, 80)).setEmoji('🔗').setStyle(Discord.ButtonStyle.Secondary));",
              'correlation label')
          replace_once(intelligence,
              "if (report.access?.notes) evidence.push(new Discord.ButtonBuilder().setCustomId(`mod_scan_note:${target.id}`).setLabel('Add Note').setEmoji('📝').setStyle(Discord.ButtonStyle.Secondary));",
              "if (report.access?.notes) evidence.push(new Discord.ButtonBuilder().setCustomId(`mod_scan_note:${target.id}`).setLabel('Notes').setEmoji('📝').setStyle(Discord.ButtonStyle.Secondary));",
              'notes label')
          replace_once(intelligence,
              ".setLabel(report.investigation?.watched ? 'Watch: On' : 'Watch: Off')",
              ".setLabel(report.investigation?.watched ? 'Watch On' : 'Watch Off')",
              'watch label')
          replace_once(intelligence,
              "`Evidence **${report.persistentLinks?.length || 0}** • Verified Links **${context.confirmedLinks?.length || 0}**`,",
              "`Correlations **${report.persistentLinks?.length || 0}** • Verified Links **${context.confirmedLinks?.length || 0}**`,",
              'investigation wording')

          old_layout = """  if (evidence.length) components.push(new Discord.ActionRowBuilder().addComponents(...evidence));

          const nav = [new Discord.ButtonBuilder().setCustomId(`mod_dashboard:${target.id}:actions`).setLabel('⬅️ Back').setStyle(Discord.ButtonStyle.Secondary)];
          if (report.access?.cases) nav.push(new Discord.ButtonBuilder().setCustomId(`mod_export_cases:${target.id}`).setLabel('📤 Export').setStyle(Discord.ButtonStyle.Secondary));
          components.push(new Discord.ActionRowBuilder().addComponents(...nav));"""
          new_layout = """  if (evidence.length) {
            const investigationRow = evidence.slice(0, 3);
            components.push(new Discord.ActionRowBuilder().addComponents(...investigationRow));
          }

          const finalRow = [];
          if (evidence[3]) finalRow.push(evidence[3]);
          finalRow.push(new Discord.ButtonBuilder().setCustomId(`mod_dashboard:${target.id}:actions`).setLabel('Back').setEmoji('⬅️').setStyle(Discord.ButtonStyle.Secondary));
          if (report.access?.cases) finalRow.push(new Discord.ButtonBuilder().setCustomId(`mod_export_cases:${target.id}`).setLabel('Export').setEmoji('📤').setStyle(Discord.ButtonStyle.Secondary));
          components.push(new Discord.ActionRowBuilder().addComponents(...finalRow));"""
          replace_once(intelligence, old_layout, new_layout, 'three-row layout')

          old_view = """  const text = evidence.length ? evidence.map((entry) => {
            const member = i.guild.members.cache.get(entry.userId);
            const label = entry.maxScore >= 70 ? '🔴 Strong historical correlation' : '🟠 Possible historical correlation';
            return `${label} — ${member ? member.user : `<@${entry.userId}>`} (\\`${entry.userId}\\`)\\n• appeared in **${entry.appearances}** scan(s) • highest score **${entry.maxScore}%**\\n${entry.signals.slice(0, 8).map((signal) => `• ${signal}`).join('\\n')}`;
          }).join('\\n\\n') : 'No suspected-account correlation has repeated across prior Goliath scans.';
          const embed = new Discord.EmbedBuilder()
            .setColor(0x5865F2)
            .setTitle(`🔗 Persistent Link Evidence • ${target.user.tag}`)
            .setDescription(`Evidence accumulated from previous Goliath scans. Repeated heuristic matches are still **not proof** of shared ownership.\\n\\n${text.slice(0, 3800)}`)
            .setFooter({ text: 'Persistent correlation uses only previously recorded Goliath scan signals.' })
            .setTimestamp();"""
          new_view = """  const text = evidence.length ? evidence.map((entry) => {
            const member = i.guild.members.cache.get(entry.userId);
            const label = entry.maxScore >= 70 ? '🔴 Strong historical correlation' : '🟠 Possible historical correlation';
            const firstSeen = entry.firstSeen ? scanTimestamp(new Date(entry.firstSeen).getTime()) : 'Unknown';
            const lastSeen = entry.lastSeen ? scanTimestamp(new Date(entry.lastSeen).getTime()) : 'Unknown';
            return [
              `${label} — ${member ? member.user : `<@${entry.userId}>`} (\\`${entry.userId}\\`)`,
              `Scans **${entry.appearances}** • Highest score **${entry.maxScore}%**`,
              `First seen ${firstSeen}`,
              `Last seen ${lastSeen}`,
              entry.signals.length ? `Signals\\n${entry.signals.slice(0, 8).map((signal) => `• ${signal}`).join('\\n')}` : 'Signals • None recorded',
            ].join('\\n');
          }).join('\\n\\n') : [
            '**No persistent account correlations identified.**',
            '',
            'Correlations appear here only when the same suspected-account relationship is observed across multiple Goliath scans.',
            'A heuristic match alone is **not proof** that two Discord accounts share an owner.',
          ].join('\\n');
          const embed = new Discord.EmbedBuilder()
            .setColor(evidence.length ? 0x5865F2 : 0x57F287)
            .setTitle(`🔗 Correlation Evidence • ${target.user.tag}`)
            .setDescription(text.slice(0, 3800))
            .setFooter({ text: evidence.length ? 'Historical correlation only • review scan history before drawing conclusions' : 'No repeated correlation signals recorded' })
            .setTimestamp();"""
          replace_once(interactions, old_view, new_view, 'correlation evidence view')

          legacy = interactions.read_text()
          legacy = legacy.replace(".setLabel('Scan History').setEmoji('🕘')", ".setLabel('History').setEmoji('🕘')")
          legacy = legacy.replace(".setLabel(`Link Evidence (${persistentLinks.length})`.slice(0, 80)).setEmoji('🔗')", ".setLabel(`Correlations (${persistentLinks.length})`.slice(0, 80)).setEmoji('🔗')")
          legacy = legacy.replace(".setLabel('Add Note').setEmoji('📝')", ".setLabel('Notes').setEmoji('📝')")
          interactions.write_text(legacy)
          PY
      - name: Validate source
        run: |
          node --check src/core/administration/mod/intelligence.js
          node --check src/core/administration/mod/interactions.js
          npm run contracts
      - name: Remove one-off workflow
        run: git rm -f .github/workflows/apply-member-intelligence-polish-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit intelligence polish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(mod): improve intelligence controls and correlations'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev

