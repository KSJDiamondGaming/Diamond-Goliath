name: Apply Member Intelligence Polish Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-member-intelligence-polish-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply intelligence control polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def required_replace(path, old, new, label):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'{label} not found in {path}')
              path.write_text(text.replace(old, new, 1))

          intelligence = Path('src/core/administration/mod/intelligence.js')
          interactions = Path('src/core/administration/mod/interactions.js')

          replacements = [
            ("setLabel('Scan History').setEmoji('🕘')", "setLabel('History').setEmoji('🕘')", 'history label'),
            ("setLabel('Network Reputation').setEmoji('🌐')", "setLabel('Network').setEmoji('🌐')", 'network label'),
            ("setLabel(`Link Evidence (${report.persistentLinks?.length || 0})`.slice(0, 80))", "setLabel(`Correlations (${report.persistentLinks?.length || 0})`.slice(0, 80))", 'correlation label'),
            ("setLabel('Add Note').setEmoji('📝')", "setLabel('Notes').setEmoji('📝')", 'notes label'),
            (".setLabel(report.investigation?.watched ? 'Watch: On' : 'Watch: Off')", ".setLabel(report.investigation?.watched ? 'Watch On' : 'Watch Off')", 'watch label'),
            ("`Evidence **${report.persistentLinks?.length || 0}** • Verified Links **${context.confirmedLinks?.length || 0}**`,", "`Correlations **${report.persistentLinks?.length || 0}** • Verified Links **${context.confirmedLinks?.length || 0}**`,", 'investigation wording'),
          ]
          for old, new, label in replacements:
              required_replace(intelligence, old, new, label)

          required_replace(
              intelligence,
              "  if (evidence.length) components.push(new Discord.ActionRowBuilder().addComponents(...evidence));",
              "  if (evidence.length) {\n    const investigationRow = evidence.slice(0, 3);\n    components.push(new Discord.ActionRowBuilder().addComponents(...investigationRow));\n  }",
              'evidence row')
          required_replace(
              intelligence,
              "  const nav = [new Discord.ButtonBuilder().setCustomId(`mod_dashboard:${target.id}:actions`).setLabel('⬅️ Back').setStyle(Discord.ButtonStyle.Secondary)];",
              "  const finalRow = [];\n  if (evidence[3]) finalRow.push(evidence[3]);\n  finalRow.push(new Discord.ButtonBuilder().setCustomId(`mod_dashboard:${target.id}:actions`).setLabel('Back').setEmoji('⬅️').setStyle(Discord.ButtonStyle.Secondary));",
              'navigation row')
          required_replace(
              intelligence,
              "  if (report.access?.cases) nav.push(new Discord.ButtonBuilder().setCustomId(`mod_export_cases:${target.id}`).setLabel('📤 Export').setStyle(Discord.ButtonStyle.Secondary));",
              "  if (report.access?.cases) finalRow.push(new Discord.ButtonBuilder().setCustomId(`mod_export_cases:${target.id}`).setLabel('Export').setEmoji('📤').setStyle(Discord.ButtonStyle.Secondary));",
              'export button')
          required_replace(
              intelligence,
              "  components.push(new Discord.ActionRowBuilder().addComponents(...nav));",
              "  components.push(new Discord.ActionRowBuilder().addComponents(...finalRow));",
              'final row')

          text = interactions.read_text()
          old_start = "  const text = evidence.length ? evidence.map((entry) => {\n    const member = i.guild.members.cache.get(entry.userId);\n    const label = entry.maxScore >= 70 ? '🔴 Strong historical correlation' : '🟠 Possible historical correlation';"
          idx = text.find(old_start)
          if idx < 0:
              raise SystemExit('correlation evidence view start not found')
          end_marker = "    .setTimestamp();"
          end = text.find(end_marker, idx)
          if end < 0:
              raise SystemExit('correlation evidence view end not found')
          end += len(end_marker)
          new_view = """  const text = evidence.length ? evidence.map((entry) => {
            const member = i.guild.members.cache.get(entry.userId);
            const label = entry.maxScore >= 70 ? '🔴 Strong historical correlation' : '🟠 Possible historical correlation';
            const firstSeen = entry.firstSeen ? scanTimestamp(new Date(entry.firstSeen).getTime()) : 'Unknown';
            const lastSeen = entry.lastSeen ? scanTimestamp(new Date(entry.lastSeen).getTime()) : 'Unknown';
            return [
              `${label} — ${member ? member.user : `<@${entry.userId}>`} (\\`${entry.userId}\\`)`,
              `Scans **${entry.appearances}** • Highest score **${entry.maxScore}%**`,
              `First seen ${firstSeen}`,
              `Last seen ${lastSeen}`,
              entry.signals.length ? `Signals\\n${entry.signals.slice(0, 8).map((signal) => `• ${signal}`).join('\\n')}` : 'Signals • None recorded',
            ].join('\\n');
          }).join('\\n\\n') : [
            '**No persistent account correlations identified.**',
            '',
            'Correlations appear here only when the same suspected-account relationship is observed across multiple Goliath scans.',
            'A heuristic match alone is **not proof** that two Discord accounts share an owner.',
          ].join('\\n');
          const embed = new Discord.EmbedBuilder()
            .setColor(evidence.length ? 0x5865F2 : 0x57F287)
            .setTitle(`🔗 Correlation Evidence • ${target.user.tag}`)
            .setDescription(text.slice(0, 3800))
            .setFooter({ text: evidence.length ? 'Historical correlation only • review scan history before drawing conclusions' : 'No repeated correlation signals recorded' })
            .setTimestamp();"""
          interactions.write_text(text[:idx] + new_view + text[end:])

          legacy = interactions.read_text()
          legacy = legacy.replace(".setLabel('Scan History').setEmoji('🕘')", ".setLabel('History').setEmoji('🕘')")
          legacy = legacy.replace(".setLabel(`Link Evidence (${persistentLinks.length})`.slice(0, 80)).setEmoji('🔗')", ".setLabel(`Correlations (${persistentLinks.length})`.slice(0, 80)).setEmoji('🔗')")
          legacy = legacy.replace(".setLabel('Add Note').setEmoji('📝')", ".setLabel('Notes').setEmoji('📝')")
          interactions.write_text(legacy)
          PY
      - name: Validate source
        run: |
          node --check src/core/administration/mod/intelligence.js
          node --check src/core/administration/mod/interactions.js
          npm run contracts
      - name: Remove one-off workflow
        run: git rm -f .github/workflows/apply-member-intelligence-polish-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit intelligence polish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(mod): improve intelligence controls and correlations'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
