name: Apply Moderation Navigation Layout Once

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/mod-nav-layout-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply patch
        run: node scripts/mod-nav-layout-once.js
      - name: Validate syntax
        run: node --check src/core/administration/mod/panel.js
      - name: Commit clean source
        run: |
          git config user.name 'KSJHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/mod-nav-layout-once.yml scripts/mod-nav-layout-once.js
          git add src/core/administration/mod/panel.js
          git commit -m 'refactor(mod): standardise final navigation rows'
          git push origin HEAD:dev
