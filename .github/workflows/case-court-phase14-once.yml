name: Case Court Phase 14 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/case-court-phase14.py'
      - '.github/workflows/case-court-phase14-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply Court record history dedupe
        run: python3 .github/case-court-phase14.py
      - name: Validate source
        run: node --check src/core/administration/mod/caseCourt.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: npm run imports
      - name: Remove one-off files before Doctor
        run: rm -f .github/case-court-phase14.py .github/workflows/case-court-phase14-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit Court history dedupe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/administration/mod/caseCourt.js .github
          git diff --cached --quiet && exit 0
          git commit -m 'fix(mod): dedupe court record history'
          git push origin HEAD:dev
