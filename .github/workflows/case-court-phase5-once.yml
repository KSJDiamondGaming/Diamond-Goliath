name: Case Court Phase 5 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/case-court-phase5-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply Case Court sanction execution
        run: python3 .github/case-court-phase5.py
      - name: Validate source
        run: |
          node --check src/core/administration/mod/caseCourt.js
          node --check src/core/administration/mod/punishments.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: node -e "require('./src/core/administration/mod/caseCourt'); require('./src/core/administration/mod/punishments');"
      - name: Remove one-off files before Doctor
        run: rm -f .github/workflows/case-court-phase5-once.yml .github/case-court-phase5.py
      - name: Run Doctor
        run: npm run doctor
      - name: Commit Case Court sanction execution
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(mod): execute approved court sanctions safely'
          git push origin HEAD:dev
