name: Apply Moderator History Redesign Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/mod-history-redesign-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply moderator history redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/core/administration/mod/panel.js')
          s=p.read_text()
          start=s.index('function buildModeratorAnalyticsEmbed(guild, analytics) {')
          end=s.index('\nfunction buildAnalyticsRows(', start)
          new=r'''function buildModeratorAnalyticsEmbed(guild, analytics, currentUserId = null) {
  const appeals = analytics.moderatorAppeals;
  const ownHistory = currentUserId && String(currentUserId) === String(analytics.moderatorId);
  const recentCases = analytics.recentCases.length
    ? analytics.recentCases.map((entry) => {
        const when = getCaseTime(entry);
        return `**#${entry.caseId}** • ${String(entry.action || 'unknown').toUpperCase()} • <@${entry.userId}>\n${getStatusLabel(entry)} • ${timestamp(when, 'f')}`;
      }).join('\n\n')
    : 'No moderation actions in this period.';
  const statuses = analytics.moderatorStatusCounts;
  const totalAppeals = Number(appeals.pending || 0) + Number(appeals.approved || 0) + Number(appeals.denied || 0);
  return createEmbed({
    title: ownHistory ? '👤 My Moderation History' : '👤 Moderator History',
    description: `${ownHistory ? 'Your moderation activity and case history.' : `Moderation activity and case history for <@${analytics.moderatorId}>.`}\n\n**Period:** ${analytics.windowLabel}`,
    color: COLORS.PRIMARY,
    fields: [
      { name: '📁 Cases Handled', value: `Total **${analytics.moderatorCases}** • Active **${statuses.active || 0}** • Reversed **${statuses.reversed || 0}** • Expired **${statuses.expired || 0}**`, inline: false },
      { name: '⚡ Actions Taken', value: `Warnings **${Number(analytics.moderatorActionCounts.warn || 0)}** • Timeouts **${Number(analytics.moderatorActionCounts.timeout || 0)}** • Kicks **${Number(analytics.moderatorActionCounts.kick || 0)}** • Bans **${Number(analytics.moderatorActionCounts.ban || 0)}**`, inline: false },
      { name: '👥 Members Moderated', value: `**${analytics.affectedUsers}**`, inline: true },
      { name: '↩️ Reversal Rate', value: `**${analytics.moderatorReversalRate}**`, inline: true },
      { name: '⚖️ Appeals', value: `**${totalAppeals}**`, inline: true },
      { name: '🕘 Recent Actions', value: recentCases.slice(0, 1024), inline: false },
    ],
    footer: `${guild?.name || 'Server'} • ${analytics.windowLabel.toLowerCase()}`,
  });
}'''
          s=s[:start]+new+s[end:]
          old="embeds.push(buildModeratorAnalyticsEmbed(interaction.guild, getModeratorAnalytics(interaction.guild.id, context.analyticsModeratorId, window)))"
          newcall="embeds.push(buildModeratorAnalyticsEmbed(interaction.guild, getModeratorAnalytics(interaction.guild.id, context.analyticsModeratorId, window), interaction.user?.id || null))"
          if old not in s: raise SystemExit('moderator embed call not found')
          s=s.replace(old,newcall,1)
          oldnav="""    if (canUseModAction(member, guild, 'export_cases')) finalButtons.push(new ButtonBuilder().setCustomId(`mod_export_cases:${returnId}`).setLabel('📤 Export').setStyle(ButtonStyle.Secondary));
    finalButtons.push(new ButtonBuilder()
      .setCustomId(`mod_analytics_refresh:${context.analyticsWindow || '30d'}:${context.analyticsMode || 'overview'}:${context.analyticsModeratorId || 'none'}:${returnId}`)
      .setLabel('🔄 Refresh')
      .setStyle(ButtonStyle.Secondary));"""
          newnav="""    finalButtons.push(new ButtonBuilder()
      .setCustomId(`mod_analytics_refresh:${context.analyticsWindow || '30d'}:${context.analyticsMode || 'overview'}:${context.analyticsModeratorId || 'none'}:${returnId}`)
      .setLabel('🔄 Refresh')
      .setStyle(ButtonStyle.Secondary));
    if (canUseModAction(member, guild, 'export_cases')) finalButtons.push(new ButtonBuilder().setCustomId(`mod_export_cases:${returnId}`).setLabel('📤 Export').setStyle(ButtonStyle.Secondary));"""
          if oldnav not in s: raise SystemExit('analytics nav block not found')
          s=s.replace(oldnav,newnav,1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/mod-history-redesign-once.yml
      - name: Validate source
        run: |
          node --check src/core/administration/mod/panel.js
          npm run doctor
          npm run dashboard:build
      - name: Commit clean source to dev
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/administration/mod/panel.js .github/workflows/mod-history-redesign-once.yml
          git commit -m 'refactor(mod): redesign moderator history' || exit 0
          git push origin HEAD:dev
