name: Case Court Phase 4 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/case-court-phase4-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Case Court phase 4
        run: node scripts/case-court-phase4-once.js
      - name: Validate source
        run: |
          node --check src/core/administration/mod/caseCourt.js
          node --check src/core/administration/mod/cases.js
      - name: Install dependencies
        run: npm ci
      - name: Remove one-off files before Doctor
        run: rm -f .github/workflows/case-court-phase4-once.yml scripts/case-court-phase4-once.js
      - name: Run Doctor
        run: npm run doctor
      - name: Commit Case Court phase 4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(mod): add court safeguards history and appeals'
          git push origin dev
