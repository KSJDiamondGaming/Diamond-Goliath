name: Repair Reaction Roles UTF-8 PR

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/repair-reaction-roles.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair and capture report
        shell: bash
        run: |
          set +e
          node scripts/repair-reaction-roles-utf8.js --write > .github/repair-reaction-roles-report.txt 2>&1
          repair_status=$?
          if [ $repair_status -eq 0 ]; then
            node --check src/modules/roleStudio/reactionRoles/reactionRolesPanel.js >> .github/repair-reaction-roles-report.txt 2>&1
            node scripts/goliath.js source >> .github/repair-reaction-roles-report.txt 2>&1
            node scripts/goliath.js role-studio >> .github/repair-reaction-roles-report.txt 2>&1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/roleStudio/reactionRoles/reactionRolesPanel.js .github/repair-reaction-roles-report.txt
          git commit -m "Capture Reaction Roles UTF-8 repair result"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit $repair_status
