name: Fix Quarantine Role Hierarchy Once

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/fix-quarantine-role-hierarchy-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Apply hierarchy repair
        run: node scripts/fix-quarantine-role-hierarchy-once.js
      - name: Remove one-off patcher before validation
        run: git rm scripts/fix-quarantine-role-hierarchy-once.js
      - name: Validate repair
        run: |
          node --check src/core/security/protection/quarantine.js
          npm run doctor
      - name: Commit repair
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git rm .github/workflows/fix-quarantine-role-hierarchy-once.yml
          git add src/core/security/protection/quarantine.js
          git commit -m 'fix(security): recover unmanageable quarantine role hierarchy'
          git push origin HEAD:dev
