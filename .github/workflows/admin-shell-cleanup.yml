name: Clean legacy Role Studio compatibility

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/admin-shell-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove stale import and compatibility shim
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const panelPath = 'src/modules/roleStudio/reactionRoles/reactionRolesPanel.js';
          let panel = fs.readFileSync(panelPath, 'utf8');
          const staleImport = /^\s*require\(['"]\.\.\/roleStudioNavigationPatch['"]\);\s*\r?\n/m;
          if (!staleImport.test(panel)) {
            throw new Error('Stale roleStudioNavigationPatch import was not found.');
          }
          panel = panel.replace(staleImport, '');
          if (panel.includes('roleStudioNavigationPatch')) {
            throw new Error('A roleStudioNavigationPatch reference remains in Reaction Roles.');
          }
          fs.writeFileSync(panelPath, panel);

          const testPath = 'tools/role-studio-smoke-test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace(
            "const compatibilityShim = read('src/modules/roleStudio/roleStudioNavigationPatch.js');\n",
            ''
          );
          test = test.replace(
            "assert.ok(entry.includes(\"require('../roleStudioNavigationPatch')\"));",
            "assert.equal(entry.includes('roleStudioNavigationPatch'), false);"
          );
          test = test.replace(/assert\.ok\(compatibilityShim\.includes\('intentionally'\)\);\r?\n/, '');
          test = test.replace(/assert\.equal\(compatibilityShim\.includes\('SERVER_MODULES'\), false\);\r?\n/, '');
          test = test.replace(/assert\.equal\(compatibilityShim\.includes\('splice\('\), false\);\r?\n/, '');
          test = test.replace(
            "assert.deepEqual(load('src/modules/roleStudio/roleStudioNavigationPatch.js'), {});",
            "assert.equal(fs.existsSync(path.join(root, 'src/modules/roleStudio/roleStudioNavigationPatch.js')), false);"
          );
          fs.writeFileSync(testPath, test);
          NODE

          rm -f src/modules/roleStudio/roleStudioNavigationPatch.js

      - name: Verify cleanup
        run: |
          ! grep -R "roleStudioNavigationPatch" src --exclude-dir=node_modules
          node --check src/modules/roleStudio/reactionRoles/reactionRolesPanel.js
          node scripts/goliath.js test role-studio

      - name: Commit cleanup and remove workflow
        run: |
          rm .github/workflows/admin-shell-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/roleStudio/reactionRoles/reactionRolesPanel.js tools/role-studio-smoke-test.js src/modules/roleStudio/roleStudioNavigationPatch.js .github/workflows/admin-shell-cleanup.yml
          git commit -m "Remove legacy Role Studio compatibility shim"
          git push origin HEAD:dev
