name: Canonical Admin navigation cleanup

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/admin-shell-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove legacy Admin shell modules and standardize navigation
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const adminPath = 'src/core/admin/functions/adminPanel.js';
          let admin = fs.readFileSync(adminPath, 'utf8');

          // Finish the legacy shell cleanup when the old blocks are still present.
          admin = admin
            .replace(/\nconst MODULES = \[[\s\S]*?\n\];\n\nconst COMING_SOON = \{[\s\S]*?\n\};\n/, '\n')
            .replace(/\nfunction getAutoRolesConfig\(guildId\) \{[\s\S]*?\n\}\n/, '\n')
            .replace(/\nfunction buildModulesPanel\([\s\S]*?\n\}\n\nfunction buildLogsPanel/, '\nfunction buildLogsPanel')
            .replace(/\nfunction buildAutoRolesPanel\([\s\S]*?\n\}\n\nfunction buildChannelPanel/, '\nfunction buildChannelPanel')
            .replace("    'admin:autoRoles': 'Join Roles',\n", '')
            .replace("  if (route === 'admin:modules') return buildModulesPanel(guild, memberDisplayName, navState);\n", '')
            .replace("  if (route === 'admin:autoRoles') return buildAutoRolesPanel(guild, memberDisplayName, navState);\n", '')
            .replace(/\n  if \(COMING_SOON\[route\]\) \{[\s\S]*?\n  \}\n/, '\n')
            .replace(/\n    'admin:autoRoles:select': \{[\s\S]*?\n    \},/, '')
            .replace(/\n  if \(selected\.mergeExisting\) \{[\s\S]*?\n  \} else \{\n    replaceGuildSection\(interaction\.guild\.id, selected\.section, \{\n      roleIds: safeValues\(interaction\),\n    \}\);\n  \}/, "\n  replaceGuildSection(interaction.guild.id, selected.section, {\n    roleIds: safeValues(interaction),\n  });")
            .replace(/\n  if \(customId === 'admin:autoRoles:toggle'\) \{[\s\S]*?\n  \}\n\n  if \(\n    customId === 'admin:adminpanel'/, "\n  if (customId === 'admin:tickets') {\n    const { sendSetupPanel } = require('../../modules/tickets/ticketSetupPanel');\n    return sendSetupPanel(interaction);\n  }\n\n  if (\n    customId === 'admin:adminpanel'")
            .replace("    customId === 'admin:modules' ||\n", '')
            .replace("    customId === 'admin:autoRoles' ||\n", '')
            .replace("    customId === 'admin:adminsettings' ||\n    COMING_SOON[customId]\n", "    customId === 'admin:adminsettings'\n")
            .replace('  buildModulesPanel,\n', '')
            .replace('  buildAutoRolesPanel,\n', '');

          fs.writeFileSync(adminPath, admin);

          // Every module-level return button uses the same user-facing label.
          const navigationFiles = [
            'src/core/admin/functions/moduleAdminPanels.js',
            'src/modules/polls/pollsPanel.js',
            'src/modules/roleStudio/roleStudioPanel.js',
            'src/modules/welcome/welcomePanel.js',
            'src/modules/goodbye/goodbyePanel.js',
            'src/modules/verification/verificationPanel.js',
            'src/modules/social/socialPanel.js',
            'src/modules/invites/invitesAdminPanel.js',
            'src/modules/roleStudio/autoRoles/autoRolesPanel.js',
            'src/modules/roleStudio/reactionRoles/reactionRolesPanel.js',
          ];

          for (const file of navigationFiles) {
            if (!fs.existsSync(file)) throw new Error(`Navigation file missing: ${file}`);
            let source = fs.readFileSync(file, 'utf8');
            source = source
              .replaceAll("'⬅️ Modules'", "'⬅️ Back'")
              .replaceAll("'🏠 Admin Home'", "'⬅️ Back'");
            fs.writeFileSync(file, source);
          }

          const modulesPath = 'src/core/admin/functions/moduleAdminPanels.js';
          const modules = fs.readFileSync(modulesPath, 'utf8');
          if (!modules.includes("button('admin:home', '⬅️ Back', ButtonStyle.Secondary)")) {
            throw new Error('The Modules page does not expose the standard Back button.');
          }

          for (const file of navigationFiles.slice(1)) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes('admin:modules')) {
              throw new Error(`Module does not return to the canonical module list: ${file}`);
            }
          }

          const forbidden = [
            'const MODULES =',
            'const COMING_SOON =',
            'function buildModulesPanel',
            'function buildAutoRolesPanel',
            'function getAutoRolesConfig',
            "admin:autoRoles:toggle",
            "admin:autoRoles:select",
            'COMING_SOON[',
          ];

          const finalAdmin = fs.readFileSync(adminPath, 'utf8');
          for (const token of forbidden) {
            if (finalAdmin.includes(token)) throw new Error(`Legacy Admin token remains: ${token}`);
          }
          NODE

      - name: Verify syntax and canonical routing
        run: |
          node --check src/core/admin/functions/adminPanel.js
          node --check src/core/admin/functions/moduleAdminPanels.js
          node --check src/modules/polls/pollsPanel.js
          node --check src/modules/roleStudio/roleStudioPanel.js
          node --check src/modules/welcome/welcomePanel.js
          node --check src/modules/goodbye/goodbyePanel.js
          node --check src/modules/verification/verificationPanel.js
          node --check src/modules/social/socialPanel.js
          node --check src/modules/invites/invitesAdminPanel.js
          node scripts/goliath.js test role-studio

      - name: Remove migration trigger and commit
        run: |
          rm .github/workflows/admin-shell-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/admin-shell-cleanup.yml
          git commit -m "Standardize Admin module back navigation"
          git push origin HEAD:dev
