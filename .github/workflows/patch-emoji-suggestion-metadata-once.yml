name: Patch Emoji Suggestion Metadata Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-emoji-suggestion-metadata-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preserve animated identity in shortcode suggestions
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('fs');
          const path = 'src/modules/utilityStudio/emojis/emojiStudioService.js';
          let source = fs.readFileSync(path, 'utf8');
          const from = "      output.push({ name: key, shortcode: `:${key}:`, emojiId: String(emoji.id), core: emoji.core === true, category: emoji.category, tags: emoji.tags });";
          const to = "      output.push({ name: key, shortcode: `:${key}:`, emojiId: String(emoji.id), core: emoji.core === true, animated: Boolean(emoji.animated), category: emoji.category, tags: emoji.tags });";
          if (!source.includes(from)) throw new Error('Missing shortcode suggestion projection anchor.');
          source = source.replace(from, to);
          fs.writeFileSync(path, source);
          NODE

      - name: Validate changed source
        run: node --check src/modules/utilityStudio/emojis/emojiStudioService.js

      - name: Remove temporary workflow
        run: rm -f .github/workflows/patch-emoji-suggestion-metadata-once.yml

      - name: Run project doctor
        run: npm run doctor

      - name: Commit clean feature
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(emojis): preserve animated suggestion metadata'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
