name: Patch embed media once

on:
  push:
    branches: [dev]
    paths: [.patch-embed-media-trigger]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Patch Embed Studio send paths
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('src/modules/messageStudio/embed/embedInteractions.js')
          text = path.read_text(encoding='utf-8')

          old_import = "const panel = require('./embedPreviewCompat');"
          new_import = old_import + "\nconst { prepareEmbedMedia } = require('./embedMediaLayout');"
          if old_import not in text:
              raise SystemExit('Embed preview import not found')
          if "require('./embedMediaLayout')" not in text:
              text = text.replace(old_import, new_import, 1)

          old_test = "if (i.customId === 'embed:test-send') {\n      await i.reply({"
          new_test = "if (i.customId === 'embed:test-send') {\n      const media = await prepareEmbedMedia(buildPreviewEmbeds(s, i));\n      await i.reply({"
          if old_test not in text:
              raise SystemExit('Test-send block not found')
          text = text.replace(old_test, new_test, 1)

          old_try = "      try {\n        payload = {"
          new_try = "      try {\n        const media = await prepareEmbedMedia(buildPreviewEmbeds(s, i));\n        payload = {"
          if text.count(old_try) != 2:
              raise SystemExit(f'Expected 2 payload try blocks, found {text.count(old_try)}')
          text = text.replace(old_try, new_try)

          old_embeds = "          embeds: buildPreviewEmbeds(s, i),"
          new_embeds = "          embeds: media.embeds,\n          files: media.files,"
          if text.count(old_embeds) != 3:
              raise SystemExit(f'Expected 3 embed payloads, found {text.count(old_embeds)}')
          text = text.replace(old_embeds, new_embeds)

          path.write_text(text, encoding='utf-8')
          Path('.patch-embed-media-trigger').unlink(missing_ok=True)
          Path('.github/workflows/patch-embed-media-once.yml').unlink(missing_ok=True)
          PY

          node --check src/modules/messageStudio/embed/embedInteractions.js
          node --check src/modules/messageStudio/embed/embedMediaLayout.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use full-width centred media attachments in Embed Studio"
          git push origin HEAD:dev
