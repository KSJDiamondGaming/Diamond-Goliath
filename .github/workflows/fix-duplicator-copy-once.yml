name: Fix Duplicator Copy Failures Once

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/fix-duplicator-copy-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Patch Duplicator copy engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/owner/dev/duplicatorV2.js')
          s = p.read_text()
          anchor = 'function uniqueName('
          if 'function duplicatorCreateChannelType(' not in s:
              helper = "function duplicatorCreateChannelType(type) { const supported = new Set([ChannelType.GuildText, ChannelType.GuildVoice, ChannelType.GuildCategory, ChannelType.GuildAnnouncement, ChannelType.GuildStageVoice, ChannelType.GuildForum, ChannelType.GuildMedia]); return supported.has(type) ? type : ChannelType.GuildText; }\n"
              if anchor not in s: raise SystemExit('uniqueName anchor not found')
              s = s.replace(anchor, helper + anchor, 1)
          old = "function channelPayload(channel, parentId = null, name = null) { const payload = { name: name || channel.name, type: channel.type, reason: 'Goliath duplicator: channel' };"
          new = "function channelPayload(channel, parentId = null, name = null) { const payload = { name: name || channel.name, type: duplicatorCreateChannelType(channel.type), reason: 'Goliath duplicator: channel' };"
          if old in s: s = s.replace(old, new, 1)
          elif new not in s: raise SystemExit('channelPayload anchor not found')
          old_role = "const created = await guild.roles.create({ name, colors: { primaryColor: Number(role.color || 0) }, hoist: Boolean(role.hoist), mentionable: Boolean(role.mentionable), permissions: safeRolePermissions(guild, role.permissions, role.name, log), reason: 'Goliath duplicator: role' }); maps.roles.set(role.id, created.id);"
          new_role = "let created; const requestedPermissions = safeRolePermissions(guild, role.permissions, role.name, log); try { created = await guild.roles.create({ name, colors: { primaryColor: Number(role.color || 0) }, hoist: Boolean(role.hoist), mentionable: Boolean(role.mentionable), permissions: requestedPermissions, reason: 'Goliath duplicator: role' }); } catch (error) { if (Number(error?.code) !== 50013) throw error; created = await guild.roles.create({ name, colors: { primaryColor: Number(role.color || 0) }, hoist: Boolean(role.hoist), mentionable: Boolean(role.mentionable), permissions: new PermissionsBitField(0n), reason: 'Goliath duplicator: role (permission-safe retry)' }); log.notes.push(`Role ${role.name}: created with permissions stripped because Discord rejected source permissions.`); } maps.roles.set(role.id, created.id);"
          if old_role in s: s = s.replace(old_role, new_role, 1)
          elif new_role not in s: raise SystemExit('role creation anchor not found')
          p.write_text(s)
          PY
      - name: Validate source
        run: node --check src/owner/dev/duplicatorV2.js
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-duplicator-copy-once.yml
      - name: Run project doctor
        run: npm run doctor
      - name: Build project
        run: npm run build
      - name: Commit clean fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(duplicator): recover role and channel copy failures'
          git push origin HEAD:dev
