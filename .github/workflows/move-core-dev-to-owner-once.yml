name: Move core dev tooling to owner once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/move-core-dev-to-owner-once.yml'

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Move owner-only development tooling and update references
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src/owner/dev
          git mv src/core/dev/DevOverrideManager.js src/owner/dev/DevOverrideManager.js
          git mv src/core/dev/duplicator.js src/owner/dev/duplicator.js

          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/commands/admin/testdev.js': [('../../core/dev/DevOverrideManager', '../../owner/dev/DevOverrideManager')],
              'src/server/billing/entitlementManager.js': [('../../core/dev/DevOverrideManager', '../../owner/dev/DevOverrideManager')],
              'src/modules/securityStudio/verificationManager.js': [('../../core/dev/DevOverrideManager', '../../owner/dev/DevOverrideManager')],
              'src/core/security/quarantineSystem.js': [('../dev/DevOverrideManager', '../../owner/dev/DevOverrideManager')],
              'src/core/automod/punishmentEngine.js': [('../dev/DevOverrideManager', '../../owner/dev/DevOverrideManager')],
              'src/core/security/securityCore.js': [('../dev/DevOverrideManager', '../../owner/dev/DevOverrideManager')],
              'src/core/security/goliathPermissionGuard.js': [('../dev/DevOverrideManager', '../../owner/dev/DevOverrideManager')],
              'src/commands/admin/server.js': [('../../core/dev/duplicator', '../../owner/dev/duplicator')],
              'src/events/interactions/interactionCreate.js': [('../../core/dev/duplicator', '../../owner/dev/duplicator')],
              'src/owner/dev/DevOverrideManager.js': [('../security/securityCore', '../../core/security/securityCore')],
              'src/owner/dev/duplicator.js': [('../security/securityCore', '../../core/security/securityCore'), ('../guild/guildManager', '../../core/guild/guildManager'), ('../security/serverBackup', '../../core/security/serverBackup')],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected reference not found in {filename}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          if grep -R --line-number --exclude-dir=.git --exclude='move-core-dev-to-owner-once.yml' -E "core/dev/(DevOverrideManager|duplicator)|\.\./dev/DevOverrideManager" src; then
            echo 'Stale core/dev reference remains.' >&2
            exit 1
          fi

          test -f src/owner/dev/DevOverrideManager.js
          test -f src/owner/dev/duplicator.js
          test ! -e src/core/dev/DevOverrideManager.js
          test ! -e src/core/dev/duplicator.js

          npm run doctor
          npm run build

      - name: Commit verified move and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/move-core-dev-to-owner-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(owner): move dev tooling under owner'
          git push origin HEAD:dev
