name: Repository Cleanup Audit

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/repository-cleanup-audit.trigger

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Remove second-order orphan and verify
        run: |
          rm -f src/dashboard/js/pages/modules/socialProviderStatus.js
          node scripts/goliath.js source
          node scripts/goliath.js dashboard
          node scripts/goliath.js imports
          test ! -e src/core/security/devOwnerHierarchy.js
          test ! -e src/core/security/testModeGuard.js
          test ! -e src/dashboard/js/pages/modules/SocialProviderStatusPanel.jsx
          test ! -e src/dashboard/js/pages/modules/socialProviderStatus.js
      - name: Commit final cleanup
        run: |
          rm -f .github/repository-cleanup-audit.trigger
          rm -f .github/repository-cleanup-audit-report.txt
          rm -f .github/repository-cleanup-post-report.txt
          rm -f .github/workflows/repository-cleanup-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize repository orphan and wrapper cleanup"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
