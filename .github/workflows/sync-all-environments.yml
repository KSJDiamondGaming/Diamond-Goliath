name: Sync Goliath Environments

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-all-environments
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current dev commit
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Resolve manual dev source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          SOURCE_SHA="$(git rev-parse origin/dev)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "Manual sync source: $SOURCE_SHA"

      - name: Align remote beta and production to dev
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin dev beta production
          git cat-file -e "$SOURCE_SHA^{commit}"

          CURRENT_DEV_SHA="$(git rev-parse origin/dev)"
          [ "$CURRENT_DEV_SHA" = "$SOURCE_SHA" ] || {
            echo "DEV moved during manual sync setup: $CURRENT_DEV_SHA != $SOURCE_SHA" >&2
            exit 1
          }

          printf 'manual source: %s\n' "$SOURCE_SHA"

          BETA_OLD="$(git rev-parse origin/beta)"
          PROD_OLD="$(git rev-parse origin/production)"

          git push \
            --force-with-lease=refs/heads/beta:"$BETA_OLD" \
            origin "$SOURCE_SHA:refs/heads/beta"

          git push \
            --force-with-lease=refs/heads/production:"$PROD_OLD" \
            origin "$SOURCE_SHA:refs/heads/production"

          git fetch origin beta production

          BETA_REMOTE="$(git rev-parse origin/beta)"
          PROD_REMOTE="$(git rev-parse origin/production)"

          printf 'beta:       %s\n' "$BETA_REMOTE"
          printf 'production: %s\n' "$PROD_REMOTE"

          [ "$BETA_REMOTE" = "$SOURCE_SHA" ]
          [ "$PROD_REMOTE" = "$SOURCE_SHA" ]

      - name: Deploy beta and production from the same manual dev commit
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 35m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail

            deploy_environment() {
              ENVIRONMENT="$1"

              case "$ENVIRONMENT" in
                beta)
                  APP_DIR="/home/goliath/beta"
                  PM2_NAME="goliath-beta"
                  DEPLOY_SCRIPT="/home/goliath/deploy-beta.sh"
                  ;;
                production)
                  APP_DIR="/home/goliath/production"
                  PM2_NAME="goliath-production"
                  DEPLOY_SCRIPT="/home/goliath/deploy-production.sh"
                  ;;
                *)
                  echo "Unsupported environment: $ENVIRONMENT" >&2
                  return 1
                  ;;
              esac

              echo
              echo "============================================================"
              echo " Deploying $ENVIRONMENT from $EXPECTED_SHA"
              echo "============================================================"

              [ -d "$APP_DIR/.git" ] || {
                echo "Missing Git checkout: $APP_DIR" >&2
                return 1
              }

              cd "$APP_DIR"
              OLD_SHA="$(git rev-parse HEAD 2>/dev/null || true)"

              git fetch --no-tags origin beta production
              REMOTE_SHA="$(git rev-parse "origin/$ENVIRONMENT")"
              [ "$REMOTE_SHA" = "$EXPECTED_SHA" ] || {
                echo "origin/$ENVIRONMENT is $REMOTE_SHA, expected $EXPECTED_SHA" >&2
                return 1
              }

              git checkout -B "$ENVIRONMENT" "origin/$ENVIRONMENT"
              git reset --hard "$EXPECTED_SHA"

              CURRENT_SHA="$(git rev-parse HEAD)"
              CURRENT_TREE="$(git show -s --format=%T HEAD)"
              REMOTE_TREE="$(git show -s --format=%T "origin/$ENVIRONMENT")"

              [ "$CURRENT_SHA" = "$EXPECTED_SHA" ]
              [ "$CURRENT_TREE" = "$REMOTE_TREE" ]
              [ -z "$(git status --porcelain --untracked-files=no)" ] || {
                echo "$ENVIRONMENT tracked worktree is dirty after reset" >&2
                git status --short
                return 1
              }

              NEED_DEPS=false
              if [ ! -d node_modules ]; then
                NEED_DEPS=true
              elif [ -n "$OLD_SHA" ] && git cat-file -e "$OLD_SHA^{commit}" 2>/dev/null; then
                if ! git diff --quiet "$OLD_SHA" "$EXPECTED_SHA" -- package.json package-lock.json npm-shrinkwrap.json; then
                  NEED_DEPS=true
                fi
              else
                NEED_DEPS=true
              fi

              if [ "$NEED_DEPS" = true ]; then
                echo "Installing dependencies with npm ci..."
                npm ci
              else
                echo "Dependencies unchanged; npm ci not required."
              fi

              BOT_MODE="$ENVIRONMENT" npm run doctor

              rm -rf dist
              npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn

              DASHBOARD_ROOT="$(awk '$1 == "rm" && $2 == "-rf" && $3 ~ /^\/var\/www\// { print $3; exit }' "$DEPLOY_SCRIPT" 2>/dev/null || true)"
              case "$DASHBOARD_ROOT" in
                /var/www/*) ;;
                *)
                  echo "Could not determine safe dashboard root from $DEPLOY_SCRIPT" >&2
                  return 1
                  ;;
              esac

              rm -rf "$DASHBOARD_ROOT"
              mkdir -p "$DASHBOARD_ROOT"
              cp -a dist/. "$DASHBOARD_ROOT/"
              nginx -t
              systemctl reload nginx

              BOT_MODE="$ENVIRONMENT" \
                COMMAND_SYNC_DELETE_STALE=true \
                COMMAND_SYNC_UPDATE_EXISTING=true \
                node -e "require('./src/core/commands/syncCommands').syncCommands().then(() => process.exit(0)).catch((error) => { console.error(error); process.exit(1); })"

              pm2 startOrReload ecosystem.config.js --only "$PM2_NAME" --update-env
              sleep 5

              PM2_NAME="$PM2_NAME" APP_DIR="$APP_DIR" ENVIRONMENT="$ENVIRONMENT" node -e "const{execFileSync}=require('node:child_process');const list=JSON.parse(execFileSync('pm2',['jlist'],{encoding:'utf8'}));const processName=process.env.PM2_NAME;const appDir=process.env.APP_DIR;const environment=process.env.ENVIRONMENT;const app=list.find((entry)=>entry.name===processName);if(!app)throw new Error('PM2 process '+processName+' was not found.');const pm2env=app.pm2_env||{};const mode=String(pm2env.BOT_MODE||pm2env.env?.BOT_MODE||'').toLowerCase();if(pm2env.status!=='online')throw new Error(processName+' is '+(pm2env.status||'unknown')+', not online.');if(String(pm2env.pm_cwd||'')!==appDir)throw new Error(processName+' cwd mismatch: '+pm2env.pm_cwd+' != '+appDir);if(mode!==environment)throw new Error(processName+' BOT_MODE mismatch: '+(mode||'unset')+' != '+environment);console.log('✅ '+processName+' online | BOT_MODE='+mode+' | cwd='+pm2env.pm_cwd);"

              FINAL_SHA="$(git rev-parse HEAD)"
              FINAL_TREE="$(git show -s --format=%T HEAD)"
              [ "$FINAL_SHA" = "$EXPECTED_SHA" ]

              echo "✅ $ENVIRONMENT deployment verified"
              echo "   commit: $FINAL_SHA"
              echo "   tree:   $FINAL_TREE"
            }

            deploy_environment beta
            deploy_environment production
            pm2 save

            echo
            echo "============================================================"
            echo " FINAL VPS SOURCE VERIFICATION"
            echo "============================================================"

            DEV_SHA="$(git -C /home/goliath/dev rev-parse HEAD)"
            BETA_SHA="$(git -C /home/goliath/beta rev-parse HEAD)"
            PROD_SHA="$(git -C /home/goliath/production rev-parse HEAD)"

            DEV_TREE="$(git -C /home/goliath/dev show -s --format=%T HEAD)"
            BETA_TREE="$(git -C /home/goliath/beta show -s --format=%T HEAD)"
            PROD_TREE="$(git -C /home/goliath/production show -s --format=%T HEAD)"

            printf 'DEV        %s | %s\n' "$DEV_SHA" "$DEV_TREE"
            printf 'BETA       %s | %s\n' "$BETA_SHA" "$BETA_TREE"
            printf 'PRODUCTION %s | %s\n' "$PROD_SHA" "$PROD_TREE"

            [ "$BETA_SHA" = "$EXPECTED_SHA" ]
            [ "$PROD_SHA" = "$EXPECTED_SHA" ]
            [ "$BETA_TREE" = "$PROD_TREE" ]

            if [ "$DEV_SHA" = "$EXPECTED_SHA" ]; then
              [ "$DEV_TREE" = "$BETA_TREE" ]
              echo "✅ DEV/BETA/PRODUCTION VPS checkouts are on the same manual sync commit and tracked tree."
            else
              echo "ℹ️ DEV is now at $DEV_SHA."
              echo "✅ BETA/PRODUCTION remain verified on the manually selected DEV snapshot $EXPECTED_SHA."
            fi
