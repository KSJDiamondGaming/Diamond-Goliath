name: Apply Admin Management Cleanup

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply management cleanup
        run: python scripts/admin-management-cleanup-temp.py
      - name: Verify syntax
        run: |
          node -c src/core/administration/mod/panel.js
          node -c src/core/administration/mod/interactions.js
      - name: Commit management cleanup
        run: |
          rm .github/workflows/admin-management-cleanup.yml
          rm scripts/admin-management-cleanup-temp.py
          git config user.name "KSJ Hub"
          git config user.email "sycomorgan@gmail.com"
          git add src/core/administration/mod/panel.js src/core/administration/mod/interactions.js .github/workflows/admin-management-cleanup.yml scripts/admin-management-cleanup-temp.py
          git commit -m "refactor(mod): clean management workspace controls"
          git push origin dev
