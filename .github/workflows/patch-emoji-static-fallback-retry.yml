name: Patch Emoji Static Fallback Retry

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-emoji-static-fallback-retry.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply opt-in static fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          media_path = Path('src/modules/utilityStudio/emojis/emojiMedia.js')
          media = media_path.read_text()
          old_label = """function mediaTypeLabel(result) {
            if (!result?.animated) return 'Static';
            const format = String(result.originalFormat || result.format || '').toLowerCase();
            const label = format === 'png' ? 'APNG' : format === 'webp' ? 'WebP' : format === 'avif' ? 'AVIF' : format === 'gif' ? 'GIF' : '';
            return label ? `Animated ${label}` : 'Animated';
          }
          """
          new_label = """function mediaTypeLabel(result) {
            const format = String(result?.originalFormat || result?.format || '').toLowerCase();
            const label = format === 'png' ? 'APNG' : format === 'webp' ? 'WebP' : format === 'avif' ? 'AVIF' : format === 'gif' ? 'GIF' : '';
            if (result?.staticFallback) return label ? `Static fallback from Animated ${label}` : 'Static fallback from animation';
            if (!result?.animated) return 'Static';
            return label ? `Animated ${label}` : 'Animated';
          }
          """
          if old_label not in media: raise SystemExit('mediaTypeLabel anchor missing')
          media = media.replace(old_label, new_label, 1)

          prepare_anchor = "async function prepareAnimatedEmoji(source, metadata, options = {}) {\n"
          if prepare_anchor not in media: raise SystemExit('prepareAnimatedEmoji anchor missing')
          helper = """async function prepareStaticFallback(sharp, source, metadata, safety, options = {}) {
            const firstFrame = await sharp(source, { page: 0, pages: 1, limitInputPixels: MAX_DECODED_PIXELS }).png().toBuffer();
            const prepared = await emojiProcessor.prepareEmojiBuffer(firstFrame, options);
            return {
              ...prepared,
              animated: false,
              animationPreserved: false,
              staticFallback: true,
              originalAnimated: true,
              originalFormat: metadata?.format || null,
              originalBytes: source.length,
              bytes: prepared.buffer?.length || prepared.bytes || firstFrame.length,
              originalWidth: safety.width || Number(metadata?.width) || null,
              originalHeight: safety.height || frameHeight(metadata) || null,
              width: prepared.size || safety.width || null,
              height: prepared.size || safety.height || null,
              pages: 1,
              sourcePages: safety.pages,
              durationMs: safety.durationMs,
              warning: 'Animation was intentionally flattened to its first frame by management choice.',
            };
          }

          """
          media = media.replace(prepare_anchor, helper + prepare_anchor, 1)
          safety_anchor = "  const safety = inspectSafety(metadata, source.length, options);\n\n"
          if safety_anchor not in media: raise SystemExit('safety anchor missing')
          media = media.replace(safety_anchor, safety_anchor + "  if (options.forceStaticFallback === true) {\n    return prepareStaticFallback(sharp, source, metadata, safety, options);\n  }\n\n", 1)
          media_path.write_text(media)

          api_path = Path('src/modules/utilityStudio/emojis/emojisApi.js')
          api = api_path.read_text()
          api_anchor = "    maxSourceBytes: options.maxSourceBytes || MAX_SOURCE_BYTES,\n"
          if api_anchor not in api: raise SystemExit('API maxSourceBytes anchor missing')
          api = api.replace(api_anchor, api_anchor + "    forceStaticFallback: options.forceStaticFallback === true,\n", 1)
          api_path.write_text(api)

          panel_path = Path('src/modules/utilityStudio/emojis/emojisPanel.js')
          panel = panel_path.read_text()
          bulk_modal = "function bulkUploadModal() { const upload = new FileUploadBuilder().setCustomId('files').setMinValues(1).setMaxValues(10).setRequired(true); return new ModalBuilder().setCustomId('admin:module:emojis:bulk-submit').setTitle('Upload Images & GIFs').addComponents(new LabelBuilder().setLabel('Choose emoji files').setDescription('Upload up to 10 images or GIFs. Goliath will optimise them automatically.').setFileUploadComponent(upload)); }\n"
          if bulk_modal not in panel: raise SystemExit('bulk modal anchor missing')
          panel = panel.replace(bulk_modal, bulk_modal + "function staticFallbackUploadModal() { const upload = new FileUploadBuilder().setCustomId('files').setMinValues(1).setMaxValues(10).setRequired(true); return new ModalBuilder().setCustomId('admin:module:emojis:static-fallback-submit').setTitle('Static Fallback Upload').addComponents(new LabelBuilder().setLabel('Choose failed animated files').setDescription('Explicit fallback: Goliath will keep the first frame and remove animation.').setFileUploadComponent(upload)); }\n", 1)

          open_line = "  if (id === 'admin:module:emojis:bulk-open') { await interaction.showModal(bulkUploadModal()); return true; }\n"
          if open_line not in panel: raise SystemExit('bulk-open anchor missing')
          panel = panel.replace(open_line, open_line + "  if (id === 'admin:module:emojis:static-fallback-open') { await interaction.showModal(staticFallbackUploadModal()); return true; }\n", 1)

          counter = "    let animated = 0; let optimised = 0; let failed = 0;\n"
          if counter not in panel: raise SystemExit('bulk counters anchor missing')
          panel = panel.replace(counter, "    let animated = 0; let optimised = 0; let failed = 0; let fallbackEligible = 0;\n", 1)

          error_line = "        lines.push(`❌ **${attachment.name}** — ${String(error?.message || error).slice(0, 160)}`);\n"
          if error_line not in panel: raise SystemExit('bulk error line missing')
          panel = panel.replace(error_line, "        const message = String(error?.message || error);\n        if (message.includes('without flattening the animation')) fallbackEligible += 1;\n        lines.push(`❌ **${attachment.name}** — ${message.slice(0, 160)}${message.includes('without flattening the animation') ? ' • static fallback available below' : ''}`);\n", 1)

          reply_line = "    await interaction.editReply({ embeds: [new EmbedBuilder().setColor(failed ? 0xFEE75C : 0x57F287).setTitle('📤 Upload Complete').setDescription(`${summary}\\n\\n${lines.join('\\n')}`.slice(0, 4000))], components: [row(button('admin:module:emojis:guild', '⭐ Manage Emojis', ButtonStyle.Primary)), row(button('admin:module:emojis:add', '⬅️ Back', ButtonStyle.Secondary))] });\n"
          if reply_line not in panel: raise SystemExit('bulk reply line missing')
          reply_new = "    const components = [];\n    if (fallbackEligible) components.push(row(button('admin:module:emojis:static-fallback-open', '🖼️ Use Static Fallback', ButtonStyle.Secondary)));\n    components.push(row(button('admin:module:emojis:guild', '⭐ Manage Emojis', ButtonStyle.Primary)));\n    components.push(row(button('admin:module:emojis:add', '⬅️ Back', ButtonStyle.Secondary)));\n    await interaction.editReply({ embeds: [new EmbedBuilder().setColor(failed ? 0xFEE75C : 0x57F287).setTitle('📤 Upload Complete').setDescription(`${summary}\\n\\n${lines.join('\\n')}`.slice(0, 4000))], components });\n"
          panel = panel.replace(reply_line, reply_new, 1)

          health = "  if (id === 'admin:module:emojis:health') {"
          if health not in panel: raise SystemExit('health anchor missing')
          handler = """  if (id === 'admin:module:emojis:static-fallback-submit' && interaction.isModalSubmit?.()) {
            const uploads = interaction.fields.getUploadedFiles('files', true);
            await interaction.deferReply({ flags: MessageFlags.Ephemeral });
            const lines = [];
            let added = 0; let failed = 0;
            for (const attachment of uploads.values()) {
              try {
                const prepared = await emojiApi.prepareAttachmentAsset(attachment, { forceStaticFallback: true });
                const name = String(attachment.name || 'emoji').replace(/\.[a-z0-9]+$/i, '');
                const result = await emojis.createStudioEmoji(interaction.client, prepared.buffer, name);
                emojiStore.setFavourite(guildId, result.emoji.id, true, { actorId: interaction.user?.id, action: 'emoji_static_fallback_import' });
                added += 1;
                lines.push(`✅ ${result.emoji.mention || `:${result.emoji.name}:`} **${attachment.name}** — ${emojiMedia.processingSummary(prepared)} • animation removed by explicit choice`);
              } catch (error) {
                failed += 1;
                lines.push(`❌ **${attachment.name}** — ${String(error?.message || error).slice(0, 180)}`);
              }
            }
            await interaction.editReply({ embeds: [new EmbedBuilder().setColor(failed ? 0xFEE75C : 0x57F287).setTitle('🖼️ Static Fallback Complete').setDescription(`**${added} added as static** • **${failed} failed**\n\n${lines.join('\n')}`.slice(0, 4000)).setFooter({ text: 'Static fallback uses the first animation frame only.' })], components: [row(button('admin:module:emojis:guild', '⭐ Manage Emojis', ButtonStyle.Primary)), row(button('admin:module:emojis:add', '⬅️ Back', ButtonStyle.Secondary))] });
            return true;
          }
          """
          panel = panel.replace(health, handler + health, 1)
          panel_path.write_text(panel)
          PY
      - name: Validate changed source
        run: |
          node --check src/modules/utilityStudio/emojis/emojiMedia.js
          node --check src/modules/utilityStudio/emojis/emojisApi.js
          node --check src/modules/utilityStudio/emojis/emojisPanel.js
      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/patch-emoji-static-fallback-once.yml
          rm -f .github/workflows/patch-emoji-static-fallback-retry.yml
      - name: Run project doctor
        run: npm run doctor
      - name: Commit clean feature
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(emojis): add opt-in static animation fallback'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
