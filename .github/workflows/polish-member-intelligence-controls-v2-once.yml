name: Polish Member Intelligence Controls V2 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/polish-member-intelligence-controls-v2-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply control polish
        run: python3 scripts/polish-member-intelligence-controls-once.py
      - name: Validate source
        run: |
          node --check src/core/administration/mod/intelligence.js
          node --check src/core/administration/mod/interactions.js
          npm run contracts
      - name: Remove one-off files
        run: |
          rm -f .github/workflows/polish-member-intelligence-controls-once.yml
          git rm -f .github/workflows/polish-member-intelligence-controls-v2-once.yml
          git rm -f scripts/polish-member-intelligence-controls-once.py
      - name: Run Doctor
        run: npm run doctor
      - name: Commit polished controls
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(mod): improve intelligence button layout and correlations'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
