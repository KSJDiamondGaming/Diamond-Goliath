name: Refine Member Intelligence Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/refine-member-intelligence-once.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refine Member Intelligence panel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/core/administration/mod/intelligence.js')
          text = path.read_text()

          old = '''  setOrReplaceField(report.embed, '🚦 Status & Risk', [
            `Risk **${context.risk.score}/100 • ${context.risk.label}**`,
            `Watchlist **${watchConfig.emoji} ${watchConfig.label}** • Active Cases **${localSummary.activeCases}** • Warnings **${localSummary.warningCount}**`,
            `Network **${history.length}** observed guild(s) • External ${externalSummary}`,
          ].join('\\n'));

          setOrReplaceField(report.embed, '👤 Member', [
            `Username **${target.user.username}** • Display **${target.displayName || target.user.username}**`,
            `Created ${discordTime(target.user.createdAt || target.user.createdTimestamp, 'F')} • Joined ${discordTime(target.joinedAt || target.joinedTimestamp, 'F')}`,
            `Roles **${roles.length}** • Elevated permissions **${elevated.length ? elevated.join(', ') : 'None'}**`,
            `Timeout **${target.communicationDisabledUntilTimestamp ? discordTime(target.communicationDisabledUntilTimestamp, 'R') : 'None'}**`,
          ].join('\\n'));
'''
          new = '''  const riskLines = [
            `Risk **${context.risk.score}/100 • ${context.risk.label}**`,
            `Watchlist **${watchConfig.emoji} ${watchConfig.label}** • Active Cases **${localSummary.activeCases}** • Warnings **${localSummary.warningCount}**`,
          ];
          if (context.risk.reasons?.length) {
            riskLines.push(`Risk factors ${context.risk.reasons.slice(0, 4).map((item) => `**+${item.points}** ${item.reason}`).join(' • ')}`);
          } else {
            riskLines.push('Risk factors **No verified risk factors**');
          }
          setOrReplaceField(report.embed, '🚦 Status & Risk', riskLines.join('\\n'));

          const identity = context.identity || {};
          const currentIdentityValues = new Set([
            target.user.username,
            target.user.globalName,
            target.displayName,
          ].filter(Boolean).map((value) => String(value)));
          const knownIdentityValues = new Set([
            ...(identity.usernames || []),
            ...(identity.globalNames || []),
            ...(identity.displayNames || []),
          ].filter(Boolean).map((value) => String(value)));
          const previousIdentityValues = [...knownIdentityValues].filter((value) => !currentIdentityValues.has(value));
          const identityEventCount = Array.isArray(identity.events) ? identity.events.length : 0;
          const identityStatus = previousIdentityValues.length
            ? `**${previousIdentityValues.length} previous name value(s)** • ${identityEventCount} recorded event(s)`
            : '**No recorded identity changes**';

          setOrReplaceField(report.embed, '👤 Member', [
            `Username **${target.user.username}** • Display **${target.displayName || target.user.username}**`,
            `Created ${discordTime(target.user.createdAt || target.user.createdTimestamp, 'F')} • Joined ${discordTime(target.joinedAt || target.joinedTimestamp, 'F')}`,
            `Roles **${roles.length}** • Elevated permissions **${elevated.length ? elevated.join(', ') : 'None'}**`,
            `Timeout **${target.communicationDisabledUntilTimestamp ? discordTime(target.communicationDisabledUntilTimestamp, 'R') : 'None'}**`,
            `Identity ${identityStatus}`,
          ].join('\\n'));
'''
          if old not in text:
              raise SystemExit('status/member block not found; refusing unsafe patch')
          text = text.replace(old, new, 1)

          old = '''  setOrReplaceField(report.embed, '🧠 Intelligence Summary', [
            `Network **${history.length}** observed • **${currentGuilds}** current • **${formerGuilds}** former • Cross-guild cases **${context.network?.caseCount || 0}**`,
            `External **${reputation.verifiedExternal || 0}** verified • **${reputation.submitted || 0}** submitted • **${reputation.unverified || 0}** unverified`,
            `Behaviour **${String(behavior.trend || 'stable').toUpperCase()}** • 30d **${behavior.windows?.d30?.total || 0}** case(s)`,
          ].join('\\n'));
'''
          new = '''  const behaviourTrend = String(behavior.trend || 'stable').toLowerCase();
          const behaviourIcon = behaviourTrend === 'increasing' ? '🟠' : behaviourTrend === 'decreasing' ? '🟢' : '🟢';
          setOrReplaceField(report.embed, '🌐 Network & Behaviour', [
            `Observed guilds **${history.length}** • Current **${currentGuilds}** • Former **${formerGuilds}** • Cross-guild cases **${context.network?.caseCount || 0}**`,
            `External **${reputation.verifiedExternal || 0} verified** • **${reputation.submitted || 0} submitted** • **${reputation.unverified || 0} unverified**`,
            `Behaviour ${behaviourIcon} **${behaviourTrend.toUpperCase()}** • **${behavior.windows?.d30?.total || 0} cases / 30d**`,
          ].join('\\n'));
'''
          if old not in text:
              raise SystemExit('intelligence summary block not found; refusing unsafe patch')
          text = text.replace(old, new, 1)

          old = '''  primary.push(
            new Discord.ButtonBuilder().setCustomId(`mod_intel_guilds:${target.id}`).setLabel('Network Reputation').setEmoji('🌐').setStyle(Discord.ButtonStyle.Secondary),
            new Discord.ButtonBuilder().setCustomId(`mod_intel_risk:${target.id}`).setLabel('Risk Details').setEmoji('📈').setStyle(Discord.ButtonStyle.Secondary),
          );
          components.push(new Discord.ActionRowBuilder().addComponents(...primary));

          const evidence = [
            new Discord.ButtonBuilder().setCustomId(`mod_intel_identity:${target.id}`).setLabel('Identity History').setEmoji('🪪').setStyle(Discord.ButtonStyle.Secondary),
            new Discord.ButtonBuilder().setCustomId(`mod_intel_behavior:${target.id}`).setLabel('Behaviour').setEmoji('📊').setStyle(Discord.ButtonStyle.Secondary),
          ];
          if (report.access?.links) evidence.push(new Discord.ButtonBuilder().setCustomId(`mod_scan_links:${target.id}`).setLabel(`Link Evidence (${report.persistentLinks?.length || 0})`.slice(0, 80)).setEmoji('🔗').setStyle(Discord.ButtonStyle.Secondary));
          if (report.access?.notes) evidence.push(new Discord.ButtonBuilder().setCustomId(`mod_scan_note:${target.id}`).setLabel('Add Note').setEmoji('📝').setStyle(Discord.ButtonStyle.Secondary));
          components.push(new Discord.ActionRowBuilder().addComponents(...evidence));
'''
          new = '''  primary.push(
            new Discord.ButtonBuilder().setCustomId(`mod_intel_guilds:${target.id}`).setLabel('Network Reputation').setEmoji('🌐').setStyle(Discord.ButtonStyle.Secondary),
          );
          components.push(new Discord.ActionRowBuilder().addComponents(...primary));

          const evidence = [];
          if (report.access?.links) evidence.push(new Discord.ButtonBuilder().setCustomId(`mod_scan_links:${target.id}`).setLabel(`Link Evidence (${report.persistentLinks?.length || 0})`.slice(0, 80)).setEmoji('🔗').setStyle(Discord.ButtonStyle.Secondary));
          if (report.access?.notes) evidence.push(new Discord.ButtonBuilder().setCustomId(`mod_scan_note:${target.id}`).setLabel('Add Note').setEmoji('📝').setStyle(Discord.ButtonStyle.Secondary));
          if (report.access?.watch) evidence.push(new Discord.ButtonBuilder()
            .setCustomId(`mod_scan_watch:${target.id}`)
            .setLabel(report.investigation?.watched ? 'Investigation Watch: ON' : 'Investigation Watch: OFF')
            .setEmoji('👁️')
            .setStyle(report.investigation?.watched ? Discord.ButtonStyle.Danger : Discord.ButtonStyle.Secondary));
          evidence.push(new Discord.ButtonBuilder()
            .setCustomId(`mod_intel_watchlist:${target.id}`)
            .setLabel('Watchlist')
            .setEmoji('🛡️')
            .setStyle(watchState === 'blacklisted' ? Discord.ButtonStyle.Danger : Discord.ButtonStyle.Secondary));
          if (evidence.length) components.push(new Discord.ActionRowBuilder().addComponents(...evidence));
'''
          if old not in text:
              raise SystemExit('button block not found; refusing unsafe patch')
          text = text.replace(old, new, 1)

          old = '''  const stateControls = [];
          if (report.access?.watch) stateControls.push(new Discord.ButtonBuilder()
            .setCustomId(`mod_scan_watch:${target.id}`)
            .setLabel(report.investigation?.watched ? 'Investigation Watch: ON' : 'Investigation Watch: OFF')
            .setEmoji('👁️')
            .setStyle(report.investigation?.watched ? Discord.ButtonStyle.Danger : Discord.ButtonStyle.Secondary));
          stateControls.push(new Discord.ButtonBuilder()
            .setCustomId(`mod_intel_watchlist:${target.id}`)
            .setLabel('Watchlist')
            .setEmoji('🛡️')
            .setStyle(watchState === 'blacklisted' ? Discord.ButtonStyle.Danger : Discord.ButtonStyle.Secondary));
          components.push(new Discord.ActionRowBuilder().addComponents(...stateControls));

'''
          if old not in text:
              raise SystemExit('state control block not found; refusing unsafe patch')
          text = text.replace(old, '', 1)

          path.write_text(text)
          PY

      - name: Validate source
        run: |
          node --check src/core/administration/mod/intelligence.js
          npm run doctor
          npm run build --if-present

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/administration/mod/intelligence.js
          git diff --cached --check
          git commit -m "refactor(mod): streamline member intelligence panel"
          git push origin HEAD:dev

      - name: Remove one-shot workflow
        if: success()
        run: |
          git pull --rebase origin dev
          git rm .github/workflows/refine-member-intelligence-once.yml
          git commit -m "chore(mod): remove intelligence refinement helper"
          git push origin HEAD:dev
