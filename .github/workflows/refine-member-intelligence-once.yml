name: Refine Member Intelligence
on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/refine-member-intelligence-once.yml
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch source
        run: python3 scripts/refine-member-intelligence-once.py
      - name: Validate changed surface
        run: |
          node --check src/core/administration/mod/intelligence.js
          npm run contracts
          npm run build --if-present
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/administration/mod/intelligence.js
          git diff --cached --check
          git commit -m "refactor(mod): streamline member intelligence panel"
          git push origin HEAD:dev
