name: Compact Member Intelligence Once
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/compact-member-intelligence-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply compact overview patch
        run: node scripts/compact-member-intelligence-once.js
      - name: Validate changed source
        run: |
          node --check src/core/administration/mod/intelligence.js
          node --check src/core/administration/mod/interactions.js
      - name: Remove temporary patch files
        run: rm -f scripts/compact-member-intelligence-once.js .github/workflows/compact-member-intelligence-once.yml
      - name: Run project doctor
        run: npm run doctor
      - name: Build project
        run: npm run build
      - name: Commit clean feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(mod): compact member intelligence overview'
          git push origin HEAD:dev
