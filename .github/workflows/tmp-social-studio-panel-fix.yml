name: Temporary Social Studio Panel Fix

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/tmp-social-studio-panel-fix.yml

permissions:
  contents: write

jobs:
  fix-social-studio-panel:
    if: ${{ !contains(github.event.head_commit.message, '[social-panel-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch incorrect Social Studio main-panel calls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/modules/socialStudio/socialAlerts/socialStudioPanel.js')
          source = path.read_text(encoding='utf-8')
          old = 'buildMainPanel(i, config)'
          new = 'buildMainPanel(i.guild, who(i))'
          count = source.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 incorrect buildMainPanel calls, found {count}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          print('Patched both Social Studio main-panel calls.')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-social-studio-panel-fix.yml

      - name: Commit fix to dev
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/socialStudio/socialAlerts/socialStudioPanel.js .github/workflows/tmp-social-studio-panel-fix.yml
          git commit -m "fix: correct Social Studio main panel guild context [social-panel-fix]"
          git push origin HEAD:dev
