name: Refine Case Court Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/refine-case-court-once.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Case Court refinement
        run: node scripts/refine-case-court-once.js
      - name: Validate source
        run: node --check src/core/administration/mod/caseCourt.js
      - name: Install dependencies
        run: npm ci
      - name: Run Doctor
        run: npm run doctor
      - name: Remove one-off files
        run: rm -f .github/workflows/refine-case-court-once.yml scripts/refine-case-court-once.js
      - name: Commit Case Court refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat(mod): expand moderation court case workflow'
          git push origin dev
