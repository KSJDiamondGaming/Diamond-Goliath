name: Fix Case Management Exports

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/fix-case-management-exports-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Export court formatting helpers used by case management UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/core/administration/mod/caseCourt.js')
          s = p.read_text()
          old = "module.exports = {\n  COURT_ACTION,\n  parseCourt,"
          new = "module.exports = {\n  COURT_ACTION,\n  stageText,\n  severityText,\n  parseCourt,"
          if old not in s:
              raise SystemExit('caseCourt export anchor not found')
          if '  stageText,\n  severityText,\n  parseCourt,' not in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate exact regression
        run: |
          node - <<'NODE'
          const court = require('./src/core/administration/mod/caseCourt');
          if (typeof court.stageText !== 'function') throw new Error('stageText is not exported');
          if (typeof court.severityText !== 'function') throw new Error('severityText is not exported');
          const ux = require('./src/core/administration/mod/caseManagementUx');
          if (!ux) throw new Error('caseManagementUx failed to import');
          console.log('Case management helper exports are valid.');
          NODE
      - name: Remove diagnostic and one-off workflows before Doctor
        run: |
          rm -f .github/workflows/mod-investigate-diagnostics-once.yml
          rm -f .github/workflows/fix-case-management-exports-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Goliath Actions'
          git config user.email 'goliath-actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(mod): export court helpers for case management UX'
          git pull --rebase origin dev
          git push origin HEAD:dev
