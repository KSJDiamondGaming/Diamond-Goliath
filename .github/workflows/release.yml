name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        required: true
        type: choice
        options:
          - beta
          - production

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release settings
        id: vars
        run: |
          if [ "${{ github.event.inputs.target }}" = "beta" ]; then
            echo "source=dev" >> "$GITHUB_OUTPUT"
            echo "target=beta" >> "$GITHUB_OUTPUT"
            echo "deploy_script=/home/goliath/deploy-beta.sh" >> "$GITHUB_OUTPUT"
          else
            echo "source=beta" >> "$GITHUB_OUTPUT"
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "deploy_script=/home/goliath/deploy-production.sh" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.target }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge source into target
        run: |
          set -e
          git fetch origin ${{ steps.vars.outputs.source }} ${{ steps.vars.outputs.target }}
          git merge origin/${{ steps.vars.outputs.source }} --no-edit
          git push origin HEAD:${{ steps.vars.outputs.target }}

      - name: Deploy target to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: bash ${{ steps.vars.outputs.deploy_script }}