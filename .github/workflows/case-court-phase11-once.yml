name: Case Court Phase 11 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/case-court-phase11.py'
      - '.github/workflows/case-court-phase11-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply Court appeal reversal hardening
        run: python .github/case-court-phase11.py

      - name: Validate source
        run: |
          node --check src/core/administration/mod/cases.js
          node --check src/core/administration/mod/caseCourt.js
          node --check src/core/administration/mod/storage.js

      - name: Install dependencies
        run: npm ci

      - name: Validate imports
        run: |
          node -e "require('./src/core/administration/mod/storage')"
          node -e "require('./src/core/administration/mod/cases')"
          node -e "require('./src/core/administration/mod/caseCourt')"

      - name: Remove one-off files before Doctor
        run: |
          rm -f .github/case-court-phase11.py
          rm -f .github/workflows/case-court-phase11-once.yml

      - name: Run Doctor
        run: npm run doctor

      - name: Commit Court appeal reversal hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Goliath Actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/core/administration/mod/cases.js src/core/administration/mod/caseCourt.js src/core/administration/mod/storage.js .github
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(mod): harden court appeal reversals"
          git push origin HEAD:dev
