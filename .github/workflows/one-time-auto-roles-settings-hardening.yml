name: One-time Auto Roles settings hardening
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-auto-roles-settings-hardening.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Harden settings schema
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/modules/roleStudio/autoRoles/autoRoles.js')
          text = path.read_text()
          old = """    settings: {\n      ...base.settings,\n      ...(source.settings && typeof source.settings === 'object' ? clone(source.settings) : {}),\n      applyToBots: source.settings?.applyToBots === true,\n      auditLog: source.settings?.auditLog !== false,\n      reapplyOnStartup: source.settings?.reapplyOnStartup === true,\n      ignoreExistingRoles: source.settings?.ignoreExistingRoles !== false,\n    },"""
          new = """    settings: {\n      applyToBots: source.settings?.applyToBots === true,\n      auditLog: source.settings?.auditLog !== false,\n      reapplyOnStartup: source.settings?.reapplyOnStartup === true,\n      ignoreExistingRoles: source.settings?.ignoreExistingRoles !== false,\n    },"""
          if old not in text:
              raise SystemExit('normalize settings block not found')
          text = text.replace(old, new, 1)
          old2 = """    settings: {\n      ...(section.settings || {}),\n      ...input,\n      applyToBots: typeof input.applyToBots === 'boolean' ? input.applyToBots : section.settings?.applyToBots === true,\n      auditLog: typeof input.auditLog === 'boolean' ? input.auditLog : section.settings?.auditLog !== false,\n      reapplyOnStartup: typeof input.reapplyOnStartup === 'boolean' ? input.reapplyOnStartup : section.settings?.reapplyOnStartup === true,\n      ignoreExistingRoles: typeof input.ignoreExistingRoles === 'boolean' ? input.ignoreExistingRoles : section.settings?.ignoreExistingRoles !== false,\n    },"""
          new2 = """    settings: {\n      applyToBots: typeof input.applyToBots === 'boolean' ? input.applyToBots : section.settings?.applyToBots === true,\n      auditLog: typeof input.auditLog === 'boolean' ? input.auditLog : section.settings?.auditLog !== false,\n      reapplyOnStartup: typeof input.reapplyOnStartup === 'boolean' ? input.reapplyOnStartup : section.settings?.reapplyOnStartup === true,\n      ignoreExistingRoles: typeof input.ignoreExistingRoles === 'boolean' ? input.ignoreExistingRoles : section.settings?.ignoreExistingRoles !== false,\n    },"""
          if old2 not in text:
              raise SystemExit('update settings block not found')
          path.write_text(text.replace(old2, new2, 1))

          smoke = Path('tools/role-studio-smoke-test.js')
          s = smoke.read_text()
          anchor = "assert.strictEqual(typeof autoRoles.setAutoRolesEnabled, 'function', 'Auto Roles synchronized enable API is missing.');"
          assertion = "\nassert.deepStrictEqual(\n  Object.keys(autoRoles.normalizeAutoRolesSection({ settings: { applyToBots: true, unsupported: true } }).settings).sort(),\n  ['applyToBots', 'auditLog', 'ignoreExistingRoles', 'reapplyOnStartup'].sort(),\n  'Auto Roles settings schema must discard unsupported keys.'\n);"
          if assertion.strip() not in s:
              if anchor not in s:
                  raise SystemExit('smoke test anchor not found')
              s = s.replace(anchor, anchor + assertion, 1)
              smoke.write_text(s)
          PY
      - name: Verify syntax and smoke test
        run: |
          node --check src/modules/roleStudio/autoRoles/autoRoles.js
          node --check tools/role-studio-smoke-test.js
          node tools/role-studio-smoke-test.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/roleStudio/autoRoles/autoRoles.js tools/role-studio-smoke-test.js
          git commit -m "Harden Auto Roles settings schema"
          git push origin dev
      - name: Remove workflow
        run: |
          git pull --rebase origin dev
          git rm .github/workflows/one-time-auto-roles-settings-hardening.yml
          git commit -m "Remove one-time Auto Roles settings workflow"
          git push origin dev
