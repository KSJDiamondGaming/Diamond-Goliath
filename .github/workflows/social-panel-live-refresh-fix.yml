name: Apply Social Studio panel live refresh fix

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/social-panel-live-refresh-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Patch Social Studio panel
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/modules/socialStudio/socialAlerts/socialStudioPanel.js')
          s = p.read_text()

          old = "return { embeds: [embed(c, '📣 Social Studio', d, requestedBy)], components: [row(btn(`${P}creators`, '👥 Creator Profiles', ButtonStyle.Primary), btn(`${P}channels`, '📂 Channels'), btn(`${P}templates`, '🎨 Templates', ButtonStyle.Secondary, true)), navigation('main')] };"
          new = "return { embeds: [embed(c, '📣 Social Studio', d, requestedBy)], components: [row(btn(`${P}creators`, '👥 Creator Profiles', ButtonStyle.Primary), btn(`${P}channels`, '📂 Channels'), btn(`${P}refresh`, '🔄 Refresh', ButtonStyle.Secondary), btn(`${P}templates`, '🎨 Templates', ButtonStyle.Secondary, true)), navigation('main')] };"
          if old not in s:
              raise SystemExit('main panel component pattern not found')
          s = s.replace(old, new, 1)

          old = "if (id === `${P}main`) {\n    return respond(\n      i,\n      buildMainPanel(i, config),\n    );\n  }"
          new = "if (id === `${P}main` || id === `${P}refresh`) {\n    return respond(\n      i,\n      buildMainPanel(i.guild, who(i)),\n    );\n  }"
          if old not in s:
              raise SystemExit('main handler pattern not found')
          s = s.replace(old, new, 1)

          old = "if (i.customId === 'admin:social') {\n    return respond(\n      i,\n      buildMainPanel(i, config),\n    );\n  }"
          new = "if (i.customId === 'admin:social') {\n    return respond(\n      i,\n      buildMainPanel(i.guild, who(i)),\n    );\n  }"
          if old not in s:
              raise SystemExit('admin social handler pattern not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
      - name: Remove temporary workflow
        run: rm .github/workflows/social-panel-live-refresh-fix.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/socialStudio/socialAlerts/socialStudioPanel.js .github/workflows/social-panel-live-refresh-fix.yml
          git commit -m "fix: refresh Social Studio dashboard from current guild state"
          git push origin beta
