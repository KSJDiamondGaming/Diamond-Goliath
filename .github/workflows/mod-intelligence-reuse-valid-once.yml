name: Apply Intelligence Reuse Valid Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/mod-intelligence-reuse-valid-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply message reuse patch
        shell: bash
        run: |
          B64=''
          B64+=''
          B64+=''
          printf '%s' "$B64" | base64 -d > /tmp/mod-reuse.py
          python /tmp/mod-reuse.py
      - name: Validate changed source
        run: |
          node --check src/core/administration/mod/interactions.js
          node --check src/core/administration/mod/intelligence.js
          node --check src/core/ui/interactionResponse.js
      - name: Remove temporary workflow
        run: rm -f .github/workflows/mod-intelligence-reuse-valid-once.yml
      - name: Run doctor
        run: npm run doctor
      - name: Build dashboard
        run: npx vite build src/dashboard --outDir ../../dist --emptyOutDir --logLevel warn
      - name: Commit clean source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/administration/mod/interactions.js src/core/administration/mod/intelligence.js src/core/ui/interactionResponse.js .github/workflows/mod-intelligence-reuse-valid-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(mod): reuse member intelligence messages'
          git push origin HEAD:dev
