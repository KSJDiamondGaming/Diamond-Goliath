name: Case Court Phase 17 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/case-court-phase17.py'
      - '.github/workflows/case-court-phase17-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply Court execution authority UX
        run: python3 .github/case-court-phase17.py
      - name: Validate source
        run: node --check src/core/administration/mod/caseCourt.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: npm run imports
      - name: Remove one-off files before Doctor
        run: |
          rm -f .github/case-court-phase17.py
          rm -f .github/workflows/case-court-phase17-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit Court execution authority UX
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(mod): align court controls with action authority' || exit 0
          git push origin HEAD:dev
