name: Expand Member Reputation Intelligence Once

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/expand-member-reputation-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply reputation patch
        run: python scripts/network-reputation-once.js

      - name: Validate source
        run: node --check src/core/administration/mod/intelligence.js

      - name: Remove temporary patch files
        run: rm -f scripts/network-reputation-once.js .github/workflows/expand-member-reputation-once.yml

      - name: Run project doctor
        run: npm run doctor

      - name: Build project
        run: npm run build

      - name: Commit clean feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(mod): add network reputation intelligence'
          git push origin HEAD:dev
