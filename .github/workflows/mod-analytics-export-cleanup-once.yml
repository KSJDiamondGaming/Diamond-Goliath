name: Apply Moderation Analytics Cleanup

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/mod-analytics-export-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply moderation cleanup
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, from, to, label) {
            if (!source.includes(from)) throw new Error(`${label}: source text not found`);
            return source.replace(from, to);
          }

          function removeBetween(source, startNeedle, endNeedle, label) {
            const start = source.indexOf(startNeedle);
            if (start < 0) throw new Error(`${label}: start not found`);
            const end = source.indexOf(endNeedle, start);
            if (end < 0) throw new Error(`${label}: end not found`);
            return source.slice(0, start) + source.slice(end);
          }

          function removeFunction(source, name) {
            const re = new RegExp(`(?:async\\s+)?function\\s+${name}\\s*\\(`);
            const match = re.exec(source);
            if (!match) return source;
            const start = match.index;
            const bodyStart = source.indexOf('{', start);
            if (bodyStart < 0) throw new Error(`${name}: body start not found`);
            let depth = 0;
            let state = 'code';
            let escaped = false;
            for (let i = bodyStart; i < source.length; i += 1) {
              const ch = source[i];
              const next = source[i + 1];
              if (state === 'single') { if (escaped) escaped = false; else if (ch === '\\') escaped = true; else if (ch === "'") state = 'code'; continue; }
              if (state === 'double') { if (escaped) escaped = false; else if (ch === '\\') escaped = true; else if (ch === '"') state = 'code'; continue; }
              if (state === 'template') { if (escaped) escaped = false; else if (ch === '\\') escaped = true; else if (ch === '`') state = 'code'; continue; }
              if (state === 'line') { if (ch === '\n') state = 'code'; continue; }
              if (state === 'block') { if (ch === '*' && next === '/') { state = 'code'; i += 1; } continue; }
              if (ch === "'") { state = 'single'; continue; }
              if (ch === '"') { state = 'double'; continue; }
              if (ch === '`') { state = 'template'; continue; }
              if (ch === '/' && next === '/') { state = 'line'; i += 1; continue; }
              if (ch === '/' && next === '*') { state = 'block'; i += 1; continue; }
              if (ch === '{') depth += 1;
              else if (ch === '}') {
                depth -= 1;
                if (depth === 0) {
                  let end = i + 1;
                  while (source[end] === '\r' || source[end] === '\n') end += 1;
                  return source.slice(0, start) + source.slice(end);
                }
              }
            }
            throw new Error(`${name}: unterminated function`);
          }

          // panel.js
          const panelPath = 'src/core/administration/mod/panel.js';
          let panel = fs.readFileSync(panelPath, 'utf8');
          panel = panel.replace("const crypto = require('node:crypto');\n", '');
          panel = panel.replace("const PRESET_ACTIONS = new Set(['warn', 'timeout', 'kick', 'ban']);\n", '');
          panel = panel.replace('const MAX_PRESETS = 20;\n', '');
          panel = removeBetween(panel, 'function normalizePreset(', 'function parseJsonValue(', 'preset implementation block');
          for (const name of ['openPresetManager', 'handlePresetInteraction', 'handlePresetModal']) panel = removeFunction(panel, name);
          panel = panel.replace(/\n\s*openPresetManager,?/g, '');
          panel = panel.replace(/\n\s*handlePresetInteraction,?/g, '');
          panel = panel.replace(/\n\s*handlePresetModal,?/g, '');
          panel = panel.replace(/\n\s*presetIdFromSubmission,?/g, '');
          panel = panel.replace(/\n\s*markPresetUsed,?/g, '');
          panel = panel.replace(/\n\s*getModerationPresets,?/g, '');
          panel = panel.replace(/\n\s*getModerationPreset,?/g, '');

          panel = removeBetween(panel, 'function buildDashboardNav(', 'function buildUserSelectRow(', 'dashboard nav');
          panel = panel.replace('function buildUserSelectRow(', `function buildDashboardNav(targetId, activeView, member, guild) {
            const active = normalizeView(activeView);
            const id = targetId || 'none';
            const rows = [];
            if (active !== 'actions' && targetId) {
              const candidates = [
                ['actions', '⚡ Moderation'],
                ['intelligence', '🧠 Intelligence'],
                ['cases', '📁 Cases'],
              ]
                .filter(([view]) => canViewDashboardSection(member, guild, view))
                .filter(([view]) => view !== active);
              const buttons = candidates.map(([view, label]) => new ButtonBuilder()
                .setCustomId(\`mod_dashboard:\${id}:\${view}\`)
                .setLabel(label)
                .setStyle(ButtonStyle.Secondary));
              if (buttons.length) rows.push(new ActionRowBuilder().addComponents(buttons));
            }
            const finalButtons = [];
            if (canUseModAction(member, guild, 'export_cases')) finalButtons.push(
              new ButtonBuilder().setCustomId(\`mod_export_cases:\${id}\`).setLabel('📤 Export').setStyle(ButtonStyle.Secondary)
            );
            finalButtons.push(new ButtonBuilder().setCustomId('admin:home').setLabel('⬅️ Back').setStyle(ButtonStyle.Secondary));
            rows.push(new ActionRowBuilder().addComponents(finalButtons));
            return rows;
          }
          function buildUserSelectRow(`);

          panel = removeBetween(panel, 'function buildActionRows(', 'function buildIntelligenceRows(', 'action rows');
          panel = panel.replace('function buildIntelligenceRows(', `function buildActionRows(target, stats, member, guild) {
            const id = target?.id || 'none';
            const p = actionPermissions(member, guild);
            const disabled = !target;
            const row1 = [];
            if (canViewDashboardSection(member, guild, 'intelligence')) row1.push(new ButtonBuilder().setCustomId(\`mod_dashboard:\${id}:intelligence\`).setLabel('🧠 Intelligence').setStyle(ButtonStyle.Secondary).setDisabled(disabled));
            if (canViewDashboardSection(member, guild, 'cases')) row1.push(new ButtonBuilder().setCustomId(\`mod_dashboard:\${id}:cases\`).setLabel('📁 Cases').setStyle(ButtonStyle.Secondary).setDisabled(disabled));
            if (p.timeout) row1.push(createSecondaryButton(\`mod_open_timeout:\${id}\`, 'Timeout', getEmoji('TIMEOUT', '⏳')).setDisabled(disabled));
            if (p.warn) row1.push(createSecondaryButton(\`mod_open_warn:\${id}\`, 'Warn', getEmoji('WARNING', '⚠️')).setDisabled(disabled));
            const row2 = [];
            if (p.kick) row2.push(createDangerButton(\`mod_open_kick:\${id}\`, 'Kick', getEmoji('KICK', '👢')).setDisabled(disabled));
            if (p.ban) row2.push(createDangerButton(\`mod_open_ban:\${id}\`, 'Ban', getEmoji('BAN', '🔨')).setDisabled(disabled));
            if (p.removeTimeout) row2.push(createSecondaryButton(\`mod_remove_timeout:\${id}\`, 'Clear Timeout', getEmoji('SUCCESS', '✅')).setDisabled(disabled || !targetHasActiveTimeout(target)));
            if (p.removeWarning) row2.push(createSecondaryButton(\`mod_remove_warning:\${id}\`, 'Remove Warn', getEmoji('DELETE', '🗑️')).setDisabled(disabled || Number(stats?.warningCount || 0) <= 0));
            const row3 = [];
            if (canUseModAction(member, guild, 'view_analytics')) row3.push(new ButtonBuilder().setCustomId(\`mod_dashboard:\${id}:analytics\`).setLabel('📊 Analytics').setStyle(ButtonStyle.Secondary));
            return [buttonRow(row1), buttonRow(row2), buttonRow(row3)].filter(Boolean);
          }
          function buildIntelligenceRows(`);

          panel = replaceOnce(panel,
            'const embeds = []; const components = [buildUserSelectRow()];',
            "const embeds = []; const components = safeView === 'analytics' ? [] : [buildUserSelectRow()];",
            'analytics component row limit fix'
          );
          if (/preset/i.test(panel)) throw new Error('panel.js still contains preset references');
          fs.writeFileSync(panelPath, panel);

          // interactions.js
          const interactionsPath = 'src/core/administration/mod/interactions.js';
          let interactions = fs.readFileSync(interactionsPath, 'utf8');
          for (const token of ['openPresetManager', 'handlePresetInteraction', 'handlePresetModal', 'presetIdFromSubmission', 'markPresetUsed', 'getModerationPreset']) {
            interactions = interactions.replace(new RegExp(`\\n\\s*${token},?`, 'g'), '');
          }
          for (const name of ['setInputValueIfPresent', 'buildSafePresetEditorModal', 'handlePresetEditorButton', 'trackPresetSubmission']) interactions = removeFunction(interactions, name);
          interactions = interactions.replace(/\n\s*if \(result\?\.ok\) trackPresetSubmission\(i\);/g, '');
          interactions = interactions.replace('[handlePresetInteraction, handleCaseSearchSelect]', '[handleCaseSearchSelect]');
          interactions = interactions.replace('[handleExportInteraction, handlePresetEditorButton, handlePresetInteraction, handleConfirmButton,', '[handleExportInteraction, handleConfirmButton,');
          interactions = interactions.replace('[submitInvestigationNote, handleExportInteraction, handlePresetModal, handleCaseSearchModal,', '[submitInvestigationNote, handleExportInteraction, handleCaseSearchModal,');
          if (/preset/i.test(interactions)) throw new Error('interactions.js still contains preset references');
          fs.writeFileSync(interactionsPath, interactions);

          // permissions.js
          const permissionsPath = 'src/core/administration/mod/permissions.js';
          let permissions = fs.readFileSync(permissionsPath, 'utf8');
          permissions = permissions.split('\n').filter((line) => !/manage_presets|mod\.presets/.test(line)).join('\n');
          if (/preset/i.test(permissions)) throw new Error('permissions.js still contains preset references');
          fs.writeFileSync(permissionsPath, permissions);
          NODE

          grep -q "📊 Analytics" src/core/administration/mod/panel.js
          grep -q "📤 Export" src/core/administration/mod/panel.js
          ! grep -Rni "preset" src/core/administration/mod/panel.js src/core/administration/mod/interactions.js src/core/administration/mod/permissions.js
          git rm .github/workflows/mod-analytics-export-cleanup-once.yml
          node --check src/core/administration/mod/panel.js
          node --check src/core/administration/mod/interactions.js
          node --check src/core/administration/mod/permissions.js
          npm run syntax
          npm run imports
          npm run doctor
      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KSJHub"
          git config user.email "actions@users.noreply.github.com"
          git add src/core/administration/mod/panel.js src/core/administration/mod/interactions.js src/core/administration/mod/permissions.js
          git diff --cached --check
          git commit -m "refactor(mod): remove presets and fix analytics workspace"
          git push origin HEAD:dev
