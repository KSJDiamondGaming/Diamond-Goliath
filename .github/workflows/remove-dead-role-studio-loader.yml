name: Remove Dead Role Studio Loader

on:
  push:
    branches: [dev]
    paths:
      - .github/remove-dead-role-studio-loader.trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Remove dead loader
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/modules/roleStudio/reactionRoles/reactionRolesPanel.js';
          const source = fs.readFileSync(file, 'utf8');
          const target = "require('../roleStudioNavigationPatch');\n";
          if (!source.includes(target)) throw new Error('Dead Role Studio navigation loader not found.');
          fs.writeFileSync(file, source.replace(target, ''), 'utf8');
          NODE
      - name: Verify
        run: |
          node --check src/modules/roleStudio/reactionRoles/reactionRolesPanel.js
          node scripts/goliath.js source
          node scripts/goliath.js imports
          ! grep -R "roleStudioNavigationPatch" src --include='*.js'
      - name: Commit cleanup
        run: |
          rm -f .github/remove-dead-role-studio-loader.trigger
          rm -f .github/workflows/remove-dead-role-studio-loader.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove dead Role Studio navigation loader"
          git push origin dev
