name: Case Court Phase 15 Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/case-court-phase15.py'
      - '.github/workflows/case-court-phase15-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply Court appeal idempotency
        run: python3 .github/case-court-phase15.py
      - name: Validate source
        run: node --check src/core/administration/mod/cases.js
      - name: Install dependencies
        run: npm ci
      - name: Validate imports
        run: npm run imports
      - name: Remove one-off files before Doctor
        run: rm -f .github/case-court-phase15.py .github/workflows/case-court-phase15-once.yml
      - name: Run Doctor
        run: npm run doctor
      - name: Commit Court appeal idempotency
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(mod): make court appeal remedies idempotent'
          git push origin HEAD:dev
