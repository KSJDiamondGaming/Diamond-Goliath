name: Polish Member Intelligence Once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/polish-member-intelligence-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rewrite Member Intelligence presentation
        env:
          PATCH_B64: " "
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/polish.py
          python3 /tmp/polish.py

      - name: Validate rewritten source
        run: |
          node --check src/core/administration/mod/intelligence.js
          npm run contracts

      - name: Remove one-off workflow before Doctor
        run: git rm -f .github/workflows/polish-member-intelligence-once.yml

      - name: Run Doctor
        run: npm run doctor

      - name: Commit polished workspace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/administration/mod/intelligence.js .github/workflows/polish-member-intelligence-once.yml
          git diff --cached --check
          git commit -m 'refactor(mod): polish member intelligence presentation'
          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev
